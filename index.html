    '<br>Best ever: '+fmtTime(best.fastestMs)+' &middot; smoothest '+best.fewestBumps+' bumps'+
    '<br>Runs together: '+runs+'</p>'+
    '<p class="hint">Hold both buttons together to dig again</p>';

  // §11: the unlock ceremony precedes the stats when the last peg is earned.
  // With three worlds lit at boot this fires exactly once in the life of the
  // game — Deep Water. Sealed playtest never runs it (all four are unlocked).
  const unlocked = playtest? [] : newlyUnlocked(
    { days: prog.prev, streakBest: prevStreakBest },
    { days: prog.now,  streakBest: streakBest });
  if(CONFIG.rackEnabled && unlocked.length){
    const highlight = unlocked;
    const sub = 'This one is not ours.';
    G.rcPhase = 'ceremony';
    G.rcRack = { statsHtml, golden: awardedGold };
    showPanel(
      '<div class="ceremony">'+
      '<div class="rackHost" data-highlight="'+highlight.join(',')+'"'+goldHost+'></div>'+
      '<h1>A new hat.</h1>'+
      '<p class="sub">'+sub+'</p>'+
      '<p class="hint">Hold both buttons together to go on</p>'+
      '</div>'
    );
    AudioFX.unlockFanfare();
    buzz([40,60,40,60,120]);
    if(!reducedMotion) rackCelebrationParticles();
  }else{
    G.rcPhase = 'stats';
    showPanel(statsHtml);
    if(awardedGold){ AudioFX.golden(); buzz([30,50,30,50,30,50,220]); }
  }
}

/* Ceremony → stats: the chord after the rack ceremony reveals the stats. */
function showRunStats(){
  G.rcPhase = 'stats';
  showPanel(G.rcRack.statsHtml);
  if(G.rcRack.golden){ AudioFX.golden(); buzz([30,50,30,50,30,50,220]); }
}

/* ---------------- Journal (M4) --------------------------------------------
   One stamped keepsake per completed run: date, stats, and a tiny thumbnail
   of the final maze with the pair's path drawn (footprints in the desert).
   Shared across worlds — one journal, two worlds. Minimal surface in v2:
   the fresh page is shown on the run-complete card; a browsable book waits.
   localStorage only, capped, and it trims oldest-first if storage is full
   so a run is never lost to a full disk.                                   */
function dateStamp(){
  const d = new Date();
  const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return d.getDate()+' '+mon+' '+d.getFullYear();
}

function renderRunThumbnail(){
  const m = G.maze;
  const cell = 8, pad = 3;
  const cv = document.createElement('canvas');
  cv.width = m.cols*cell + pad*2;
  cv.height = m.rowsN*cell + pad*2;
  const t = cv.getContext('2d');
  const hat = (G.world==='hat'), forest = (G.world==='forest'), deep = (G.world==='deep');
  t.fillStyle = deep? DPAL.water : forest? FPAL.bark : hat? HPAL.sand : PAL.soilDeep;
  t.fillRect(0,0,cv.width,cv.height);
  // Deep Water keeps only what was lit — the unseen dark stays, so the keepsake
  // is a different shape every day (§13). Other worlds draw the whole map.
  t.fillStyle = deep? DPAL.waterLit : forest? FPAL.floor : hat? HPAL.path : PAL.tunnel;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r)) continue;
    if(deep && !G.lit.has(c+','+r)) continue;
    t.fillRect(pad+c*cell, pad+r*cell, cell, cell);
  }
  const cx = (c)=> pad + c*cell + cell/2, cy = (r)=> pad + r*cell + cell/2;
  const inkTrace = (trace, style, w)=>{
    if(!trace || trace.length<2) return;
    t.strokeStyle = style; t.lineWidth = w; t.lineJoin='round'; t.lineCap='round';
    t.beginPath();
    trace.forEach((p,i)=>{ const x=cx(p.c), y=cy(p.r); i? t.lineTo(x,y) : t.moveTo(x,y); });
    t.stroke();
  };
  if(forest){ // both legs — leg 1 soft grey, leg 2 charcoal (a different shape each day)
    inkTrace(G.traceLeg1, 'rgba(233,231,214,0.5)', Math.max(1.5, cell*0.24));
    inkTrace(G.trace,     FPAL.charcoal,           Math.max(1.5, cell*0.32));
  }else if(deep){ // a dotted bubble-trail through the lit water
    t.setLineDash([cell*0.35, cell*0.4]);
    inkTrace(G.trace, 'rgba(232,224,206,0.9)', Math.max(1.5, cell*0.28));
    t.setLineDash([]);
  }else if(G.trace.length > 1){ // the wobbly route, inked (dashed = footprints)
    if(hat) t.setLineDash([cell*0.5, cell*0.4]);
    inkTrace(G.trace, PAL.gem, Math.max(1.5, cell*0.32));
    t.setLineDash([]);
  }
  t.fillStyle = PAL.paper; // a star at every thud
  G.bumps.forEach(b=>{ t.beginPath(); t.arc(cx(b.c), cy(b.r), cell*0.24, 0, Math.PI*2); t.fill(); });
  return cv.toDataURL('image/jpeg', 0.7);
}

function appendJournal(entry){
  let journal = LS.get('journal', []);
  if(!Array.isArray(journal)) journal = [];
  journal.push(entry);
  while(journal.length > 200) journal.shift();       // keep the last ~200 days
  while(journal.length){                              // trim oldest until it fits
    try{ localStorage.setItem('tunnels:journal', JSON.stringify(journal)); break; }
    catch(e){ journal.shift(); }
  }
  return journal;
}

function stampJournal(tot, streak){
  const thumb = renderRunThumbnail();
  const entry = { day: dayNumber(), date: dateStamp(), seed: G.runSeed, world: G.world,
    timeMs: tot.time, bumps: tot.bumps, gems: tot.gems, streakDay: streak.count, thumb };
  const journal = appendJournal(entry);
  const n = journal.length;
  return '<div class="stamp">'+
    '<img alt="today’s maze" src="'+thumb+'">'+
    '<div class="cap">'+WORLD().label+' &middot; '+entry.date+'</div>'+
    '<div class="sub">Pressed into the journal &middot; '+n+' '+(n===1?'day':'days')+'</div>'+
    '</div>';
}

function nextAfterReveal(){
  if(G.stageIdx < 2){ setupStage(G.stageIdx+1); }
  else{ finishRun(); }
}

function newRun(){
  G.stageTimes = []; G.stageBumpCounts = []; G.stageGemCounts = [];
  G.stagePars = []; G.rcPhase = 'stats'; G.rcRack = null;
  G.runSeed = dailySeed(); // re-read: a run started after midnight gets the new day
  setupStage(0);
}

/* ---------------- Particles ---------------------------------------------- */
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function diggerXY(){
  let p;
  if(G.phase==='digging' && G.moveTo){
    const a = cellCenter(G.moveFrom.c, G.moveFrom.r), b = cellCenter(G.moveTo.c, G.moveTo.r);
    p = { x: a.x+(b.x-a.x)*G.moveT, y: a.y+(b.y-a.y)*G.moveT };
  }else if(G.phase==='bouncing' && G.bouncePath && G.bouncePath.length>1){
    const i = Math.min(G.bounceIdx, G.bouncePath.length-2);
    const a = cellCenter(G.bouncePath[i].c, G.bouncePath[i].r);
    const b = cellCenter(G.bouncePath[i+1].c, G.bouncePath[i+1].r);
    p = { x: a.x+(b.x-a.x)*G.bounceT, y: a.y+(b.y-a.y)*G.bounceT };
  }else{
    p = cellCenter(G.cell.c, G.cell.r);
  }
  if(G.phase==='stunned' && G.stunAfter==='bounce'){
    // comedy recoil away from the wall it just hit
    const k = CONFIG.bumpBouncePx * (G.stunT/CONFIG.bumpStunMs);
    p = { x: p.x - G.heading.dx*k, y: p.y - G.heading.dy*k };
  }
  return p;
}

function dustPuff(){
  if(reducedMotion) return;
  const p = diggerXY();
  for(let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2, sp = 20+Math.random()*60;
    G.particles.push({ x:p.x+G.heading.dx*cs*0.4, y:p.y+G.heading.dy*cs*0.4,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-30, life:0.5+Math.random()*0.3,
      size:cs*(0.08+Math.random()*0.1), color:WORLD().dust });
  }
}

function collectGemFX(cell){
  AudioFX.gem();
  buzz(15);
  if(reducedMotion) return;
  const p = cellCenter(cell.c, cell.r);
  for(let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2, sp = 30+Math.random()*70;
    G.particles.push({ x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-40,
      life:0.5+Math.random()*0.4, size:cs*(0.06+Math.random()*0.08),
      color: i%2? PAL.gem : '#E8B0B8' });
  }
}

function breakthroughParticles(){
  const p = cellCenter(G.maze.exit.c, G.maze.exit.r);
  const n = reducedMotion? 6 : 26;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 40+Math.random()*140;
    const cols = WORLD().burst;
    G.particles.push({ x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80,
      life:0.7+Math.random()*0.6, size:cs*(0.1+Math.random()*0.18),
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
}

/* §11: a gentle gold shower behind the rack for the unlock ceremony. Falls
   from the top of the canvas; the DOM card sits over it, so it reads as the
   rack raining gold. Respects reduced motion (the caller gates it).        */
function rackCelebrationParticles(){
  const n = 22;
  for(let i=0;i<n;i++){
    G.particles.push({ x: Math.random()*W, y: -10 - Math.random()*40,
      vx:(Math.random()-0.5)*30, vy: 60+Math.random()*90,
      life:1.0+Math.random()*0.8, size: 3+Math.random()*4,
      color: ['#C9A034','#E9D08A','#B23A48'][Math.floor(Math.random()*3)] });
  }
}

/* ---------------- Update loop -------------------------------------------- */
let lastT = performance.now();
function update(dt){
  // stage clock runs only while actually underground
  if(PLAY_PHASES.has(G.phase)) G.stageMs += dt;

  // §13: the briefing flash — the whole ocean lit, then it fades to dark. Untimed
  // planning stays untimed; the flash just runs out and the fog closes in.
  if(G.world==='deep' && G.phase==='briefing' && G.flashT>0) G.flashT -= dt;
  // the lantern lights every open cell it passes over, permanently — the seen-set
  // the pair carry in their heads. Marked while actually swimming.
  if(G.world==='deep' && PLAY_PHASES.has(G.phase)) markLit();

  if(G.phase==='countdown'){
    G.countdownT -= dt;
    if(G.countdownT<=0){
      document.getElementById('go').style.display = 'none';
      beginMove();
    }
  }
  else if(G.phase==='digging'){
    G.moveT += dt/1000 * G.digSpeed;
    if(G.moveT>=1){ arriveAt({...G.moveTo}); }
  }
  else if(G.phase==='junction'){
    G.recueMs += dt;
    if(G.recueMs >= CONFIG.junctionRecueMs){ G.recueMs = 0; AudioFX.junctionCue(); buzz(20); }
    if(G.pendingSide){ // single press waits briefly for its chord partner
      G.pendingMs += dt;
      if(G.pendingMs >= CONFIG.chordWindowMs){ chooseAtJunction(G.pendingSide); }
    }
    if(CONFIG.junctionPauseMs > 0){
      G.junctionWaitMs += dt;
      if(G.junctionWaitMs >= CONFIG.junctionPauseMs){ G.junctionWaitMs = 0; chooseStraight(false); }
    }
  }
  else if(G.phase==='stunned'){
    G.stunT -= dt;
    if(G.stunT<=0){
      if(G.stunAfter==='bounce') startBounce();
      else{ G.helmetSlip = false; G.phase = 'junction'; G.recueMs = 0; AudioFX.junctionCue(); }
    }
  }
  else if(G.phase==='bouncing'){
    G.bounceT += dt/1000 * G.digSpeed * CONFIG.bounceSpeedMult;
    while(G.bounceT>=1 && G.phase==='bouncing'){
      G.bounceT -= 1; G.bounceIdx++;
      if(G.bounceIdx >= G.bouncePath.length-1){ endBounce(); }
    }
  }
  else if(G.phase==='breakthrough'){
    G.bannerT -= dt;
    if(G.bannerT<=0) showReveal();
  }
  else if(G.phase==='speaking'){       // §12: an animal's bubble holds, then acts
    G.speaker.t += dt;
    if(G.speaker.t >= CONFIG.speakerLineMs){
      const after = G.speakAfter;
      G.speaker = null; G.speakAfter = null;
      if(after==='redpage') startRedPage();
      else politeReturn();
    }
  }
  else if(G.phase==='redpage'){        // §12: the full-bleed red beat, then leg 2
    G.redPageT -= dt;
    if(G.redPageT<=0) beginLeg2();
  }
  else if(G.phase==='deepEnding'){     // §13: the plants hold, then the breakthrough
    G.deepEndingT -= dt;
    if(G.deepEndingT<=0) breakthrough();
  }
  else if(G.phase==='runComplete'){
    G.snackT += dt;
  }
  else if(G.phase==='picker' && G.pendingSide){
    G.pendingMs += dt;
    if(G.pendingMs >= CONFIG.chordWindowMs){
      const side = G.pendingSide; G.pendingSide = null;
      if(G.pickerWorlds.length > 2) stepPicker(side==='left'? -1 : 1);
      else chooseWorld(side==='left'? G.pickerWorlds[0] : (G.pickerWorlds[1] || G.pickerWorlds[0]));
    }
  }

  if(G.shakeT>0) G.shakeT -= dt;

  // breadcrumbs for the dog — it retraces the digger's exact path
  if(PLAY_PHASES.has(G.phase)){
    const p = diggerXY();
    const last = G.crumbs[G.crumbs.length-1];
    if(!last || Math.hypot(p.x-last.x, p.y-last.y) > 1.5){
      G.crumbs.push({x:p.x, y:p.y});
      if(G.crumbs.length > 600) G.crumbs.shift();
    }
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt/1000;
    if(p.life<=0){ G.particles.splice(i,1); continue; }
    p.vy += 260*dt/1000;
    p.x += p.vx*dt/1000; p.y += p.vy*dt/1000;
  }
}

/* ---------------- Render -------------------------------------------------- */
function render(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  if(G.shakeT>0 && !reducedMotion){
    const amp = 5 * (G.shakeT/CONFIG.shakeMs);
    ctx.translate((Math.random()-0.5)*2*amp, (Math.random()-0.5)*2*amp);
  }

  if(staticLayer) ctx.drawImage(staticLayer, 0, 0, W, H);

  // dug tunnel / trodden trail — visibly lighter, like exposed dry dirt
  ctx.fillStyle = WORLD().dugColour || PAL.tunnel;
  G.dug.forEach(k=>{
    const [c,r] = k.split(',').map(Number);
    ctx.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  });

  WORLD().drawExtras(now);
  WORLD().drawExitMarker(now);

  if(G.phase==='reveal' || G.phase==='runComplete') WORLD().drawTrail();

  if(CONFIG.showLiveDigger || !PLAY_PHASES.has(G.phase)){
    if(G.phase==='briefing' || G.phase==='countdown' || G.phase==='picker'){
      WORLD().drawWaiting(now);
    }else{
      const p = diggerXY();
      WORLD().drawAvatar(p.x, p.y, now);
      if(WORLD().companion && (WORLD().companionOn? WORLD().companionOn() : CONFIG.showDog)){
        const d = dogXY();
        WORLD().drawCompanion(d, now);
      }
    }
  }

  // particles
  G.particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life*2));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  if(WORLD().overlay) WORLD().overlay(now);       // §13: Deep Water's fog mask
  if(G.phase==='runComplete') WORLD().reward(now);
  if(G.phase==='redpage') drawForestRedPage(now); // §12: covers everything

  if(CONFIG.debugOverlay) drawDebug();
}

function drawGemIcon(x, y, r){ // a bright faceted gem — collectible, on the path
  ctx.fillStyle = PAL.gem;
  ctx.beginPath();
  ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.82, y); ctx.lineTo(x, y+r); ctx.lineTo(x-r*0.82, y);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(242,232,216,0.45)'; // facet glint
  ctx.beginPath(); ctx.moveTo(x, y-r); ctx.lineTo(x+r*0.32, y-r*0.24); ctx.lineTo(x-r*0.28, y-r*0.2);
  ctx.closePath(); ctx.fill();
}

function drawGems(now){
  if(!G.gems || !G.gems.length) return;
  const revealing = (G.phase==='reveal' || G.phase==='runComplete');
  G.gems.forEach((g,i)=>{
    if(g.collected) return;                 // collected gems are gone
    const p = cellCenter(g.c, g.r);
    const pulse = reducedMotion? 1 : 0.86 + 0.14*Math.sin(now/300 + i*1.7);
    ctx.globalAlpha = revealing? 0.4 : 1;   // on the reveal, the ones we missed sit softly
    drawGemIcon(p.x, p.y, cs*0.22*pulse);
    ctx.globalAlpha = 1;
  });
}

function drawExitStar(now){
  const e = cellCenter(G.maze.exit.c, G.maze.exit.r);
  const pulse = reducedMotion? 0.25 : 0.18 + 0.12*Math.sin(now/400);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = PAL.paper;
  ctx.beginPath(); ctx.arc(e.x, e.y, cs*0.55, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.9;
  drawStar(e.x, e.y, cs*0.2, PAL.paper);
  ctx.globalAlpha = 1;
}

function wob(i){ // deterministic hand-inked wobble for the reveal line
  const x = Math.sin(i*127.1)*43758.5453;
  return (x - Math.floor(x) - 0.5) * cs*0.22;
}

function drawPathTrace(){
  if(G.trace.length<2) return;
  ctx.strokeStyle = PAL.gem;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = Math.max(2, cs*0.14);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  G.trace.forEach((cell,i)=>{
    const p = cellCenter(cell.c, cell.r);
    const x = p.x + wob(i), y = p.y + wob(i+911);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.globalAlpha = 1;
  drawBumpStars(); // a little star for every thud — the laugh-together markers
}

function drawStar(x, y, r, fill, stroke){
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0? r : r*0.45;
    const px = x+Math.cos(ang)*rad, py = y+Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
}

function drawDigger(x, y, now){
  // Always upright, mirrored by facing — never rotated (an upside-down
  // digger reads as nonsense to a small Navigator).
  const s = cs*0.62;
  const digging = G.phase==='digging';
  const bob = (!reducedMotion && digging)? Math.sin(now/70)*s*0.05 : 0;
  const jab = (!reducedMotion && digging)? Math.sin(now/60)*s*0.08 : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(G.facing, 1);
  ctx.translate(0, bob);
  // spade out front
  ctx.fillStyle = PAL.spade;
  ctx.fillRect(s*0.28+jab, -s*0.05, s*0.34, s*0.1);
  ctx.beginPath();
  ctx.moveTo(s*0.62+jab, -s*0.16); ctx.lineTo(s*0.88+jab, 0); ctx.lineTo(s*0.62+jab, s*0.16);
  ctx.closePath(); ctx.fill();
  // legs
  ctx.strokeStyle = PAL.overalls; ctx.lineWidth = Math.max(2, s*0.14); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-s*0.22, s*0.12); ctx.lineTo(-s*0.32, s*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.02, s*0.12); ctx.lineTo(-s*0.06, s*0.42); ctx.stroke();
  // body (overalls)
  ctx.fillStyle = PAL.overalls;
  roundedRect(-s*0.42, -s*0.22, s*0.55, s*0.44, s*0.16);
  // head
  ctx.fillStyle = PAL.skin;
  ctx.beginPath(); ctx.arc(s*0.2, -s*0.16, s*0.2, 0, Math.PI*2); ctx.fill();
  // deadpan dot eye — hidden when the helmet slips over it
  const slip = G.helmetSlip? s*0.16 : 0;
  if(!G.helmetSlip){
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(s*0.28, -s*0.18, s*0.035, 0, Math.PI*2); ctx.fill();
  }
  // hard hat
  ctx.fillStyle = PAL.hat;
  ctx.beginPath(); ctx.arc(s*0.2 + slip*0.6, -s*0.24 + slip*0.5, s*0.2, Math.PI, 0); ctx.fill();
  ctx.fillRect(s*0.2 - s*0.26 + slip*0.6, -s*0.26 + slip*0.5, s*0.52, s*0.06);
  ctx.restore();
}

/* From stage 2, a small cat sits on the roof. It never does anything except
   flick its tail. It is never mentioned. */
function drawCat(now){
  const hw = Math.min(46, skyH*0.9), hx = W*0.16, hh = hw*0.62;
  const peakX = hx + hw/2, peakY = skyH - hh - hw*0.42;
  const s = Math.max(9, hw*0.3);
  const x = peakX, y = peakY;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = PAL.ink;
  // tail — the only motion
  const flick = reducedMotion? 0 : Math.sin(now/700)*s*0.18;
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1.5, s*0.14); ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-s*0.42, -s*0.12);
  ctx.quadraticCurveTo(-s*0.75, -s*0.3, -s*0.7 - flick*0.3, -s*0.62 - flick);
  ctx.stroke();
  // sitting body
  ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.28, s*0.34, s*0.3, 0, 0, Math.PI*2); ctx.fill();
  // head + ears
  ctx.beginPath(); ctx.arc(s*0.22, -s*0.62, s*0.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s*0.06, -s*0.74); ctx.lineTo(s*0.08, -s*0.95); ctx.lineTo(s*0.2, -s*0.8); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s*0.3, -s*0.82); ctx.lineTo(s*0.38, -s*0.98); ctx.lineTo(s*0.42, -s*0.76); ctx.closePath(); ctx.fill();
  // deadpan eyes
  ctx.fillStyle = PAL.sky;
  ctx.beginPath(); ctx.arc(s*0.16, -s*0.64, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.3, -s*0.64, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Soft sparkle over the treasure — a whisper only the Navigator sees. */
function drawSparkles(now){
  G.treasure.forEach((t,i)=>{
    const p = cellCenter(t.c, t.r);
    const a = reducedMotion? 0.4 : 0.25 + 0.25*Math.sin(now/320 + i*2.1);
    if(a <= 0.05) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = PAL.paper; ctx.lineWidth = 1;
    const r = cs*0.16, sx = p.x + cs*0.28, sy = p.y - cs*0.3;
    ctx.beginPath(); ctx.moveTo(sx-r, sy); ctx.lineTo(sx+r, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy-r); ctx.lineTo(sx, sy+r); ctx.stroke();
    ctx.restore();
  });
}

/* Run complete: the traditional after-digging snack rises onto the screen —
   a pitcher of chocolate milk and a plate of animal biscuits. */
function drawSnackScene(now){
  const pop = i =>{
    if(reducedMotion) return 1;
    const p = Math.min(1, Math.max(0, (G.snackT - i*220)/380));
    return 1 - Math.pow(1-p, 3);
  };
  const cw = Math.min(320, W*0.86), ch = Math.min(160, H*0.26);
  const cxx = W/2, top = H*0.16;
  ctx.save();
  // picnic cloth
  const k0 = pop(0);
  ctx.globalAlpha = k0;
  ctx.translate(0, (1-k0)*24);
  ctx.fillStyle = PAL.paper;
  roundedRect(cxx-cw/2, top, cw, ch, 18);
  ctx.strokeStyle = PAL.ink; ctx.globalAlpha = k0*0.25; ctx.lineWidth = 1;
  ctx.strokeRect(cxx-cw/2+6, top+6, cw-12, ch-12);
  ctx.globalAlpha = k0;

  const baseY = top + ch*0.78;
  // pitcher of chocolate milk
  const k1 = pop(1);
  if(k1>0){
    ctx.save();
    const px = cxx - cw*0.28, ph = ch*0.52;
    ctx.translate(px, baseY); ctx.scale(k1, k1);
    ctx.fillStyle = '#7B5A3C'; // chocolate milk through the glass
    ctx.beginPath();
    ctx.moveTo(-ph*0.3, 0); ctx.lineTo(-ph*0.24, -ph*0.72);
    ctx.lineTo(-ph*0.34, -ph*0.86); ctx.lineTo(-ph*0.1, -ph*0.8); // spout
    ctx.lineTo(ph*0.24, -ph*0.8); ctx.lineTo(ph*0.3, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5C4023'; ctx.lineWidth = Math.max(1.5, ph*0.05); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ph*0.28, -ph*0.66); ctx.quadraticCurveTo(ph*0.56, -ph*0.5, ph*0.26, -ph*0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(242,232,216,0.5)'; // milky sheen
    ctx.fillRect(-ph*0.16, -ph*0.7, ph*0.09, ph*0.6);
    ctx.restore();
  }
  // glass, already poured
  const k2 = pop(2);
  if(k2>0){
    ctx.save();
    const gx = cxx - cw*0.04, gh = ch*0.34;
    ctx.translate(gx, baseY); ctx.scale(k2, k2);
    ctx.fillStyle = '#7B5A3C';
    ctx.fillRect(-gh*0.28, -gh*0.8, gh*0.56, gh*0.8);
    ctx.fillStyle = 'rgba(242,232,216,0.35)';
    ctx.fillRect(-gh*0.28, -gh*1.0, gh*0.56, gh*0.2);
    ctx.strokeStyle = 'rgba(51,41,31,0.4)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-gh*0.28, -gh*1.0, gh*0.56, gh);
    ctx.restore();
  }
  // animal biscuits ambling across the cloth
  const bisc = (i, bx, flip)=>{
    const k = pop(3+i);
    if(k<=0) return;
    ctx.save();
    ctx.translate(cxx + bx, baseY - ch*0.03); ctx.scale(k*(flip?-1:1), k);
    const s = ch*0.16;
    ctx.fillStyle = '#D9B98A';
    roundedRect(-s*0.55, -s*0.55, s*1.1, s*0.6, s*0.24);           // body
    ctx.beginPath(); ctx.arc(s*0.62, -s*0.5, s*0.3, 0, Math.PI*2); ctx.fill(); // head
    ctx.fillRect(-s*0.42, 0, s*0.2, s*0.3);                        // legs
    ctx.fillRect(s*0.22, 0, s*0.2, s*0.3);
    if(i===0){ ctx.fillRect(s*0.82, -s*0.5, s*0.26, s*0.12); }     // elephant trunk
    if(i===1){ ctx.beginPath(); ctx.arc(s*0.5, -s*0.82, s*0.12, 0, Math.PI*2); ctx.fill(); } // bear ear
    ctx.restore();
  };
  bisc(0, cw*0.12, false);
  bisc(1, cw*0.27, true);
  bisc(2, cw*0.40, false);
  ctx.restore();
}

/* The dog trots a fixed distance behind the digger along its exact trail —
   so it turns around and backs up after a bump, which is most of the joke. */
function dogXY(){
  const lag = (WORLD().companionLag? WORLD().companionLag() : CONFIG.dogLagTiles) * cs;
  const cr = G.crumbs;
  let pos = null;
  if(cr.length >= 2){
    let acc = 0;
    for(let i=cr.length-1; i>0; i--){
      const a = cr[i], b = cr[i-1];
      const seg = Math.hypot(a.x-b.x, a.y-b.y);
      if(acc + seg >= lag){
        const t = (lag - acc)/seg;
        pos = { x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t };
        break;
      }
      acc += seg;
    }
    if(!pos) pos = {...cr[0]};
  }else{
    const p = diggerXY();
    pos = { x: p.x, y: p.y };
  }
  let moving = false;
  if(G.dogPrev){
    const dx = pos.x - G.dogPrev.x;
    if(Math.abs(dx) > 0.4) G.dogFacing = dx > 0 ? 1 : -1;
    moving = Math.hypot(dx, pos.y - G.dogPrev.y) > 0.4;
  }
  G.dogPrev = { x: pos.x, y: pos.y };
  return { x: pos.x, y: pos.y, moving };
}

function drawDog(x, y, facing, moving, now, earPrick){
  const s = cs*0.4;
  const trot = (!reducedMotion && moving)? Math.sin(now/55)*s*0.09 : 0;
  ctx.save();
  ctx.translate(x, y + s*0.18);
  ctx.scale(facing, 1);
  ctx.translate(0, trot);
  const coat = '#8C7B66', dark = '#6E5F4D';
  // legs
  ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.5, s*0.14); ctx.lineCap='round';
  const step = (!reducedMotion && moving)? Math.sin(now/55)*s*0.14 : 0;
  ctx.beginPath(); ctx.moveTo(-s*0.32, s*0.1); ctx.lineTo(-s*0.32 - step, s*0.42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( s*0.18, s*0.1); ctx.lineTo( s*0.18 + step, s*0.42); ctx.stroke();
  // body
  ctx.fillStyle = coat;
  ctx.beginPath(); ctx.ellipse(-s*0.05, 0, s*0.42, s*0.24, 0, 0, Math.PI*2); ctx.fill();
  // tail — a happy stub
  const wag = (!reducedMotion)? Math.sin(now/90)*0.5 : 0;
  ctx.strokeStyle = coat; ctx.lineWidth = Math.max(1.5, s*0.12);
  ctx.beginPath(); ctx.moveTo(-s*0.45, -s*0.06);
  ctx.lineTo(-s*0.62, -s*0.22 - wag*s*0.12); ctx.stroke();
  // head
  ctx.fillStyle = coat;
  ctx.beginPath(); ctx.arc(s*0.42, -s*0.16, s*0.22, 0, Math.PI*2); ctx.fill();
  // snout
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(s*0.58, -s*0.1, s*0.12, s*0.08, 0, 0, Math.PI*2); ctx.fill();
  // the ear: floppy by default, pricked up near a gem (a whisper for the Navigator)
  ctx.fillStyle = dark;
  if(earPrick){
    ctx.beginPath();
    ctx.moveTo(s*0.3, -s*0.3); ctx.lineTo(s*0.37, -s*0.64); ctx.lineTo(s*0.48, -s*0.32);
    ctx.closePath(); ctx.fill();
  }else{
    ctx.beginPath();
    ctx.moveTo(s*0.34, -s*0.34); ctx.quadraticCurveTo(s*0.2, -s*0.1, s*0.34, -s*0.04);
    ctx.quadraticCurveTo(s*0.44, -s*0.16, s*0.34, -s*0.34);
    ctx.fill();
  }
  // deadpan dot eye
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(s*0.48, -s*0.22, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fill();
}

/* ================= World Two — THE HAT: desert drawing =================== */
const HPAL = {
  sand:'#DCC9A0', path:'#EADDBA', scrub:'#8A9B6E', scrubDark:'#6F815A',
  boulder:'#A79C88', log:'#B0A183', pool:'#5E7876', stone:'#B9AE97',
  shadow:'rgba(60,50,35,0.18)', shell:'#7A8560', shellDark:'#5F6A4A',
  neck:'#8A9467', foot:'#6F7A55', rock:'#B4A88F',
  // the hat — a tan cowboy hat, matte and flat; all darker than sand so it reads
  hatTan:'#C2A06A', hatCrown:'#A88752', hatShade:'#8E6F42',
};

function buildStaticHat(s, rnd, m){
  G.treasure = []; // no buried fortunes here — the joke is a second hat
  s.fillStyle = HPAL.sand; s.fillRect(0,0,W,H);

  // walkable sand paths, pale and trodden
  s.fillStyle = HPAL.path;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r)) s.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  }

  const deco = m.decor || HAT_DECOR[G.stageIdx];
  const lm = m.landmarks || HAT_LANDMARKS[G.stageIdx];
  const reserved = (c,r)=> lm.some(L=>L.c===c&&L.r===r) ||
    (deco.secondHat.c===c&&deco.secondHat.r===r) || (deco.lizard.c===c&&deco.lizard.r===r);

  // impassable scrub — flat shapes, single flat shadows cast to one side
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r) || reserved(c,r)) continue;
    if(rnd() < 0.18) continue; // the occasional gap of bare sand
    const x = ox+c*cs+cs/2, y = oy+r*cs+cs/2;
    const kind = rnd();
    if(kind < 0.45) drawBush(s, x, y, cs, rnd);
    else if(kind < 0.7) drawBoulder(s, x, y, cs, rnd);
    else if(kind < 0.85) drawPricklyPear(s, x, y, cs, rnd);
    else drawDune(s, x, y, cs, rnd);
  }

  // landmarks — bigger, distinct, nameable
  lm.forEach(L=> drawLandmark(s, ox+L.c*cs+cs/2, oy+L.r*cs+cs/2, cs, L.kind));

  // the second hat, half-buried in the sand, never acknowledged — same tan hat
  if(CONFIG.buriedSecondHat){
    const sh = deco.secondHat;
    const x = ox+sh.c*cs+cs/2, y = oy+sh.r*cs+cs/2;
    s.globalAlpha = 0.85;
    s.fillStyle = HPAL.hatTan; // the brim poking out of the sand
    s.beginPath(); s.ellipse(x, y+cs*0.12, cs*0.3, cs*0.13, 0.15, Math.PI, 0, true); s.fill();
    s.fillStyle = HPAL.hatShade; // the crown edge just visible above it
    s.beginPath(); s.ellipse(x, y+cs*0.02, cs*0.14, cs*0.08, 0.15, Math.PI, 0, true); s.fill();
    s.globalAlpha = 1;
  }

  // a rock for the lizard to sun on
  drawBoulder(s, ox+deco.lizard.c*cs+cs/2, oy+deco.lizard.r*cs+cs/2, cs, rnd);

  // THE HAT — visible from the very first frame
  const e = m.exit;
  drawHatIcon(s, ox+e.c*cs+cs/2, oy+e.r*cs+cs/2, cs*0.42);

  // the Watcher's rock (the tortoise itself is drawn live — it turns its head)
  s.fillStyle = HPAL.shadow;
  s.beginPath(); s.ellipse(W*0.5+botH*0.12, H-botH*0.38, botH*0.85, botH*0.32, 0, 0, Math.PI*2); s.fill();
  s.fillStyle = HPAL.rock;
  s.beginPath(); s.ellipse(W*0.5, H-botH*0.45, botH*0.8, botH*0.34, 0, 0, Math.PI*2); s.fill();

  // paper grain
  s.globalAlpha = 0.05;
  for(let i=0;i<W*H/160;i++){
    s.fillStyle = rnd()<0.5? '#000':'#fff';
    s.fillRect(rnd()*W, rnd()*H, 1, 1);
  }
  s.globalAlpha = 1;
}

function shadowBlob(s, x, y, rx, ry){
  s.fillStyle = HPAL.shadow;
  s.beginPath(); s.ellipse(x+rx*0.35, y+ry*0.45, rx, ry*0.8, 0, 0, Math.PI*2); s.fill();
}
function drawBush(s, x, y, sz, rnd){
  const r = sz*(0.28+rnd()*0.1);
  shadowBlob(s, x, y, r, r);
  s.fillStyle = HPAL.scrub;
  s.beginPath(); s.ellipse(x, y, r, r*0.85, 0, 0, Math.PI*2); s.fill();
  s.fillStyle = HPAL.scrubDark;
  s.beginPath(); s.ellipse(x-r*0.3, y+r*0.2, r*0.4, r*0.3, 0, 0, Math.PI*2); s.fill();
}
function drawBoulder(s, x, y, sz, rnd){
  const r = sz*(0.26+rnd()*0.1);
  shadowBlob(s, x, y, r, r);
  s.fillStyle = HPAL.boulder;
  s.beginPath(); s.ellipse(x, y, r, r*0.8, rnd()*0.6, 0, Math.PI*2); s.fill();
}
function drawPricklyPear(s, x, y, sz, rnd){
  const r = sz*0.2;
  shadowBlob(s, x, y, r*1.4, r);
  s.fillStyle = HPAL.scrubDark;
  s.beginPath(); s.ellipse(x-r*0.5, y, r*0.8, r, 0.4, 0, Math.PI*2); s.fill();
  s.beginPath(); s.ellipse(x+r*0.5, y-r*0.3, r*0.7, r*0.9, -0.4, 0, Math.PI*2); s.fill();
}
function drawDune(s, x, y, sz, rnd){
  s.fillStyle = 'rgba(60,50,35,0.08)';
  s.beginPath(); s.ellipse(x, y+sz*0.1, sz*0.4, sz*0.14, 0, 0, Math.PI); s.fill();
}
function drawLandmark(s, x, y, sz, kind){
  if(kind==='cactus'){
    shadowBlob(s, x, y+sz*0.1, sz*0.3, sz*0.2);
    s.strokeStyle = HPAL.scrubDark; s.lineCap='round'; s.lineWidth = sz*0.16;
    s.beginPath(); s.moveTo(x, y+sz*0.32); s.lineTo(x, y-sz*0.34); s.stroke();
    s.beginPath(); s.moveTo(x, y); s.lineTo(x-sz*0.24, y-sz*0.05); s.lineTo(x-sz*0.24, y-sz*0.22); s.stroke();
    s.beginPath(); s.moveTo(x, y+sz*0.12); s.lineTo(x+sz*0.24, y+sz*0.06); s.lineTo(x+sz*0.24, y-sz*0.12); s.stroke();
  }else if(kind==='stones'){
    shadowBlob(s, x, y, sz*0.3, sz*0.22);
    s.fillStyle = HPAL.stone;
    s.beginPath(); s.ellipse(x, y+sz*0.18, sz*0.3, sz*0.14, 0, 0, Math.PI*2); s.fill();
    s.beginPath(); s.ellipse(x, y, sz*0.22, sz*0.12, 0, 0, Math.PI*2); s.fill();
    s.beginPath(); s.ellipse(x, y-sz*0.16, sz*0.14, sz*0.1, 0, 0, Math.PI*2); s.fill();
  }else if(kind==='log'){
    shadowBlob(s, x, y, sz*0.36, sz*0.14);
    s.fillStyle = HPAL.log;
    s.save(); s.translate(x,y); s.rotate(0.35);
    s.fillRect(-sz*0.36, -sz*0.1, sz*0.72, sz*0.2);
    s.fillStyle = '#8F7F63';
    s.beginPath(); s.ellipse(sz*0.36, 0, sz*0.05, sz*0.1, 0, 0, Math.PI*2); s.fill();
    s.restore();
  }else if(kind==='pool'){ // dark pool
    s.fillStyle = HPAL.pool;
    s.beginPath(); s.ellipse(x, y, sz*0.34, sz*0.22, 0, 0, Math.PI*2); s.fill();
    s.strokeStyle = HPAL.path; s.lineWidth = 1;
    s.beginPath(); s.ellipse(x, y, sz*0.34, sz*0.22, 0, 0, Math.PI*2); s.stroke();
  }else if(kind==='flower'){ // the big flower — improbable and unremarked
    shadowBlob(s, x, y, sz*0.2, sz*0.16);
    s.fillStyle = '#D9A0A8';
    for(let i=0;i<6;i++){
      const a = i*Math.PI/3;
      s.beginPath(); s.ellipse(x+Math.cos(a)*sz*0.16, y+Math.sin(a)*sz*0.16, sz*0.12, sz*0.08, a, 0, Math.PI*2); s.fill();
    }
    s.fillStyle = '#C9A034';
    s.beginPath(); s.arc(x, y, sz*0.1, 0, Math.PI*2); s.fill();
  }else if(kind==='bird'){ // the sleepy bird — eyes shut, like somebody else here
    shadowBlob(s, x, y, sz*0.22, sz*0.16);
    s.fillStyle = '#9A8A74';
    s.beginPath(); s.ellipse(x, y+sz*0.06, sz*0.22, sz*0.17, 0, 0, Math.PI*2); s.fill();
    s.beginPath(); s.arc(x+sz*0.16, y-sz*0.12, sz*0.11, 0, Math.PI*2); s.fill();
    s.fillStyle = '#C9A034';
    s.beginPath(); s.moveTo(x+sz*0.26, y-sz*0.12); s.lineTo(x+sz*0.38, y-sz*0.09); s.lineTo(x+sz*0.26, y-sz*0.05);
    s.closePath(); s.fill();
    s.strokeStyle = PAL.ink; s.lineWidth = 1; s.globalAlpha = 0.6;
    s.beginPath(); s.arc(x+sz*0.18, y-sz*0.14, sz*0.03, 0.2, Math.PI-0.2); s.stroke(); // a closed eye
    s.globalAlpha = 1;
  }else{ // anthill — industrious neighbours
    shadowBlob(s, x, y, sz*0.24, sz*0.14);
    s.fillStyle = '#C4A87E';
    s.beginPath(); s.ellipse(x, y, sz*0.26, sz*0.18, 0, 0, Math.PI*2); s.fill();
    s.fillStyle = '#8F7658';
    s.beginPath(); s.arc(x, y, sz*0.07, 0, Math.PI*2); s.fill();
    s.fillStyle = PAL.ink; s.globalAlpha = 0.5;
    [[0.3,0.1],[0.38,0.2],[-0.32,0.16],[0.1,0.32]].forEach(([ax,ay])=>{
      s.fillRect(x+ax*sz, y+ay*sz, 1.5, 1.5);
    });
    s.globalAlpha = 1;
  }
}
function roundedRectOn(g,x,y,w,h,r){ // fills a stadium/rounded-rect on any context
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r);
  g.closePath(); g.fill();
}

/* A bird's-eye tan cowboy hat: wide flat brim, rounded crown, a centre crease
   with two front pinch dents — the crease is what makes it read as a hat, not
   a disc. The long axis is front-to-back (local +/-y), so it aligns with a
   facing. Shared by the goal marker, the worn hat, and the buried second hat. */
function topDownHat(g, x, y, r){
  // brim — an ellipse, longer front-to-back than side-to-side (not a circle)
  g.fillStyle = HPAL.hatTan;
  g.beginPath(); g.ellipse(x, y, r, r*1.05, 0, 0, Math.PI*2); g.fill();
  // crown — a stadium down the long axis
  const cw = r*0.5, ch = r*0.85;
  g.fillStyle = HPAL.hatCrown;
  roundedRectOn(g, x-cw/2, y-ch/2, cw, ch, cw*0.5);
  // crease — a narrow shade line down the centre of the crown
  g.fillStyle = HPAL.hatShade;
  g.beginPath(); g.ellipse(x, y, r*0.05, ch*0.42, 0, 0, Math.PI*2); g.fill();
  // two pinch dents near the front end of the crown (front = -y)
  g.beginPath(); g.ellipse(x-cw*0.26, y-ch*0.30, r*0.06, r*0.085, 0, 0, Math.PI*2); g.fill();
  g.beginPath(); g.ellipse(x+cw*0.26, y-ch*0.30, r*0.06, r*0.085, 0, 0, Math.PI*2); g.fill();
}

function drawHatIcon(s, x, y, r){ // the goal marker — the hat from above
  shadowBlob(s, x, y, r, r*0.8);
  topDownHat(s, x, y, r);
}
function drawHatPulse(now){
  const e = cellCenter(G.maze.exit.c, G.maze.exit.r);
  const pulse = reducedMotion? 0.2 : 0.12 + 0.1*Math.sin(now/400);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = PAL.paper; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(e.x, e.y, cs*0.6, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawSeeker(x, y, now){
  const s = cs*0.62;
  const walking = G.phase==='digging' || G.phase==='bouncing';
  const ang = Math.atan2(G.heading.dy, G.heading.dx) + Math.PI/2;
  const waddle = (!reducedMotion && walking)? Math.sin(now/120)*0.07 : 0;
  const tucked = G.helmetSlip; // the shell-bonk: everything disappears inside
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang + waddle);
  if(!tucked){
    const step = (!reducedMotion && walking)? Math.sin(now/120)*s*0.07 : 0;
    ctx.fillStyle = HPAL.foot;
    [[-0.3,-0.26,step],[0.3,-0.26,-step],[-0.3,0.28,-step],[0.3,0.28,step]].forEach(p=>{
      ctx.beginPath(); ctx.ellipse(p[0]*s, p[1]*s+p[2], s*0.1, s*0.13, 0, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = HPAL.neck; // head out front, deadpan
    ctx.beginPath(); ctx.ellipse(0, -s*0.48, s*0.13, s*0.17, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(-s*0.05, -s*0.54, s*0.025, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.05, -s*0.54, s*0.025, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = HPAL.shell;
  ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = HPAL.shellDark; ctx.lineWidth = Math.max(1, s*0.05);
  ctx.beginPath(); ctx.arc(0, 0, s*0.22, 0, Math.PI*2); ctx.stroke();
  for(let i=0;i<6;i++){
    const a = i*Math.PI/3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s*0.22, Math.sin(a)*s*0.22);
    ctx.lineTo(Math.cos(a)*s*0.35, Math.sin(a)*s*0.35);
    ctx.stroke();
  }
  // once won, the hat is worn and never comes off — it sits on the shell and
  // rotates with the tortoise (we're already in its rotated frame)
  if(G.phase==='breakthrough' || G.phase==='reveal' || G.phase==='runComplete'){
    topDownHat(ctx, 0, 0, s*0.3);
  }
  ctx.restore();
}

function drawWatcher(now){
  const wx = W*0.5, wy = H - botH*0.5;
  const p = diggerXY();
  const target = Math.atan2(p.y - wy, p.x - wx);
  let d = target - G.watcherAng;
  while(d >  Math.PI) d -= 2*Math.PI;
  while(d < -Math.PI) d += 2*Math.PI;
  G.watcherAng += d * (reducedMotion? 1 : 0.02); // the only camera in the game
  const s = botH*0.42;
  ctx.save();
  ctx.translate(wx, wy);
  ctx.fillStyle = HPAL.shell;
  ctx.beginPath(); ctx.arc(0, 0, s*0.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = HPAL.shellDark; ctx.lineWidth = Math.max(1, s*0.06);
  ctx.beginPath(); ctx.arc(0, 0, s*0.3, 0, Math.PI*2); ctx.stroke();
  ctx.rotate(G.watcherAng);
  ctx.fillStyle = HPAL.neck;
  ctx.beginPath(); ctx.ellipse(s*0.62, 0, s*0.2, s*0.14, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(s*0.68, -s*0.05, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.68,  s*0.05, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLizard(now){
  const L = (G.maze.decor || HAT_DECOR[G.stageIdx]).lizard;
  const p = cellCenter(L.c, L.r);
  const s = cs*0.32;
  ctx.save();
  ctx.translate(p.x, p.y - cs*0.08);
  ctx.rotate(0.5);
  ctx.fillStyle = '#A8865C';
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.5, s*0.2, 0, 0, Math.PI*2); ctx.fill();     // body
  ctx.beginPath(); ctx.arc(s*0.55, 0, s*0.16, 0, Math.PI*2); ctx.fill();             // head
  ctx.strokeStyle = '#A8865C'; ctx.lineWidth = Math.max(1, s*0.1); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-s*0.45, 0); ctx.quadraticCurveTo(-s*0.85, s*0.15, -s*1.0, -s*0.05); ctx.stroke(); // tail
  // it never moves, except to blink
  const blink = !reducedMotion && (Math.floor(now/3800) % 2 === 0) && (now % 3800 < 180);
  if(!blink){
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(s*0.6, -s*0.06, s*0.035, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBumpStars(){
  G.bumps.forEach(b=>{
    const p = cellCenter(b.c, b.r);
    drawStar(p.x, p.y, cs*0.28, PAL.paper, PAL.ink);
  });
}

function drawFootprints(){
  if(G.trace.length < 2) return;
  ctx.fillStyle = 'rgba(90,74,54,0.55)';
  let parity = 0, carry = 0;
  const gap = cs*0.32;
  for(let i=1;i<G.trace.length;i++){
    const a = cellCenter(G.trace[i-1].c, G.trace[i-1].r);
    const b = cellCenter(G.trace[i].c, G.trace[i].r);
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx, dy);
    if(len < 0.001) continue;
    const ux = dx/len, uy = dy/len;      // along; perpendicular is (-uy, ux)
    for(let t=carry; t<len; t+=gap){
      const side = (parity++ % 2 === 0)? 1 : -1;
      const px = a.x + ux*t - uy*side*cs*0.09;
      const py = a.y + uy*t + ux*side*cs*0.09;
      ctx.beginPath(); ctx.ellipse(px, py, cs*0.05, cs*0.07, Math.atan2(dy,dx)+Math.PI/2, 0, Math.PI*2); ctx.fill();
    }
    carry = (carry + Math.ceil((len-carry)/gap)*gap) - len;
  }
  drawBumpStars();
  // landmark names, tiny and sentence-case — the reveal teaches the words
  ctx.fillStyle = PAL.ink; ctx.font = '600 10px -apple-system, ui-rounded, system-ui, sans-serif';
  ctx.textAlign = 'center';
  (G.maze.landmarks || HAT_LANDMARKS[G.stageIdx]).forEach(L=>{
    const p = cellCenter(L.c, L.r);
    ctx.fillText(L.label, p.x, Math.min(H-botH-4, p.y + cs*0.75));
  });
  ctx.textAlign = 'start';
}

/* An elevation-view cowboy hat: rounded dented crown, a hatband, and a wide
   brim curling up at both ends. Never pointed. bw = crown half-width; by =
   the brim's baseline. Shared by any elevation scene that wears a hat. */
function drawElevationHat(g, cx, by, bw){
  const ch = bw*1.08;
  // brim first (behind the crown), wider than the crown, curling up at the ends
  g.fillStyle = HPAL.hatTan;
  g.beginPath();
  g.moveTo(cx-bw*1.8, by-1);
  g.quadraticCurveTo(cx, by+bw*0.5, cx+bw*1.8, by-1);
  g.quadraticCurveTo(cx+bw*1.7, by-bw*0.38, cx+bw*1.15, by-bw*0.17);
  g.quadraticCurveTo(cx, by+bw*0.08, cx-bw*1.15, by-bw*0.17);
  g.quadraticCurveTo(cx-bw*1.7, by-bw*0.38, cx-bw*1.8, by-1);
  g.closePath(); g.fill();
  // crown — a rounded dome with a gentle centre dent
  g.beginPath();
  g.moveTo(cx-bw, by);
  g.quadraticCurveTo(cx-bw, by-ch, cx-bw*0.4, by-ch);
  g.quadraticCurveTo(cx, by-ch*0.72, cx+bw*0.4, by-ch);
  g.quadraticCurveTo(cx+bw, by-ch, cx+bw, by);
  g.closePath(); g.fill();
  // hatband
  g.fillStyle = HPAL.hatShade;
  g.fillRect(cx-bw, by-Math.max(2, bw*0.25), bw*2, Math.max(2, bw*0.25));
}

/* A little deadpan tortoise, side-on, wearing a hat. Head points toward its
   facing (inward, so a pair face each other). */
function drawSpaceTortoise(x, y, flip, s){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(flip? -1:1, 1);
  // tucked feet, floating
  ctx.fillStyle = HPAL.foot;
  ctx.beginPath(); ctx.ellipse(-s*0.5, s*0.52, s*0.16, s*0.12, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( s*0.35, s*0.55, s*0.16, s*0.12, 0, 0, Math.PI*2); ctx.fill();
  // shell dome
  ctx.fillStyle = HPAL.shell;
  ctx.beginPath(); ctx.arc(0, 0, s, Math.PI, 0); ctx.fill();
  ctx.fillRect(-s, 0, s*2, s*0.26);
  ctx.strokeStyle = HPAL.shellDark; ctx.lineWidth = Math.max(1, s*0.06);
  ctx.beginPath(); ctx.arc(0, 0, s*0.58, Math.PI, 0); ctx.stroke();
  for(let i=1;i<4;i++){ const a = Math.PI + i*Math.PI/4;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*s*0.58, Math.sin(a)*s*0.58);
    ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s); ctx.stroke(); }
  // head out front, deadpan
  ctx.fillStyle = HPAL.neck;
  ctx.beginPath(); ctx.ellipse(s*0.98, s*0.04, s*0.28, s*0.2, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(s*1.08, -s*0.02, s*0.04, 0, Math.PI*2); ctx.fill();
  // the hat, worn on the shell (as the Seeker wears it)
  drawElevationHat(ctx, 0, -s*0.7, s*0.5);
  ctx.restore();
}

/* Run complete, World Two: the book's final beat — homage in spirit, all
   original art. Both tortoises drift among the stars, each in a hat. */
function drawSpaceScene(now){
  ctx.fillStyle = '#0A0A14'; // night, all the way down
  ctx.fillRect(0, 0, W, H);
  const fade = reducedMotion? 1 : Math.min(1, G.snackT/500);
  // a stable star field, seeded from the day, gently twinkling
  const rnd = mulberry32(hash32(G.runSeed, 0x57A25));
  for(let i=0;i<90;i++){
    const x = rnd()*W, y = rnd()*H, base = 0.35 + rnd()*0.6;
    const tw = reducedMotion? base : base*(0.6 + 0.4*Math.sin(now/500 + i*1.3));
    ctx.globalAlpha = Math.max(0, tw)*fade;
    ctx.fillStyle = rnd()<0.12? '#F2D8A7' : '#F2E8D8';
    const r = rnd()<0.14? 1.8 : 1.0;
    ctx.fillRect(x, y, r, r);
  }
  ctx.globalAlpha = fade;
  // the pair, side by side near the top so they clear the stats card, facing
  // each other, drifting up a little as they go
  const drift = reducedMotion? 0 : Math.min(14, G.snackT/1000*8);
  const bob = reducedMotion? 0 : Math.sin(now/750)*3;
  const s = Math.min(22, W*0.058), cy = H*0.155 - drift;
  drawSpaceTortoise(W*0.40, cy + bob, false, s);   // head points right, inward
  drawSpaceTortoise(W*0.60, cy - bob, true,  s);   // head points left, inward
  ctx.globalAlpha = 1;
}
/* ================= end World Two drawing ================================= */

/* ================= World Three — THE FOREST: drawing (§12) ===============
   Elevation, on the forest floor. Tree trunks are the impassable walls; the
   one saturated red belongs to the hat and only the hat. The reveal inks two
   weights — leg 1 soft grey, leg 2 charcoal — so the whole there-and-back is
   visible at a glance. Homage in spirit; all original assets.             */
const FPAL = {
  ivory:'#EFE7D6', floor:'#E4D9C2', bark:'#6B5A44', barkDark:'#5A4A38',
  canopy:'#6C7A55', moss:'#8A9468', hat:'#B23A48', charcoal:'#33291F',
  fur:'#7A5C3E', furDark:'#5E442C', muzzle:'#B49A7A',
  rabbit:'#CFC3AD', rabbitDark:'#AEA089',
  critterA:'#A98B5E', critterB:'#8E9A6A', bubble:'#F6F0E2',
};

function buildStaticForest(s, rnd, m){
  G.treasure = []; // no buried fortunes in the forest
  // a thin canopy band, dappled
  s.fillStyle = FPAL.canopy; s.fillRect(0,0,W,skyH);
  s.globalAlpha = 0.22;
  for(let i=0;i<W/16;i++){ s.fillStyle = rnd()<0.5? FPAL.moss : '#5C6A48';
    s.beginPath(); s.arc(rnd()*W, rnd()*skyH, 2+rnd()*3, 0, Math.PI*2); s.fill(); }
  s.globalAlpha = 1;

  // the forest floor — warm ivory, paler than World One's soil (air, not earth)
  s.fillStyle = FPAL.ivory; s.fillRect(0, skyH, W, H-skyH);
  s.strokeStyle = 'rgba(51,41,31,0.18)'; s.lineWidth = 1;
  s.beginPath(); s.moveTo(0, skyH+0.5); s.lineTo(W, skyH+0.5); s.stroke();

  // trodden corridors — the map the Navigator reads
  s.fillStyle = FPAL.floor;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r)) s.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  }

  // tree-trunk walls — flat vertical bands in two greens and a grey-brown,
  // coloured per column so a run of wall cells reads as one continuous trunk
  const barks = [FPAL.bark, FPAL.canopy, FPAL.moss];
  const colCol = []; for(let c=0;c<m.cols;c++) colCol[c] = barks[Math.floor(rnd()*barks.length)];
  for(let c=0;c<m.cols;c++) for(let r=0;r<m.rowsN;r++){
    if(m.isOpen(c,r)) continue;
    s.fillStyle = colCol[c];
    s.fillRect(ox+c*cs, oy+r*cs, cs, cs);
    // a soft darker seam on the left edge gives the trunk a little round
    s.fillStyle = 'rgba(51,41,31,0.10)';
    s.fillRect(ox+c*cs, oy+r*cs, Math.max(1,cs*0.12), cs);
    // occasional root wedge at a trunk's foot (only where floor is below)
    if(m.isOpen(c,r+1) && rnd()<0.5){
      s.fillStyle = FPAL.barkDark;
      const bx = ox+c*cs+cs/2, byy = oy+(r+1)*cs;
      s.beginPath(); s.moveTo(bx-cs*0.4, byy); s.lineTo(bx+cs*0.4, byy);
      s.lineTo(bx+cs*0.12, byy-cs*0.22); s.lineTo(bx-cs*0.12, byy-cs*0.22); s.closePath(); s.fill();
    }
  }

  // paper grain
  s.globalAlpha = 0.05;
  for(let i=0;i<W*H/160;i++){ s.fillStyle = rnd()<0.5? '#000':'#fff'; s.fillRect(rnd()*W, rnd()*H, 1, 1); }
  s.globalAlpha = 1;
}

/* The bear: large, upright, mirrored not rotated (elevation rules), one dot
   eye, no expression at any point including the end. */
function drawBear(x, y, now){
  const s = cs*0.7;   // he fills more of a cell than the digger — that's the joke
  const walking = G.phase==='digging' || G.phase==='bouncing';
  const plod = (!reducedMotion && walking)? Math.sin(now/170)*s*0.04 : 0;
  const step = (!reducedMotion && walking)? Math.sin(now/170)*s*0.10 : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(G.facing, 1);
  ctx.translate(0, plod);
  ctx.strokeStyle = FPAL.furDark; ctx.lineWidth = Math.max(2, s*0.16); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-s*0.16, s*0.28); ctx.lineTo(-s*0.20 - step, s*0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( s*0.16, s*0.28); ctx.lineTo( s*0.20 + step, s*0.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.28, -s*0.02); ctx.lineTo(-s*0.34 + step, s*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( s*0.28, -s*0.02); ctx.lineTo( s*0.34 - step, s*0.2); ctx.stroke();
  ctx.fillStyle = FPAL.fur;
  roundedRect(-s*0.30, -s*0.26, s*0.60, s*0.60, s*0.24);
  ctx.beginPath(); ctx.arc(0, -s*0.42, s*0.28, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.20, -s*0.60, s*0.11, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.20, -s*0.60, s*0.11, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = FPAL.muzzle;
  ctx.beginPath(); ctx.ellipse(s*0.08, -s*0.34, s*0.14, s*0.10, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(s*0.16, -s*0.38, s*0.03, 0, Math.PI*2); ctx.fill(); // nose
  if(!G.helmetSlip){ ctx.beginPath(); ctx.arc(s*0.10, -s*0.50, s*0.03, 0, Math.PI*2); ctx.fill(); } // one eye
  ctx.restore();
}

function drawForestExtras(now){
  const staged = G.phase!=='reveal' && G.phase!=='runComplete';
  if(G.leg===1 && staged && G.forest){
    G.forest.animals.forEach(a=> drawAnimal(a.c, a.r, a.kind, now, false));
  }
  // the run back: the animals are gone. The rabbit only flickers back as a hint.
  if(G.leg===2 && staged && G.forest && (CONFIG.forestShowRabbitOnReturn || G.hintRabbit)){
    const ra = G.forest.rabbitArm; drawAnimal(ra.c, ra.r, 'rabbit', now, false);
  }
  if(G.speaker) drawSpeechBubble(now);
}

function drawForestExitMarker(now){
  if(G.leg!==1 || !G.forest) return;                 // leg 2's goal is unmarked (the point)
  if(G.phase==='reveal' || G.phase==='runComplete') return;
  drawAnimal(G.forest.deer.c, G.forest.deer.r, 'deer', now, false);
}

/* A red pointy hat, elevation — a soft triangle with a little brim. The one
   saturated colour in the forest. Shared by the rabbit, the pictograms, and
   the bear's final hat. */
function forestPointyHat(g, cx, by, s, opts){
  opts = opts || {};
  g.beginPath();
  g.moveTo(cx, by - s*0.92);
  g.quadraticCurveTo(cx + s*0.18, by - s*0.42, cx + s*0.40, by);
  g.lineTo(cx - s*0.40, by);
  g.quadraticCurveTo(cx - s*0.18, by - s*0.42, cx, by - s*0.92);
  g.closePath();
  if(opts.outline){ g.strokeStyle = opts.stroke || FPAL.charcoal; g.lineWidth = opts.lw || 2; g.stroke(); }
  else { g.fillStyle = opts.fill || FPAL.hat; g.fill(); }
}

function drawAnimal(c, r, kind, now, hatless){
  const p = cellCenter(c, r);
  const s = cs*0.42;
  ctx.save();
  ctx.translate(p.x, p.y + cs*0.06);
  if(kind==='rabbit'){
    ctx.fillStyle = FPAL.rabbit;
    ctx.beginPath(); ctx.ellipse(0, s*0.02, s*0.28, s*0.42, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -s*0.40, s*0.24, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = FPAL.rabbitDark;
    ctx.beginPath(); ctx.ellipse(-s*0.12, -s*0.72, s*0.07, s*0.24, -0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s*0.12, -s*0.72, s*0.07, s*0.24,  0.15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(s*0.09, -s*0.42, s*0.03, 0, Math.PI*2); ctx.fill();
    if(!hatless) forestPointyHat(ctx, 0, -s*0.56, s*0.34);
  }else if(kind==='sleeper'){
    ctx.fillStyle = FPAL.critterB;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.40, s*0.30, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.34, -s*0.06, s*0.16, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1, s*0.04); ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(s*0.36, -s*0.08, s*0.05, 0.15, Math.PI-0.15); ctx.stroke();
    ctx.globalAlpha = 1;
  }else if(kind==='deer'){
    ctx.fillStyle = FPAL.critterA;
    ctx.beginPath(); ctx.ellipse(0, s*0.02, s*0.30, s*0.36, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s*0.02, -s*0.50, s*0.16, s*0.20, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = FPAL.critterA; ctx.lineWidth = Math.max(1, s*0.06); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-s*0.05, -s*0.66); ctx.lineTo(-s*0.14, -s*0.88); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( s*0.09, -s*0.66); ctx.lineTo( s*0.18, -s*0.88); ctx.stroke();
    ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(s*0.08, -s*0.52, s*0.03, 0, Math.PI*2); ctx.fill();
  }else{ // deny / ask — generic deadpan critters
    ctx.fillStyle = kind==='ask'? FPAL.critterB : FPAL.critterA;
    ctx.beginPath(); ctx.ellipse(0, 0, s*0.34, s*0.30, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(s*0.26, -s*0.18, s*0.16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(s*0.30, -s*0.20, s*0.03, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function roundRectPath(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function forestBubble(cx, cy, w, drawInside){
  const h = w*0.86, r = w*0.24;
  ctx.save();
  ctx.fillStyle = FPAL.bubble; ctx.strokeStyle = 'rgba(51,41,31,0.5)'; ctx.lineWidth = 1.5;
  roundRectPath(cx-w/2, cy-h/2, w, h, r); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx - w*0.12, cy + h/2 - 2);
  ctx.lineTo(cx, cy + h/2 + w*0.22);
  ctx.lineTo(cx + w*0.02, cy + h/2 - 2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
  drawInside(cx, cy, w*0.34);
}

/* The deer beat: the deer's empty hat outline, then the bear fills it red —
   two identical silhouettes, side by side. The whole story in shape and
   colour, nothing to read. */
function drawSpeechBubble(now){
  const sp = G.speaker;
  const p = cellCenter(sp.cell.c, sp.cell.r);
  const top = Math.max(skyH + cs*0.6, p.y - cs*0.95);
  if(sp.kind==='deer'){
    forestBubble(p.x - cs*0.55, top, cs*0.7, (bx,by,r)=> forestPointyHat(ctx, bx, by+r*0.5, r, {outline:true}));
    forestBubble(p.x + cs*0.55, top, cs*0.7, (bx,by,r)=> forestPointyHat(ctx, bx, by+r*0.5, r));
    return;
  }
  forestBubble(p.x, top, cs*0.82, (bx,by,r)=>{
    if(CONFIG.forestSpeechMode==='words') drawBubbleWord(bx, by, r, sp.kind);
    else drawBubblePicto(bx, by, r, sp.kind);
  });
}

function drawBubblePicto(bx, by, r, kind){
  const slash = (x,y,rr)=>{
    ctx.strokeStyle = FPAL.charcoal; ctx.lineWidth = Math.max(1.5, rr*0.18); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-rr*0.8, y+rr*0.7); ctx.lineTo(x+rr*0.8, y-rr*0.9); ctx.stroke();
  };
  if(kind==='rabbit'){
    // three slashed hats, crammed in — protesting far too much
    const pos = [[-0.55,0.12,0.5],[0.55,0.12,0.5],[0,-0.18,0.56]];
    pos.forEach(([dx,dy,sc])=> forestPointyHat(ctx, bx+dx*r, by+dy*r + r*0.4, r*sc));
    pos.forEach(([dx,dy,sc])=> slash(bx+dx*r, by+dy*r, r*sc));
  }else if(kind==='ask'){
    forestPointyHat(ctx, bx-r*0.2, by+r*0.5, r, {outline:true});
    ctx.fillStyle = FPAL.charcoal; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = '800 '+Math.round(r*1.1)+'px -apple-system, ui-rounded, system-ui, sans-serif';
    ctx.fillText('?', bx+r*0.7, by-r*0.1);
    ctx.textAlign='start'; ctx.textBaseline='alphabetic';
  }else if(kind==='sleeper'){
    ctx.strokeStyle = FPAL.charcoal; ctx.lineWidth = Math.max(1.5, r*0.12); ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(bx-r*0.25, by+r*0.1, r*0.35, 0.15, Math.PI-0.15); ctx.stroke();
    ctx.fillStyle = FPAL.charcoal; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font = '800 '+Math.round(r*0.95)+'px -apple-system, ui-rounded, system-ui, sans-serif';
    ctx.fillText('z', bx+r*0.55, by-r*0.45);
    ctx.textAlign='start'; ctx.textBaseline='alphabetic';
  }else{ // deny — a slashed red hat
    forestPointyHat(ctx, bx, by+r*0.5, r);
    slash(bx, by, r);
  }
}

function drawBubbleWord(bx, by, r, kind){
  const word = kind==='sleeper'? 'z' : (kind==='ask'? 'OK' : 'NO');
  ctx.fillStyle = FPAL.charcoal; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font = '800 '+Math.round(r*0.95)+'px -apple-system, ui-rounded, system-ui, sans-serif';
  ctx.fillText(word, bx, by);
  ctx.textAlign='start'; ctx.textBaseline='alphabetic';
}

/* The reveal: two weights. Leg 1 in soft grey, leg 2 in charcoal ink. */
function strokeForestLine(traceArr, style, width){
  if(!traceArr || traceArr.length<2) return;
  ctx.strokeStyle = style; ctx.globalAlpha = 1;
  ctx.lineWidth = width; ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath();
  traceArr.forEach((cell,i)=>{
    const p = cellCenter(cell.c, cell.r);
    const x = p.x + wob(i), y = p.y + wob(i+511);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
function drawForestTrail(){
  strokeForestLine(G.traceLeg1, 'rgba(74,55,40,0.45)', Math.max(2, cs*0.10));
  strokeForestLine(G.trace,     'rgba(51,41,31,0.85)', Math.max(2, cs*0.14));
  drawBumpStars();
  if(G.forest){
    // the cast redrawn in place — the rabbit now hatless, the bear has it
    G.forest.animals.forEach(a=> drawAnimal(a.c, a.r, a.kind, 0, !!a.isRabbit));
    drawAnimal(G.forest.deer.c, G.forest.deer.r, 'deer', 0, false);
  }
}

function drawForestRedPage(now){
  ctx.fillStyle = FPAL.hat; ctx.fillRect(0, 0, W, H);
  const a = reducedMotion? 1 : Math.min(1, (CONFIG.forestRedPageMs - G.redPageT)/300);
  ctx.globalAlpha = a; ctx.fillStyle = FPAL.ivory;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const fs = Math.round(Math.min(34, W*0.09));
  ctx.font = '800 '+fs+'px -apple-system, ui-rounded, system-ui, sans-serif';
  ctx.fillText('He knows where', W/2, H*0.44 - fs*0.7);
  ctx.fillText('his hat is.',    W/2, H*0.44 + fs*0.7);
  ctx.textAlign='start'; ctx.textBaseline='alphabetic'; ctx.globalAlpha = 1;
}

/* Run complete: the bear, sitting, wearing the red hat, facing the reader.
   Deadpan. A squirrel wanders in and asks about a rabbit in a hat. Nothing is
   explained. World Three signs off with a question nobody answers.         */
function drawSittingBear(cx, by, s){
  ctx.save(); ctx.translate(cx, by);
  ctx.fillStyle = FPAL.fur;
  ctx.beginPath(); ctx.ellipse(-s*0.40, -s*0.10, s*0.28, s*0.20, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( s*0.40, -s*0.10, s*0.28, s*0.20, 0, 0, Math.PI*2); ctx.fill();
  roundedRect(-s*0.42, -s*0.78, s*0.84, s*0.72, s*0.30);
  ctx.beginPath(); ctx.arc(0, -s*0.98, s*0.36, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-s*0.28, -s*1.24, s*0.14, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.28, -s*1.24, s*0.14, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = FPAL.muzzle;
  ctx.beginPath(); ctx.ellipse(0, -s*0.88, s*0.18, s*0.13, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(-s*0.13, -s*1.02, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.13, -s*1.02, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -s*0.90, s*0.05, 0, Math.PI*2); ctx.fill();
  forestPointyHat(ctx, 0, -s*1.18, s*0.62);
  ctx.restore();
}
function drawSquirrel(x, gy, s, now){
  ctx.save(); ctx.translate(x, gy);
  ctx.fillStyle = '#A56A3C';
  ctx.beginPath(); ctx.ellipse(s*0.5, -s*0.5, s*0.30, s*0.5, 0.3, 0, Math.PI*2); ctx.fill(); // tail
  ctx.beginPath(); ctx.ellipse(0, -s*0.4, s*0.28, s*0.40, 0, 0, Math.PI*2); ctx.fill();       // body
  ctx.beginPath(); ctx.arc(-s*0.10, -s*0.80, s*0.20, 0, Math.PI*2); ctx.fill();               // head
  ctx.beginPath(); ctx.moveTo(-s*0.20,-s*1.00); ctx.lineTo(-s*0.26,-s*1.16); ctx.lineTo(-s*0.08,-s*1.02); ctx.closePath(); ctx.fill();
  ctx.fillStyle = PAL.ink; ctx.beginPath(); ctx.arc(-s*0.16, -s*0.82, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawForestReward(now){
  ctx.fillStyle = FPAL.ivory; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = FPAL.canopy; ctx.fillRect(0, 0, W, Math.max(30, H*0.10));
  const gy = H*0.72;
  ctx.strokeStyle = 'rgba(51,41,31,0.15)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  const s = Math.min(56, W*0.16);
  drawSittingBear(W*0.42, gy, s);
  if(G.snackT > 700){
    const prog = Math.min(1, (G.snackT-700)/1400);
    drawSquirrel(W*0.9 - prog*(W*0.22), gy, s*0.5, now);
  }
}
/* ================= end World Three drawing =============================== */

/* ---------------- World Four drawing — DEEP WATER (§13) -------------------
   Near-black water. A soft lantern circle around the little fish, and every
   cell it has swum through stays lit permanently — the map draws itself, which
   is the whole feature. The big fish follows and is never a fail state. The
   ending is scripted; the score is how much ocean was lit. Homage in spirit,
   all original assets — our fish are our own fish.                          */
const DPAL = {
  water:'#0E1A24', waterLit:'#16303C', kelp:'#2F5147', kelpLight:'#3F6A55',
  fish:'#E8E0CE', ink:'#33291F', hatBlue:'#3E6E9C', hatBrim:'#2E5578', crab:'#B4653A',
};
let fogCtx = null;

/* The fog is a soft-edged mask over the static ocean, not darkened tiles. It
   lives on its own layer that is erased along the swum path — no hard vignette
   ring, and the lit corridor is permanent because the erase is permanent.   */
function rebuildFogLayer(){
  fogLayer = document.createElement('canvas');
  fogLayer.width = canvas.width; fogLayer.height = canvas.height;
  fogCtx = fogLayer.getContext('2d');
  fogCtx.setTransform(DPR,0,0,DPR,0,0);
  fogCtx.fillStyle = DPAL.water; fogCtx.fillRect(0,0,W,H);
  // re-light every cell already seen, so a mid-stage relayout keeps the map
  if(G.lit) G.lit.forEach(k=>{ const [c,r]=k.split(',').map(Number); eraseFogCell(c,r); });
}
function eraseFog(x,y,r){
  if(!fogCtx || r<=0) return;
  fogCtx.globalCompositeOperation = 'destination-out';
  const g = fogCtx.createRadialGradient(x,y,r*0.35, x,y,r);
  g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(0.7,'rgba(0,0,0,0.85)'); g.addColorStop(1,'rgba(0,0,0,0)');
  fogCtx.fillStyle = g; fogCtx.beginPath(); fogCtx.arc(x,y,r,0,Math.PI*2); fogCtx.fill();
  fogCtx.globalCompositeOperation = 'source-over';
}
function eraseFogCell(c,r){ const p = cellCenter(c,r); eraseFog(p.x, p.y, cs*1.05); }

function deepInKelp(){ return G.deepKelpMinRow!=null && G.cell && G.cell.r >= G.deepKelpMinRow; }
function deepFogRadiusPx(){
  return (deepInKelp()? CONFIG.deepFogPlantsRadiusTiles : CONFIG.deepFogRadiusTiles) * cs;
}

/* The seen-set: mark every open cell within the lantern permanently lit, and
   let the crab point once — swim within a tile and the correct branch lights
   for crabHintTiles cells, then it goes back to sunning. Not required, easy
   to miss; Deep Water spends its silent-joke slot here on purpose.          */
function markLit(){
  const m = G.maze;
  const R = deepInKelp()? CONFIG.deepFogPlantsRadiusTiles : CONFIG.deepFogRadiusTiles;
  const rad = Math.ceil(R);
  for(let dr=-rad; dr<=rad; dr++) for(let dc=-rad; dc<=rad; dc++){
    if(Math.hypot(dc,dr) > R) continue;
    const c = G.cell.c+dc, r = G.cell.r+dr;
    if(m.isOpen(c,r)) G.lit.add(c+','+r);
  }
  if(G.crab && !G.crabPointed &&
     Math.max(Math.abs(G.crab.c-G.cell.c), Math.abs(G.crab.r-G.cell.r)) <= 1){
    G.crabPointed = true;
    AudioFX.gem(); // one small bright "there" — the crab's whole contribution
    G.crab.hintCells.forEach(hc=>{ G.lit.add(hc.c+','+hc.r); eraseFogCell(hc.c, hc.r); });
  }
}

/* Composited over everything each frame: the lantern follows the fish (a
   permanent erase) except at the reveal, where the map freezes and the never-
   seen dark stays — the shape of what was missed, the reason to come back.  */
function drawDeepFog(now){
  if(!fogLayer) return;
  if(G.phase==='runComplete' || G.phase==='picker') return;
  if(G.flashT > 0) return;                 // the briefing flash: the whole ocean, lit
  if(G.phase!=='reveal'){ const p = diggerXY(); eraseFog(p.x, p.y, deepFogRadiusPx()); }
  ctx.drawImage(fogLayer, 0, 0, W, H);
}

function buildStaticDeep(s, rnd, m){
  G.treasure = [];                          // no buried fortunes here
  s.fillStyle = DPAL.water; s.fillRect(0,0,W,H);
  // open corridors a shade lighter — the map the lantern reveals
  s.fillStyle = DPAL.waterLit;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r)) s.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  }
  // a faint suspended grain — motes in the water
  s.globalAlpha = 0.05;
  for(let i=0;i<W*H/200;i++){ s.fillStyle = rnd()<0.5? '#000':'#7FA0AE'; s.fillRect(rnd()*W, rnd()*H, 1, 1); }
  s.globalAlpha = 1;
  rebuildFogLayer();
}

/* A small blue bowler — the hat that is not the little fish's. Brim ellipse and
   a rounded dome; the one accent blue in the world, readable against near-black.
   Symmetric, so it reads in profile (on the fish) and head-on (the reward).  */
function deepBowler(g, cx, by, s){
  g.fillStyle = DPAL.hatBrim;
  g.beginPath(); g.ellipse(cx, by, s*0.62, s*0.16, 0, 0, Math.PI*2); g.fill();
  g.fillStyle = DPAL.hatBlue;
  g.beginPath(); g.arc(cx, by, s*0.42, Math.PI, 0); g.closePath(); g.fill();
  g.beginPath(); g.ellipse(cx, by, s*0.42, s*0.09, 0, 0, Math.PI, true); g.fill();
}

/* The little fish: pale ivory, a single dot eye, a slow tail sine — and the
   stolen blue hat it is quite sure it will get away with. */
function drawFish(x, y, now){
  const s = cs*0.42;
  const tail = reducedMotion? 0 : Math.sin(now/240)*s*0.18;
  ctx.save(); ctx.translate(x, y); ctx.scale(G.facing, 1);
  ctx.fillStyle = DPAL.fish;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.52, s*0.30, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.44, 0); ctx.lineTo(-s*0.74, -s*0.24+tail); ctx.lineTo(-s*0.74, s*0.24+tail); ctx.closePath(); ctx.fill();
  ctx.fillStyle = DPAL.ink; ctx.beginPath(); ctx.arc(s*0.28, -s*0.05, s*0.05, 0, Math.PI*2); ctx.fill();
  deepBowler(ctx, s*0.06, -s*0.26, s*0.34);
  ctx.restore();
}

/* The big fish: larger, hatless, a deadpan mouth line. Mechanically the dog —
   it follows the little fish's exact trail at a longer lag, backs up when the
   little fish bounces, and can never collide. The dread is all the Navigator's. */
function drawPursuer(x, y, facing, moving, now){
  const s = cs*0.74;
  const tail = reducedMotion? 0 : Math.sin(now/320)*s*0.14;
  ctx.save(); ctx.translate(x, y); ctx.scale(facing, 1);
  ctx.fillStyle = DPAL.fish;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.56, s*0.34, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-s*0.48, 0); ctx.lineTo(-s*0.84, -s*0.28+tail); ctx.lineTo(-s*0.84, s*0.28+tail); ctx.closePath(); ctx.fill();
  ctx.fillStyle = DPAL.ink; ctx.beginPath(); ctx.arc(s*0.30, -s*0.06, s*0.055, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = DPAL.ink; ctx.lineWidth = Math.max(1, s*0.035); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*0.40, s*0.08); ctx.lineTo(s*0.52, s*0.06); ctx.stroke();
  ctx.restore();
}

function drawKelpFrond(cx, baseY, h, phase, colour){
  const sway = reducedMotion? 0 : Math.sin(phase)*h*0.12;
  ctx.strokeStyle = colour; ctx.lineWidth = Math.max(2, cs*0.12); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx, baseY);
  ctx.quadraticCurveTo(cx+sway*0.5, baseY-h*0.5, cx+sway, baseY-h);
  ctx.stroke();
}

function drawCrab(c, r, now){
  const p = cellCenter(c, r), s = cs*0.30;
  ctx.save(); ctx.translate(p.x, p.y + cs*0.16);
  ctx.fillStyle = DPAL.crab;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.62, s*0.42, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = DPAL.crab; ctx.lineWidth = Math.max(1, s*0.16); ctx.lineCap='round';
  for(const sgn of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(sgn*s*0.5, s*0.05); ctx.lineTo(sgn*s*0.9, -s*0.14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sgn*s*0.4, s*0.2); ctx.lineTo(sgn*s*0.66, s*0.34); ctx.stroke();
  }
  ctx.fillStyle = DPAL.ink;
  ctx.beginPath(); ctx.arc(-s*0.2, -s*0.34, s*0.06, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.2, -s*0.34, s*0.06, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawDeepBubbles(now){
  if(reducedMotion) return;
  ctx.fillStyle = 'rgba(232,224,206,0.20)';
  for(let i=0;i<14;i++){
    const bx = (Math.sin(i*97.3)*0.5 + 0.5) * W;
    const speed = 26 + (i%5)*9;
    const by = H - ((now/1000*speed + i*47) % (H+40));
    ctx.beginPath(); ctx.arc(bx, by, 1.5 + (i%3), 0, Math.PI*2); ctx.fill();
  }
}

function drawDeepExtras(now){
  const m = G.maze;
  // dense kelp in the last rows before the goal — where the lantern shrinks
  if(G.deepKelpMinRow!=null){
    for(let r=G.deepKelpMinRow;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
      if(!m.isOpen(c,r)) continue;
      const base = oy + r*cs + cs*0.92, ph = now/900 + c*0.7 + r*0.3;
      drawKelpFrond(ox+c*cs+cs*0.35, base, cs*0.95, ph,     DPAL.kelp);
      drawKelpFrond(ox+c*cs+cs*0.65, base, cs*0.72, ph+1.3, DPAL.kelpLight);
    }
  }
  if(G.crab) drawCrab(G.crab.c, G.crab.r, now);   // sunning; fog hides it until near
  drawDeepBubbles(now);
}

/* The goal: the blue hat, faintly lit, seen only within lantern range (the fog
   composited afterward does the hiding). The little fish never sees it until
   it's too late — but here it never sees it at all; the big fish takes it. */
function drawDeepHat(now){
  if(G.phase==='runComplete') return;
  const e = cellCenter(G.maze.exit.c, G.maze.exit.r);
  deepBowler(ctx, e.x, e.y + cs*0.06, cs*0.5);
}

/* The reveal: the route as a dotted bubble-trail, bump stars, and — because the
   fog is composited over this too — the unexplored dark left exactly as it was. */
function drawDeepTrail(){
  if(G.trace.length > 1){
    ctx.fillStyle = 'rgba(232,224,206,0.8)';
    G.trace.forEach((cell,i)=>{
      if(i % 2) return;
      const p = cellCenter(cell.c, cell.r);
      ctx.beginPath(); ctx.arc(p.x + wob(i), p.y + wob(i+311), Math.max(1.5, cs*0.09), 0, Math.PI*2); ctx.fill();
    });
  }
  drawBumpStars();
}

/* Run complete: still water, the plants, the big fish — hatted, motionless,
   facing the reader. One bubble rises and the scene holds. World Four signs off
   with silence: no fanfare, only a low chime already played on arrival.      */
function drawDeepReward(now){
  ctx.fillStyle = DPAL.water; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 0.5;
  for(let i=0;i<7;i++){ drawKelpFrond((i+0.5)/7*W, H*0.99, H*0.22, now/1100 + i, DPAL.kelp); }
  ctx.globalAlpha = 1;
  const cx = W*0.5, cy = H*0.48, s = Math.min(70, W*0.2);
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = DPAL.fish;
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.92, s*0.62, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s*0.86, -s*0.08); ctx.lineTo(s*1.18, -s*0.34); ctx.lineTo(s*1.06, s*0.10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = DPAL.ink;
  ctx.beginPath(); ctx.arc(-s*0.28, -s*0.12, s*0.07, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc( s*0.28, -s*0.12, s*0.07, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = DPAL.ink; ctx.lineWidth = Math.max(1, s*0.04); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-s*0.16, s*0.22); ctx.lineTo(s*0.16, s*0.22); ctx.stroke();
  deepBowler(ctx, 0, -s*0.48, s*0.98);
  ctx.restore();
  if(!reducedMotion){
    ctx.fillStyle = 'rgba(232,224,206,0.3)';
    const by = H - ((now/1000*40) % (H*0.6)) - H*0.12;
    ctx.beginPath(); ctx.arc(cx + s*0.95, by, 3, 0, Math.PI*2); ctx.fill();
  }
}

/* The survey, not the chase: lit open cells over all open cells. Shown after
   the stage, tracked as an all-time best. This reframes the world and rewards
   exactly the skill being taught — protect this idea (§13).                 */
function deepLitPct(){
  const m = G.maze; let open = 0;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++) if(m.isOpen(c,r)) open++;
  return open? Math.round(100 * G.lit.size / open) : 0;
}
/* ================= end World Four drawing =============================== */

function drawDebug(){
  const m = G.maze;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 0.5;
  for(let r=0;r<=m.rowsN;r++){ ctx.beginPath(); ctx.moveTo(ox, oy+r*cs); ctx.lineTo(ox+m.cols*cs, oy+r*cs); ctx.stroke(); }
  for(let c=0;c<=m.cols;c++){ ctx.beginPath(); ctx.moveTo(ox+c*cs, oy); ctx.lineTo(ox+c*cs, oy+m.rowsN*cs); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
  ctx.fillText('phase: '+G.phase+'  cell: '+key(G.cell)+'  hdg: '+G.heading.dx+','+G.heading.dy, 8, H-8);
  ctx.fillText('seed: '+G.runSeed+'  '+(G.maze.generated? 'generated':'FALLBACK'), 8, H-20);
  ctx.fillText('days: '+getDaysPlayed()+'  streakBest: '+getStreakBest()+(playtest? '  PLAYTEST' : ''), 8, H-32);
}

/* ---------------- HUD & panels ------------------------------------------- */
function fmtTime(ms){
  if(ms===null || ms===undefined) return '–';
  const s = Math.floor(ms/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function updateHUD(){
  const inPlay = PLAY_PHASES.has(G.phase) || G.phase==='countdown';
  document.getElementById('hudStage').textContent =
    G.phase==='picker'? '' : WORLD().label+' · Stage '+(G.stageIdx+1)+' of 3';
  document.getElementById('hudTime').textContent = (inPlay || G.phase==='breakthrough')? fmtTime(G.stageMs) : '';
  const marks = [];
  if(inPlay && G.gemsThisStage) marks.push('◆ '+G.gemsThisStage);
  if(inPlay && G.bumps.length) marks.push('★ '+G.bumps.length);
  document.getElementById('hudBumps').textContent = marks.join('   ');
}

const panelEl = document.getElementById('panel');
function showPanel(html){ panelEl.innerHTML = html; panelEl.style.display = 'block'; mountRacks(); }
function hidePanel(){ panelEl.style.display = 'none'; }

/* ---------------- The hat rack, drawn (§11) -------------------------------
   A wooden rail with one peg per world. Unlocked pegs hold their hat in full
   colour; locked pegs hold a pale silhouette — the shape is the tease, never
   a padlock. Beneath the next locked peg, the sleeps remaining are countable
   moons; beside it, a gold moon states that the golden-night bonus exists
   without ever naming a target time. Rendered as inline SVG so it stays
   crisp inside the paper card and needs no network.                        */
const RACK_INK = '#4A3728';
function hatShapeSVG(shape, cx, baseY, s, colour, locked){
  const fill = locked? 'rgba(74,55,40,0.14)' : colour;
  const stroke = locked? 'rgba(74,55,40,0.34)' : 'rgba(0,0,0,0.28)';
  const sw = locked? 1 : 1.2;
  const P = (n)=> +(n).toFixed(2);
  const parts = [];
  const ell = (ex,ey,rx,ry)=> '<ellipse cx="'+P(ex)+'" cy="'+P(ey)+'" rx="'+P(rx)+'" ry="'+P(ry)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
  const path = (d)=> '<path d="'+d+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'" stroke-linejoin="round"/>';
  if(shape==='hardhat'){
    parts.push(ell(cx, baseY, 0.52*s, 0.14*s));
    parts.push(path('M '+P(cx-0.40*s)+' '+P(baseY)+' A '+P(0.40*s)+' '+P(0.52*s)+' 0 0 1 '+P(cx+0.40*s)+' '+P(baseY)+' Z'));
    parts.push('<rect x="'+P(cx-0.05*s)+'" y="'+P(baseY-0.60*s)+'" width="'+P(0.10*s)+'" height="'+P(0.16*s)+'" rx="'+P(0.04*s)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>');
  }else if(shape==='cowboy'){
    parts.push(ell(cx, baseY, 0.56*s, 0.13*s));
    parts.push(path(
      'M '+P(cx-0.30*s)+' '+P(baseY-0.02*s)+
      ' C '+P(cx-0.34*s)+' '+P(baseY-0.42*s)+' '+P(cx-0.20*s)+' '+P(baseY-0.52*s)+' '+P(cx-0.10*s)+' '+P(baseY-0.44*s)+
      ' C '+P(cx-0.03*s)+' '+P(baseY-0.38*s)+' '+P(cx+0.03*s)+' '+P(baseY-0.38*s)+' '+P(cx+0.10*s)+' '+P(baseY-0.44*s)+
      ' C '+P(cx+0.20*s)+' '+P(baseY-0.52*s)+' '+P(cx+0.34*s)+' '+P(baseY-0.42*s)+' '+P(cx+0.30*s)+' '+P(baseY-0.02*s)+' Z'));
  }else if(shape==='pointy'){
    parts.push(ell(cx, baseY, 0.44*s, 0.11*s));
    parts.push(path(
      'M '+P(cx)+' '+P(baseY-0.68*s)+
      ' Q '+P(cx+0.12*s)+' '+P(baseY-0.30*s)+' '+P(cx+0.30*s)+' '+P(baseY-0.02*s)+
      ' L '+P(cx-0.30*s)+' '+P(baseY-0.02*s)+
      ' Q '+P(cx-0.12*s)+' '+P(baseY-0.30*s)+' '+P(cx)+' '+P(baseY-0.68*s)+' Z'));
  }else{ // bowler
    parts.push(path('M '+P(cx-0.46*s)+' '+P(baseY)+' Q '+P(cx)+' '+P(baseY-0.08*s)+' '+P(cx+0.46*s)+' '+P(baseY)+' Q '+P(cx)+' '+P(baseY+0.10*s)+' '+P(cx-0.46*s)+' '+P(baseY)+' Z'));
    parts.push(path('M '+P(cx-0.30*s)+' '+P(baseY-0.02*s)+' A '+P(0.30*s)+' '+P(0.36*s)+' 0 0 1 '+P(cx+0.30*s)+' '+P(baseY-0.02*s)+' Z'));
  }
  return parts.join('');
}
function crescentSVG(cx, cy, r, fill, stroke){
  const P = (n)=> +(n).toFixed(2);
  return '<path d="M '+P(cx)+' '+P(cy-r)+' A '+P(r)+' '+P(r)+' 0 1 1 '+P(cx)+' '+P(cy+r)+
    ' A '+P(r*0.80)+' '+P(r)+' 0 1 0 '+P(cx)+' '+P(cy-r)+' Z" fill="'+fill+'"'+
    (stroke? ' stroke="'+stroke+'" stroke-width="0.8"' : '')+'/>';
}
function buildRackSVG(opts){
  opts = opts || {};
  const highlight = opts.highlight || new Set();
  const days = getDaysPlayed();
  const W = 300, Hh = 132, baseY = 74, s = 34;
  const railY = 92;
  const xs = RACK_PEGS.map((_,i)=> 30 + (i+0.5)*((W-60)/RACK_PEGS.length));
  let svg = '<svg class="rack" viewBox="0 0 '+W+' '+Hh+'" width="100%" preserveAspectRatio="xMidYMid meet" aria-label="the hat rack">';
  // the rail
  svg += '<rect x="22" y="'+railY+'" width="'+(W-44)+'" height="12" rx="6" fill="#6B5A44"/>';
  // find the next locked peg (the countdown target)
  let nextIdx = -1;
  RACK_PEGS.forEach((p,i)=>{ if(nextIdx<0 && !isUnlocked(p.world)) nextIdx = i; });
  RACK_PEGS.forEach((p,i)=>{
    const px = xs[i];
    // the peg
    svg += '<rect x="'+(px-3)+'" y="'+(railY-12)+'" width="6" height="18" rx="3" fill="#5A4A38"/>';
    svg += '<circle cx="'+px+'" cy="'+(railY-12)+'" r="4" fill="#6B5A44"/>';
    const unlocked = isUnlocked(p.world);
    if(highlight.has(p.world)){ // ceremony ring behind the landing hat
      svg += '<circle cx="'+px+'" cy="'+(baseY-0.24*s)+'" r="'+(0.62*s)+'" fill="rgba(201,160,52,0.20)"/>';
    }
    // §14.5: the picker's selection frame around the chosen unlocked peg
    if(opts.select && opts.select===p.world){
      svg += '<rect x="'+(px-0.62*s)+'" y="'+(baseY-0.98*s)+'" width="'+(1.24*s)+'" height="'+(1.2*s)+
             '" rx="7" fill="none" stroke="#B23A48" stroke-width="2.5"/>';
    }
    svg += hatShapeSVG(p.shape, px, baseY, s, p.colour, !unlocked);
    // the gold-moon tease beside the next locked peg (the bonus exists)
    if(i===nextIdx){
      svg += crescentSVG(px+0.42*s, baseY-0.52*s, 5, 'rgba(201,160,52,0.9)', '#8E6F42');
    }
  });
  // countable nights under the next locked peg — small moons, one per night.
  // Deep Water is the only peg that can be locked, and its count is mode-aware
  // (§11.3): nights in a row still to string together, or sleeps still to come.
  // It states what is true now and never mentions a count that was lost.
  if(nextIdx>=0){
    const p = RACK_PEGS[nextIdx];
    const remaining = Math.max(0, p.world==='deep'
      ? (CONFIG.deepUnlockMode==='streak'
          ? CONFIG.deepUnlockStreak - getStreakBest()
          : CONFIG.deepUnlockDays - days)
      : worldUnlockDay(p.world) - days);
    if(remaining>0 && remaining <= CONFIG.rackPipThreshold){
      const px = xs[nextIdx];
      const gap = 11, y = 116;
      const startX = px - (remaining-1)*gap/2;
      for(let k=0;k<remaining;k++){
        svg += crescentSVG(startX + k*gap, y, 4, 'rgba(74,55,40,0.55)', null);
      }
    }
  }
  // golden-night scatter: gold flat-particles across the rack (§11)
  if(opts.golden){
    const gp = mulberry32(0xC01D * (days+1));
    for(let k=0;k<9;k++){
      const gx = 30 + gp()*(W-60), gy = 20 + gp()*70, gs = 3 + gp()*3;
      svg += '<rect x="'+gx.toFixed(1)+'" y="'+gy.toFixed(1)+'" width="'+gs.toFixed(1)+'" height="'+gs.toFixed(1)+'" rx="1" fill="rgba(201,160,52,0.85)"/>';
    }
  }
  // playtest tell: a small gold moon in the top corner
  if(playtest){
    svg += crescentSVG(W-16, 15, 6, 'rgba(201,160,52,0.95)', '#8E6F42');
  }
  // invisible per-peg hit areas for the 4-3-2-1 unlock-all gesture
  RACK_PEGS.forEach((p,i)=>{
    const px = xs[i], w = (W-60)/RACK_PEGS.length;
    svg += '<rect class="pegHit" data-peg="'+i+'" x="'+(px-w/2)+'" y="0" width="'+w+'" height="'+Hh+'" fill="transparent"/>';
  });
  svg += '</svg>';
  return svg;
}

/* Any card can ask for a rack by including <div class="rackHost" data-...>.
   mountRacks fills each one and wires the sealed-mode gesture.            */
let rackTaps = [];
function mountRacks(){
