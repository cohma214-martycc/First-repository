/* ---------------- World Two data ------------------------------------------
   H1 stages are vertical flips of the hand-authored tunnel fixtures: the
   Seeker starts at the bottom edge and walks up-screen to the hat. A flip
   preserves every invariant (junctions stay on vertical travel; green/red
   stay green/red — only rows reverse).                                    */
const HAT_STAGES = FALLBACK_STAGES.map(st=> ({ name: st.name, rows: st.rows.slice().reverse() }));

/* Nameable landmarks, hand-placed beside junctions so "green at the
   cactus!" is always possible. Labels appear only on the reveal spread.   */
const HAT_LANDMARKS = [
  [ {c:4,r:5,kind:'cactus', label:'the cactus'},
    {c:2,r:2,kind:'stones', label:'the three stones'},
    {c:6,r:8,kind:'log',    label:'the old log'},
    {c:7,r:4,kind:'pool',   label:'the dark pool'} ],
  [ {c:6,r:8,kind:'cactus', label:'the cactus'},
    {c:6,r:2,kind:'stones', label:'the three stones'},
    {c:1,r:7,kind:'pool',   label:'the dark pool'},
    {c:8,r:3,kind:'log',    label:'the old log'} ],
  [ {c:4,r:12,kind:'cactus', label:'the cactus'},
    {c:3,r:6, kind:'stones', label:'the three stones'},
    {c:1,r:3, kind:'pool',   label:'the dark pool'},
    {c:2,r:0, kind:'log',    label:'the old log'} ],
];

/* Silent jokes: a second hat half-buried in a corner, a lizard on a rock. */
const HAT_DECOR = [
  { secondHat:{c:1,r:1},  lizard:{c:7,r:7} },
  { secondHat:{c:1,r:11}, lizard:{c:1,r:1} },
  { secondHat:{c:7,r:15}, lizard:{c:6,r:11} },
];

/* ---------------- Procedural desert (M7 / H2) -----------------------------
   The desert generates from the SAME daily seed as the tunnels but through
   its own derived stream — two fresh territories per day, one ritual. A
   generated tunnel maze is flipped vertically (invariant-preserving, the
   Seeker walks up-screen), then the landmark pass seats one DISTINCT
   nameable landmark within landmarkJunctionRadius of every junction, so
   "green at the cactus!" is always possible and never ambiguous. A maze
   that cannot seat its landmarks is rejected and re-generated; the flipped
   hand-authored stages remain the never-broken fallback.                  */
const LANDMARK_KINDS = [
  { kind:'cactus',  label:'the cactus' },
  { kind:'stones',  label:'the three stones' },
  { kind:'pool',    label:'the dark pool' },
  { kind:'log',     label:'the old log' },
  { kind:'flower',  label:'the big flower' },
  { kind:'bird',    label:'the sleepy bird' },
  { kind:'anthill', label:'the anthill' },
];
const HAT_SEED_SALT = 0x48415421; // the desert's own stream off the daily seed

function placeLandmarks(rowsArr, rnd){
  const m = parseStage({name:'', rows: rowsArr});
  const R = CONFIG.landmarkJunctionRadius;
  const junctions = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r)) continue;
    const deg = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>m.isOpen(c+dx,r+dy)).length;
    if(deg >= 3) junctions.push({c,r});
  }
  if(junctions.length > LANDMARK_KINDS.length) return null; // not enough names
  const kinds = LANDMARK_KINDS.slice();
  for(let i=kinds.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=kinds[i]; kinds[i]=kinds[j]; kinds[j]=t; }
  const used = new Set();
  const out = [];
  for(const j of junctions){
    const cand = [];
    for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
      if(dx===0 && dy===0) continue;
      const c = j.c+dx, r = j.r+dy;
      if(c<0||r<0||c>=m.cols||r>=m.rowsN) continue;
      if(m.isOpen(c,r) || used.has(c+','+r)) continue;
      cand.push({c, r, pri: Math.abs(dx)+Math.abs(dy)}); // orthogonal walls first
    }
    if(!cand.length) return null;
    const best = Math.min(...cand.map(x=>x.pri));
    const top = cand.filter(x=>x.pri===best);
    const pick = top[Math.floor(rnd()*top.length)];
    used.add(pick.c+','+pick.r);
    const k = kinds[out.length];
    out.push({ c:pick.c, r:pick.r, kind:k.kind, label:k.label });
  }
  return out;
}

function placeDecor(rowsArr, landmarks, rnd){
  const m = parseStage({name:'', rows: rowsArr});
  const used = new Set(landmarks.map(L=> L.c+','+L.r));
  const walls = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r) && !used.has(c+','+r)) walls.push({c,r});
  }
  const pickFrom = (arr)=> arr[Math.floor(rnd()*arr.length)];
  // the second hat hides near a corner of the map, as is traditional
  const cornerish = walls.filter(({c,r})=>
    (c<=1 || c>=m.cols-2) && (r<=2 || r>=m.rowsN-3));
  const secondHat = pickFrom(cornerish.length? cornerish : walls);
  const rest = walls.filter(w=> !(w.c===secondHat.c && w.r===secondHat.r));
  const lizard = pickFrom(rest.length? rest : walls);
  return { secondHat:{c:secondHat.c, r:secondHat.r}, lizard:{c:lizard.c, r:lizard.r} };
}

function generateHatStage(idx, dailySeedVal, params){
  for(let a=0; a<12; a++){
    const rows = generateStageRows(idx, hash32(dailySeedVal ^ HAT_SEED_SALT, a*7717), params);
    if(!rows) continue; // that stream came up dry — try the next one
    const flipped = rows.slice().reverse();
    const rnd = mulberry32(hash32(dailySeedVal, HAT_SEED_SALT + idx*97 + a));
    const landmarks = placeLandmarks(flipped, rnd);
    if(landmarks){
      return { rows: flipped, landmarks, decor: placeDecor(flipped, landmarks, rnd) };
    }
  }
  return null;
}

function hatStageFor(idx){
  const gen = generateHatStage(idx, G.runSeed, effectiveGenParams(idx));
  if(gen) return { name:'Stage '+(idx+1), rows: gen.rows, generated:true,
                   landmarks: gen.landmarks, decor: gen.decor };
  return { name:'Stage '+(idx+1), rows: HAT_STAGES[idx].rows, generated:false,
           landmarks: HAT_LANDMARKS[idx], decor: HAT_DECOR[idx] };
}

/* ---------------- Static layer dispatch ---------------------------------- */
function buildStaticLayer(){
  const m = G.maze;
  staticLayer = document.createElement('canvas');
  staticLayer.width = canvas.width; staticLayer.height = canvas.height;
  const s = staticLayer.getContext('2d');
  s.setTransform(DPR,0,0,DPR,0,0);
  // decorative details vary with the day, deterministically
  const rnd = mulberry32(hash32(G.runSeed, (G.stageIdx+1)*7919));
  WORLD().buildStatic(s, rnd, m);
}

/* ---------------- World One static layer: sky, soil, buried things ------- */
function buildStaticTunnels(s, rnd, m){
  // sky strip — quiet, pale, a thin picture-book world above
  s.fillStyle = PAL.sky; s.fillRect(0,0,W,skyH);
  drawSkyScene(s, rnd);

  // soil
  s.fillStyle = PAL.soilDeep; s.fillRect(0,skyH,W,H-skyH);
  // surface line
  s.strokeStyle = PAL.ink; s.globalAlpha = 0.35; s.lineWidth = 1;
  s.beginPath(); s.moveTo(0, skyH+0.5); s.lineTo(W, skyH+0.5); s.stroke();
  s.globalAlpha = 1;

  // undug corridors — the map the Navigator reads (mid earth, slightly lighter)
  s.fillStyle = PAL.soilWarm;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r)) s.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  }

  // rocks: soft blobs a shade darker, in solid soil
  s.fillStyle = PAL.rock;
  for(let r=1;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r) && rnd()<0.13){
      const px = ox+c*cs+cs*(0.25+rnd()*0.5), py = oy+r*cs+cs*(0.25+rnd()*0.5);
      const rw = cs*(0.16+rnd()*0.16), rh = rw*(0.6+rnd()*0.5);
      s.beginPath(); s.ellipse(px,py,rw,rh, rnd()*Math.PI, 0, Math.PI*2); s.fill();
    }
  }

  // roots dangling from the surface
  s.strokeStyle = PAL.root; s.lineWidth = Math.max(1, cs*0.045); s.lineCap='round';
  for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,0) && rnd()<0.55){
      let x = ox+c*cs+cs*(0.3+rnd()*0.4), y = oy;
      s.beginPath(); s.moveTo(x,y);
      const segs = 2+Math.floor(rnd()*3);
      for(let i=0;i<segs;i++){ x += (rnd()-0.5)*cs*0.5; y += cs*(0.35+rnd()*0.4); s.lineTo(x,y); }
      s.stroke();
    }
  }

  // buried oddities — silent jokes, decorative only
  const odd = ['bone','boot','teacup'];
  const spots = [];
  let guard = 0;
  while(spots.length<2 && guard++<200){
    const c = 1+Math.floor(rnd()*(m.cols-2)), r = 2+Math.floor(rnd()*(m.rowsN-3));
    if(!m.isOpen(c,r) && !spots.some(sp=>sp.c===c&&sp.r===r)) spots.push({c,r,kind:odd[Math.floor(rnd()*odd.length)]});
  }
  s.globalAlpha = 0.45;
  spots.forEach(sp=> drawOddity(s, ox+sp.c*cs+cs/2, oy+sp.r*cs+cs/2, cs*0.55, sp.kind));
  s.globalAlpha = 1;

  // spectacular treasure the digger will never find — always one wall away
  // from a tunnel, visible to the Navigator, never collectible. The joke.
  G.treasure = [];
  const nearTunnel = (c,r)=> m.isOpen(c+1,r)||m.isOpen(c-1,r)||m.isOpen(c,r+1)||m.isOpen(c,r-1);
  const tCandidates = [];
  for(let r=1;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r) && nearTunnel(c,r) && !spots.some(sp=>sp.c===c&&sp.r===r)) tCandidates.push({c,r});
  }
  for(let i=tCandidates.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const tmp=tCandidates[i]; tCandidates[i]=tCandidates[j]; tCandidates[j]=tmp; }
  const taken = [];
  for(const cand of tCandidates){
    if(taken.length >= CONFIG.treasureCount) break;
    if(taken.some(t=> Math.abs(t.c-cand.c)+Math.abs(t.r-cand.r) < 3)) continue;
    taken.push(cand);
  }
  taken.forEach((t,i)=>{
    const kind = i%2===0? 'gems':'gold';
    G.treasure.push({c:t.c, r:t.r, kind});
    drawTreasure(s, ox+t.c*cs+cs/2, oy+t.r*cs+cs/2, cs, kind);
  });

  // very subtle paper grain
  s.globalAlpha = 0.05;
  for(let i=0;i<W*H/160;i++){
    s.fillStyle = rnd()<0.5? '#000':'#fff';
    s.fillRect(rnd()*W, rnd()*H, 1, 1);
  }
  s.globalAlpha = 1;
}

function drawSkyScene(s, rnd){
  const gy = skyH; // ground line
  // little house
  const hw = Math.min(46, skyH*0.9), hx = W*0.16, hh = hw*0.62;
  s.fillStyle = '#B9AA96'; s.fillRect(hx, gy-hh, hw, hh);
  s.fillStyle = '#8C7B66';
  s.beginPath(); s.moveTo(hx-4, gy-hh); s.lineTo(hx+hw/2, gy-hh-hw*0.42); s.lineTo(hx+hw+4, gy-hh); s.closePath(); s.fill();
  s.fillStyle = PAL.ink; s.globalAlpha=0.5;
  s.fillRect(hx+hw*0.4, gy-hh*0.55, hw*0.2, hh*0.55); // door
  s.globalAlpha=1;
  // bare tree
  const tx = W*0.78, th = skyH*0.72;
  s.strokeStyle = '#7A6A55'; s.lineWidth = 3; s.lineCap='round';
  s.beginPath(); s.moveTo(tx, gy); s.lineTo(tx, gy-th); s.stroke();
  s.lineWidth = 2;
  s.beginPath(); s.moveTo(tx, gy-th*0.55); s.lineTo(tx-th*0.35, gy-th*0.85); s.stroke();
  s.beginPath(); s.moveTo(tx, gy-th*0.7); s.lineTo(tx+th*0.3, gy-th*0.95); s.stroke();
  s.beginPath(); s.moveTo(tx, gy-th*0.4); s.lineTo(tx+th*0.25, gy-th*0.55); s.stroke();
  // washing line with little clothes
  const lx1 = hx+hw, ly1 = gy-hh*0.8, lx2 = tx-4, ly2 = gy-th*0.6;
  s.strokeStyle = PAL.ink; s.globalAlpha=0.35; s.lineWidth=1;
  s.beginPath(); s.moveTo(lx1,ly1); s.quadraticCurveTo((lx1+lx2)/2, Math.max(ly1,ly2)+8, lx2, ly2); s.stroke();
  s.globalAlpha=0.6;
  const cols = ['#A6423A','#5E7C4A','#B9AA96'];
  for(let i=1;i<=3;i++){
    const t=i/4, x=lx1+(lx2-lx1)*t, y=ly1+(ly2-ly1)*t + Math.sin(Math.PI*t)*7;
    s.fillStyle = cols[i-1]; s.fillRect(x-4, y, 8, 9);
  }
  s.globalAlpha=1;
}

function drawTreasure(s, x, y, sz, kind){
  if(kind==='gems'){
    const gem = (gx,gy,r)=>{
      s.fillStyle = PAL.gem;
      s.beginPath();
      s.moveTo(gx, gy-r); s.lineTo(gx+r*0.8, gy); s.lineTo(gx, gy+r); s.lineTo(gx-r*0.8, gy);
      s.closePath(); s.fill();
      s.fillStyle = 'rgba(242,232,216,0.4)'; // facet glint
      s.beginPath(); s.moveTo(gx, gy-r); s.lineTo(gx+r*0.3, gy-r*0.25); s.lineTo(gx-r*0.25, gy-r*0.2);
      s.closePath(); s.fill();
    };
    gem(x-sz*0.14, y+sz*0.08, sz*0.2);
    gem(x+sz*0.16, y+sz*0.14, sz*0.14);
    gem(x+sz*0.02, y-sz*0.16, sz*0.12);
  }else{ // a little hoard of gold coins
    const coin = (gx,gy)=>{
      s.fillStyle = '#C9A034';
      s.beginPath(); s.ellipse(gx, gy, sz*0.13, sz*0.09, 0, 0, Math.PI*2); s.fill();
      s.strokeStyle = '#8F7124'; s.lineWidth = 1;
      s.beginPath(); s.ellipse(gx, gy, sz*0.13, sz*0.09, 0, 0, Math.PI*2); s.stroke();
    };
    coin(x-sz*0.16, y+sz*0.14); coin(x+sz*0.14, y+sz*0.14);
    coin(x-sz*0.01, y+sz*0.12); coin(x-sz*0.02, y-sz*0.04);
  }
}

function drawOddity(s, x, y, sz, kind){
  s.fillStyle = '#5C4835';
  if(kind==='bone'){
    s.fillRect(x-sz*0.3, y-sz*0.07, sz*0.6, sz*0.14);
    [[-0.3,-0.1],[-0.3,0.1],[0.3,-0.1],[0.3,0.1]].forEach(([ax,ay])=>{
      s.beginPath(); s.arc(x+ax*sz, y+ay*sz, sz*0.1, 0, Math.PI*2); s.fill();
    });
  }else if(kind==='boot'){
    s.fillRect(x-sz*0.15, y-sz*0.3, sz*0.28, sz*0.45);
    s.fillRect(x-sz*0.15, y+0.05*sz, sz*0.5, sz*0.16);
  }else{ // teacup
    s.beginPath(); s.arc(x, y, sz*0.24, 0, Math.PI, false); s.fill();
    s.fillRect(x-sz*0.24, y-sz*0.06, sz*0.48, sz*0.08);
    s.strokeStyle = '#5C4835'; s.lineWidth=2;
    s.beginPath(); s.arc(x+sz*0.3, y+sz*0.08, sz*0.1, -Math.PI/2, Math.PI/2); s.stroke();
  }
}

/* ---------------- Stage lifecycle ---------------------------------------- */
function key(cell){ return cell.c+','+cell.r; }

function setupStage(idx){
  G.stageIdx = idx;
  G.digSpeed = WORLD().speed();      // world base speed × streak-notch lever
  G.maze = parseStage(WORLD().stageFor(idx));
  G.cell = {...G.maze.start};
  G.heading = {...G.maze.startHeading};
  G.moveFrom = null; G.moveTo = null; G.moveT = 0;
  G.dug = new Set([key(G.cell)]);
  G.trace = [{...G.cell}];
  G.sinceJunction = [{...G.cell}];
  G.lastJunction = null;
  G.bumps = [];
  G.stageMs = 0;
  G.helmetSlip = false;
  G.facing = 1;
  G.crumbs = []; G.dogPrev = null; G.dogFacing = 1;
  G.pendingSide = null; G.pendingMs = 0;
  G.particles = [];
  G.phase = 'briefing';
  layout();
  keepAwake(); // v1.1: from the briefing on, the screen never sleeps
  showBriefing();
}

function startStage(){
  AudioFX.unlock();
  keepAwake();
  hidePanel();
  G.phase = 'countdown';
  G.countdownT = CONFIG.countdownMs;
  document.getElementById('go').style.display = 'block';
  AudioFX.chime();
}

function beginMove(){
  G.moveFrom = {...G.cell};
  G.moveTo = { c: G.cell.c + G.heading.dx, r: G.cell.r + G.heading.dy };
  G.moveT = 0;
  if(G.heading.dx !== 0) G.facing = G.heading.dx;
  G.phase = 'digging';
}

function arriveAt(cell){
  G.cell = cell;
  G.dug.add(key(cell));
  G.trace.push({...cell});
  G.sinceJunction.push({...cell});
  AudioFX.digBlip();
  buzz(12);

  const m = G.maze;
  if(cell.c===m.exit.c && cell.r===m.exit.r){ breakthrough(); return; }

  const ahead = G.heading, left = turnLeft(G.heading), right = turnRight(G.heading);
  const options = [ahead, left, right].filter(d=> m.isOpen(cell.c+d.dx, cell.r+d.dy));

  if(options.length===0){ deadEndBump(); }
  else if(options.length===1){ G.heading = options[0]; beginMove(); } // corners auto-turn
  else{ enterJunction(); }
}

function enterJunction(){
  G.phase = 'junction';
  G.lastJunction = { cell:{...G.cell}, heading:{...G.heading} };
  G.sinceJunction = [{...G.cell}];
  G.junctionWaitMs = 0; G.recueMs = 0;
  G.pendingSide = null; G.pendingMs = 0;
  AudioFX.junctionCue();
  buzz(30);
}

/* v1.1 press acknowledgement: an eyes-closed Driver must never wonder
   whether the game heard them. Fires on ANY accepted junction press —
   including ones about to bump. It confirms "heard you", not "correct". */
function ackPress(){
  if(!CONFIG.pressAckEnabled) return;
  AudioFX.ack();
  buzz(25);
}

function chooseAtJunction(side){ // side: 'left' | 'right' — SCREEN directions
  G.pendingSide = null;
  ackPress();
  const dir = side==='left'? DIRS.left : DIRS.right;
  const isReverse = (dir.dx === -G.heading.dx && dir.dy === -G.heading.dy);
  if(!isReverse && G.maze.isOpen(G.cell.c+dir.dx, G.cell.r+dir.dy)){
    G.heading = dir;
    beginMove();
  }else{
    inPlaceBump();
  }
}

function chooseStraight(fromPress){ // the both-buttons chord (and timed-window default)
  G.pendingSide = null;
  if(fromPress) ackPress();
  if(G.maze.isOpen(G.cell.c+G.heading.dx, G.cell.r+G.heading.dy)) beginMove();
  else inPlaceBump();
}

/* Bumps are comedy, never failure. */
function bumpFX(){
  AudioFX.bump(WORLD().bumpDry);
  buzz([200,80,160]);
  G.shakeT = CONFIG.shakeMs;
  G.helmetSlip = true;
  dustPuff();
}

function deadEndBump(){
  G.bumps.push({...G.cell});
  bumpFX();
  G.phase = 'stunned';
  G.stunT = CONFIG.bumpStunMs;
  G.stunAfter = 'bounce';
}

function inPlaceBump(){
  G.bumps.push({...G.cell});
  bumpFX();
  G.phase = 'stunned';
  G.stunT = CONFIG.bumpStunMs;
  G.stunAfter = 'junction';
}

function startBounce(){
  // slide back along the dug corridor to the last junction
  G.bouncePath = G.sinceJunction.slice().reverse();
  G.bounceIdx = 0; G.bounceT = 0;
  G.phase = 'bouncing';
}

function endBounce(){
  const j = G.lastJunction;
  G.cell = {...j.cell};
  G.heading = {...j.heading};
  G.helmetSlip = false;
  G.trace.push({...G.cell});
  enterJunction();
}

function breakthrough(){
  G.phase = 'breakthrough';
  G.bannerT = CONFIG.bannerMs;
  AudioFX.fanfare();
  buzz([80,40,80,40,220]);
  breakthroughParticles();
  document.getElementById('banner').style.display = 'block';
}

function showReveal(){
  document.getElementById('banner').style.display = 'none';
  G.phase = 'reveal';
  G.stageTimes.push(G.stageMs);
  G.stageBumpCounts.push(G.bumps.length);
  showPanel(
    '<h1>You made it!</h1>'+
    '<p>Time '+fmtTime(G.stageMs)+' &middot; '+WORLD().bumpNoun+' '+G.bumps.length+' &#9733;</p>'+
    (G.stageIdx<2
      ? '<p class="hint">Hold both buttons together for the next stage</p>'
      : '<p class="hint">Hold both buttons together to finish the run</p>')
  );
  AudioFX.chime();
}

function finishRun(){
  const tot = G.totals();
  const best = LS.get('best', {fastestMs:null, fewestBumps:null});
  const badges = [];
  if(best.fastestMs===null || tot.time < best.fastestMs){ best.fastestMs = tot.time; badges.push('Fastest run yet!'); }
  if(best.fewestBumps===null || tot.bumps < best.fewestBumps){ best.fewestBumps = tot.bumps; badges.push('Smoothest run yet!'); }
  LS.set('best', best);
  // today's tunnels are replayable all day — track the daily seed's best too
  const sbKey = 'seedbest:'+G.runSeed;
  const sb = LS.get(sbKey, {fastestMs:null, fewestBumps:null});
  let bestToday = false;
  if(sb.fastestMs===null || tot.time < sb.fastestMs){ sb.fastestMs = tot.time; bestToday = true; }
  if(sb.fewestBumps===null || tot.bumps < sb.fewestBumps){ sb.fewestBumps = tot.bumps; bestToday = true; }
  LS.set(sbKey, sb);
  if(bestToday && badges.length===0) badges.push('Best today!');
  const runs = (LS.get('runs', 0)) + 1;
  LS.set('runs', runs);
  const streak = advanceStreak(currentStreak(), dayNumber());
  LS.set('streak', streak);
  releaseWake();
  G.phase = 'runComplete';
  G.snackT = 0;
  showPanel(
    '<h1>You made it!</h1>'+
    '<p class="vocab">Snack time!</p>'+
    '<p class="vocab">Day '+streak.count+' of digging together</p>'+
    '<p>Whole run: '+fmtTime(tot.time)+' &middot; '+tot.bumps+' '+WORLD().bumpNoun.toLowerCase()+' &#9733;</p>'+
    (badges.length? badges.map(x=>'<span class="badge">'+x+'</span>').join('') : '')+
    '<p class="dim">Today: '+fmtTime(sb.fastestMs)+' &middot; '+sb.fewestBumps+' bumps'+
    '<br>Best ever: '+fmtTime(best.fastestMs)+' &middot; smoothest '+best.fewestBumps+' bumps'+
    '<br>Runs together: '+runs+'</p>'+
    '<p class="hint">Hold both buttons together to dig again</p>'
  );
}

function nextAfterReveal(){
  if(G.stageIdx < 2){ setupStage(G.stageIdx+1); }
  else{ finishRun(); }
}

function newRun(){
  G.stageTimes = []; G.stageBumpCounts = [];
  G.runSeed = dailySeed(); // re-read: a run started after midnight gets the new day
  setupStage(0);
}

/* ---------------- Particles ---------------------------------------------- */
const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function diggerXY(){
  let p;
  if(G.phase==='digging' && G.moveTo){
    const a = cellCenter(G.moveFrom.c, G.moveFrom.r), b = cellCenter(G.moveTo.c, G.moveTo.r);
    p = { x: a.x+(b.x-a.x)*G.moveT, y: a.y+(b.y-a.y)*G.moveT };
  }else if(G.phase==='bouncing' && G.bouncePath && G.bouncePath.length>1){
    const i = Math.min(G.bounceIdx, G.bouncePath.length-2);
    const a = cellCenter(G.bouncePath[i].c, G.bouncePath[i].r);
    const b = cellCenter(G.bouncePath[i+1].c, G.bouncePath[i+1].r);
    p = { x: a.x+(b.x-a.x)*G.bounceT, y: a.y+(b.y-a.y)*G.bounceT };
  }else{
    p = cellCenter(G.cell.c, G.cell.r);
  }
  if(G.phase==='stunned' && G.stunAfter==='bounce'){
    // comedy recoil away from the wall it just hit
    const k = CONFIG.bumpBouncePx * (G.stunT/CONFIG.bumpStunMs);
    p = { x: p.x - G.heading.dx*k, y: p.y - G.heading.dy*k };
  }
  return p;
}

function dustPuff(){
  if(reducedMotion) return;
  const p = diggerXY();
  for(let i=0;i<12;i++){
    const a = Math.random()*Math.PI*2, sp = 20+Math.random()*60;
    G.particles.push({ x:p.x+G.heading.dx*cs*0.4, y:p.y+G.heading.dy*cs*0.4,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-30, life:0.5+Math.random()*0.3,
      size:cs*(0.08+Math.random()*0.1), color:WORLD().dust });
  }
}

function breakthroughParticles(){
  const p = cellCenter(G.maze.exit.c, G.maze.exit.r);
  const n = reducedMotion? 6 : 26;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 40+Math.random()*140;
    const cols = WORLD().burst;
    G.particles.push({ x:p.x, y:p.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80,
      life:0.7+Math.random()*0.6, size:cs*(0.1+Math.random()*0.18),
      color: cols[Math.floor(Math.random()*cols.length)] });
  }
}

/* ---------------- Update loop -------------------------------------------- */
let lastT = performance.now();
function update(dt){
  // stage clock runs only while actually underground
  if(PLAY_PHASES.has(G.phase)) G.stageMs += dt;

  if(G.phase==='countdown'){
    G.countdownT -= dt;
    if(G.countdownT<=0){
      document.getElementById('go').style.display = 'none';
      beginMove();
    }
  }
  else if(G.phase==='digging'){
    G.moveT += dt/1000 * G.digSpeed;
    if(G.moveT>=1){ arriveAt({...G.moveTo}); }
  }
  else if(G.phase==='junction'){
    G.recueMs += dt;
    if(G.recueMs >= CONFIG.junctionRecueMs){ G.recueMs = 0; AudioFX.junctionCue(); buzz(20); }
    if(G.pendingSide){ // single press waits briefly for its chord partner
      G.pendingMs += dt;
      if(G.pendingMs >= CONFIG.chordWindowMs){ chooseAtJunction(G.pendingSide); }
    }
    if(CONFIG.junctionPauseMs > 0){
      G.junctionWaitMs += dt;
      if(G.junctionWaitMs >= CONFIG.junctionPauseMs){ G.junctionWaitMs = 0; chooseStraight(false); }
    }
  }
  else if(G.phase==='stunned'){
    G.stunT -= dt;
    if(G.stunT<=0){
      if(G.stunAfter==='bounce') startBounce();
      else{ G.helmetSlip = false; G.phase = 'junction'; G.recueMs = 0; AudioFX.junctionCue(); }
    }
  }
  else if(G.phase==='bouncing'){
    G.bounceT += dt/1000 * G.digSpeed * CONFIG.bounceSpeedMult;
    while(G.bounceT>=1 && G.phase==='bouncing'){
      G.bounceT -= 1; G.bounceIdx++;
      if(G.bounceIdx >= G.bouncePath.length-1){ endBounce(); }
    }
  }
  else if(G.phase==='breakthrough'){
    G.bannerT -= dt;
    if(G.bannerT<=0) showReveal();
  }
  else if(G.phase==='runComplete'){
    G.snackT += dt;
  }
  else if(G.phase==='picker' && G.pendingSide){
    G.pendingMs += dt;
    if(G.pendingMs >= CONFIG.chordWindowMs){
      const side = G.pendingSide;
      chooseWorld(side==='left'? 'tunnels' : 'hat');
    }
  }

  if(G.shakeT>0) G.shakeT -= dt;

  // breadcrumbs for the dog — it retraces the digger's exact path
  if(PLAY_PHASES.has(G.phase)){
    const p = diggerXY();
    const last = G.crumbs[G.crumbs.length-1];
    if(!last || Math.hypot(p.x-last.x, p.y-last.y) > 1.5){
      G.crumbs.push({x:p.x, y:p.y});
      if(G.crumbs.length > 600) G.crumbs.shift();
    }
  }

  // particles
  for(let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i];
    p.life -= dt/1000;
    if(p.life<=0){ G.particles.splice(i,1); continue; }
    p.vy += 260*dt/1000;
    p.x += p.vx*dt/1000; p.y += p.vy*dt/1000;
  }
}

/* ---------------- Render -------------------------------------------------- */
function render(now){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);

  if(G.shakeT>0 && !reducedMotion){
    const amp = 5 * (G.shakeT/CONFIG.shakeMs);
    ctx.translate((Math.random()-0.5)*2*amp, (Math.random()-0.5)*2*amp);
  }

  if(staticLayer) ctx.drawImage(staticLayer, 0, 0, W, H);

  // dug tunnel — visibly lighter, like exposed dry dirt
  ctx.fillStyle = PAL.tunnel;
  G.dug.forEach(k=>{
    const [c,r] = k.split(',').map(Number);
    ctx.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  });

  WORLD().drawExtras(now);
  WORLD().drawExitMarker(now);

  if(G.phase==='reveal' || G.phase==='runComplete') WORLD().drawTrail();

  if(CONFIG.showLiveDigger || !PLAY_PHASES.has(G.phase)){
    if(G.phase==='briefing' || G.phase==='countdown' || G.phase==='picker'){
      WORLD().drawWaiting(now);
    }else{
      const p = diggerXY();
      WORLD().drawAvatar(p.x, p.y, now);
      if(WORLD().companion && CONFIG.showDog){
        const d = dogXY();
        drawDog(d.x, d.y, G.dogFacing, d.moving, now);
      }
    }
  }

  // particles
  G.particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life*2));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  if(G.phase==='runComplete'){ WORLD().drawCelebration(now); drawSnackScene(now); }

  if(CONFIG.debugOverlay) drawDebug();
}

function drawExitStar(now){
  const e = cellCenter(G.maze.exit.c, G.maze.exit.r);
  const pulse = reducedMotion? 0.25 : 0.18 + 0.12*Math.sin(now/400);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = PAL.paper;
  ctx.beginPath(); ctx.arc(e.x, e.y, cs*0.55, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 0.9;
  drawStar(e.x, e.y, cs*0.2, PAL.paper);
  ctx.globalAlpha = 1;
}

function wob(i){ // deterministic hand-inked wobble for the reveal line
  const x = Math.sin(i*127.1)*43758.5453;
  return (x - Math.floor(x) - 0.5) * cs*0.22;
}

function drawPathTrace(){
  if(G.trace.length<2) return;
  ctx.strokeStyle = PAL.gem;
  ctx.globalAlpha = 0.85;
  ctx.lineWidth = Math.max(2, cs*0.14);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  G.trace.forEach((cell,i)=>{
    const p = cellCenter(cell.c, cell.r);
    const x = p.x + wob(i), y = p.y + wob(i+911);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.globalAlpha = 1;
  drawBumpStars(); // a little star for every thud — the laugh-together markers
}

function drawStar(x, y, r, fill, stroke){
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0? r : r*0.45;
    const px = x+Math.cos(ang)*rad, py = y+Math.sin(ang)*rad;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  ctx.restore();
}

function drawDigger(x, y, now){
  // Always upright, mirrored by facing — never rotated (an upside-down
  // digger reads as nonsense to a small Navigator).
  const s = cs*0.62;
  const digging = G.phase==='digging';
  const bob = (!reducedMotion && digging)? Math.sin(now/70)*s*0.05 : 0;
  const jab = (!reducedMotion && digging)? Math.sin(now/60)*s*0.08 : 0;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(G.facing, 1);
  ctx.translate(0, bob);
  // spade out front
  ctx.fillStyle = PAL.spade;
  ctx.fillRect(s*0.28+jab, -s*0.05, s*0.34, s*0.1);
  ctx.beginPath();
  ctx.moveTo(s*0.62+jab, -s*0.16); ctx.lineTo(s*0.88+jab, 0); ctx.lineTo(s*0.62+jab, s*0.16);
  ctx.closePath(); ctx.fill();
  // legs
  ctx.strokeStyle = PAL.overalls; ctx.lineWidth = Math.max(2, s*0.14); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-s*0.22, s*0.12); ctx.lineTo(-s*0.32, s*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-s*0.02, s*0.12); ctx.lineTo(-s*0.06, s*0.42); ctx.stroke();
  // body (overalls)
  ctx.fillStyle = PAL.overalls;
  roundedRect(-s*0.42, -s*0.22, s*0.55, s*0.44, s*0.16);
  // head
  ctx.fillStyle = PAL.skin;
  ctx.beginPath(); ctx.arc(s*0.2, -s*0.16, s*0.2, 0, Math.PI*2); ctx.fill();
  // deadpan dot eye — hidden when the helmet slips over it
  const slip = G.helmetSlip? s*0.16 : 0;
  if(!G.helmetSlip){
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(s*0.28, -s*0.18, s*0.035, 0, Math.PI*2); ctx.fill();
  }
  // hard hat
  ctx.fillStyle = PAL.hat;
  ctx.beginPath(); ctx.arc(s*0.2 + slip*0.6, -s*0.24 + slip*0.5, s*0.2, Math.PI, 0); ctx.fill();
  ctx.fillRect(s*0.2 - s*0.26 + slip*0.6, -s*0.26 + slip*0.5, s*0.52, s*0.06);
  ctx.restore();
}

/* From stage 2, a small cat sits on the roof. It never does anything except
   flick its tail. It is never mentioned. */
function drawCat(now){
  const hw = Math.min(46, skyH*0.9), hx = W*0.16, hh = hw*0.62;
  const peakX = hx + hw/2, peakY = skyH - hh - hw*0.42;
  const s = Math.max(9, hw*0.3);
  const x = peakX, y = peakY;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = PAL.ink;
  // tail — the only motion
  const flick = reducedMotion? 0 : Math.sin(now/700)*s*0.18;
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = Math.max(1.5, s*0.14); ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-s*0.42, -s*0.12);
  ctx.quadraticCurveTo(-s*0.75, -s*0.3, -s*0.7 - flick*0.3, -s*0.62 - flick);
  ctx.stroke();
  // sitting body
  ctx.beginPath(); ctx.ellipse(-s*0.1, -s*0.28, s*0.34, s*0.3, 0, 0, Math.PI*2); ctx.fill();
  // head + ears
  ctx.beginPath(); ctx.arc(s*0.22, -s*0.62, s*0.22, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s*0.06, -s*0.74); ctx.lineTo(s*0.08, -s*0.95); ctx.lineTo(s*0.2, -s*0.8); ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s*0.3, -s*0.82); ctx.lineTo(s*0.38, -s*0.98); ctx.lineTo(s*0.42, -s*0.76); ctx.closePath(); ctx.fill();
  // deadpan eyes
  ctx.fillStyle = PAL.sky;
  ctx.beginPath(); ctx.arc(s*0.16, -s*0.64, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.3, -s*0.64, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* Soft sparkle over the treasure — a whisper only the Navigator sees. */
function drawSparkles(now){
  G.treasure.forEach((t,i)=>{
    const p = cellCenter(t.c, t.r);
    const a = reducedMotion? 0.4 : 0.25 + 0.25*Math.sin(now/320 + i*2.1);
    if(a <= 0.05) return;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.strokeStyle = PAL.paper; ctx.lineWidth = 1;
    const r = cs*0.16, sx = p.x + cs*0.28, sy = p.y - cs*0.3;
    ctx.beginPath(); ctx.moveTo(sx-r, sy); ctx.lineTo(sx+r, sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy-r); ctx.lineTo(sx, sy+r); ctx.stroke();
    ctx.restore();
  });
}

/* Run complete: the traditional after-digging snack rises onto the screen —
   a pitcher of chocolate milk and a plate of animal biscuits. */
function drawSnackScene(now){
  const pop = i =>{
    if(reducedMotion) return 1;
    const p = Math.min(1, Math.max(0, (G.snackT - i*220)/380));
    return 1 - Math.pow(1-p, 3);
  };
  const cw = Math.min(320, W*0.86), ch = Math.min(160, H*0.26);
  const cxx = W/2, top = H*0.16;
  ctx.save();
  // picnic cloth
  const k0 = pop(0);
  ctx.globalAlpha = k0;
  ctx.translate(0, (1-k0)*24);
  ctx.fillStyle = PAL.paper;
  roundedRect(cxx-cw/2, top, cw, ch, 18);
  ctx.strokeStyle = PAL.ink; ctx.globalAlpha = k0*0.25; ctx.lineWidth = 1;
  ctx.strokeRect(cxx-cw/2+6, top+6, cw-12, ch-12);
  ctx.globalAlpha = k0;

  const baseY = top + ch*0.78;
  // pitcher of chocolate milk
  const k1 = pop(1);
  if(k1>0){
    ctx.save();
    const px = cxx - cw*0.28, ph = ch*0.52;
    ctx.translate(px, baseY); ctx.scale(k1, k1);
    ctx.fillStyle = '#7B5A3C'; // chocolate milk through the glass
    ctx.beginPath();
    ctx.moveTo(-ph*0.3, 0); ctx.lineTo(-ph*0.24, -ph*0.72);
    ctx.lineTo(-ph*0.34, -ph*0.86); ctx.lineTo(-ph*0.1, -ph*0.8); // spout
    ctx.lineTo(ph*0.24, -ph*0.8); ctx.lineTo(ph*0.3, 0);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5C4023'; ctx.lineWidth = Math.max(1.5, ph*0.05); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(ph*0.28, -ph*0.66); ctx.quadraticCurveTo(ph*0.56, -ph*0.5, ph*0.26, -ph*0.2); ctx.stroke();
    ctx.fillStyle = 'rgba(242,232,216,0.5)'; // milky sheen
    ctx.fillRect(-ph*0.16, -ph*0.7, ph*0.09, ph*0.6);
    ctx.restore();
  }
  // glass, already poured
  const k2 = pop(2);
  if(k2>0){
    ctx.save();
    const gx = cxx - cw*0.04, gh = ch*0.34;
    ctx.translate(gx, baseY); ctx.scale(k2, k2);
    ctx.fillStyle = '#7B5A3C';
    ctx.fillRect(-gh*0.28, -gh*0.8, gh*0.56, gh*0.8);
    ctx.fillStyle = 'rgba(242,232,216,0.35)';
    ctx.fillRect(-gh*0.28, -gh*1.0, gh*0.56, gh*0.2);
    ctx.strokeStyle = 'rgba(51,41,31,0.4)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-gh*0.28, -gh*1.0, gh*0.56, gh);
    ctx.restore();
  }
  // animal biscuits ambling across the cloth
  const bisc = (i, bx, flip)=>{
    const k = pop(3+i);
    if(k<=0) return;
    ctx.save();
    ctx.translate(cxx + bx, baseY - ch*0.03); ctx.scale(k*(flip?-1:1), k);
    const s = ch*0.16;
    ctx.fillStyle = '#D9B98A';
    roundedRect(-s*0.55, -s*0.55, s*1.1, s*0.6, s*0.24);           // body
    ctx.beginPath(); ctx.arc(s*0.62, -s*0.5, s*0.3, 0, Math.PI*2); ctx.fill(); // head
    ctx.fillRect(-s*0.42, 0, s*0.2, s*0.3);                        // legs
    ctx.fillRect(s*0.22, 0, s*0.2, s*0.3);
    if(i===0){ ctx.fillRect(s*0.82, -s*0.5, s*0.26, s*0.12); }     // elephant trunk
    if(i===1){ ctx.beginPath(); ctx.arc(s*0.5, -s*0.82, s*0.12, 0, Math.PI*2); ctx.fill(); } // bear ear
    ctx.restore();
  };
  bisc(0, cw*0.12, false);
  bisc(1, cw*0.27, true);
  bisc(2, cw*0.40, false);
  ctx.restore();
}

/* The dog trots a fixed distance behind the digger along its exact trail —
   so it turns around and backs up after a bump, which is most of the joke. */
function dogXY(){
  const lag = CONFIG.dogLagTiles * cs;
  const cr = G.crumbs;
  let pos = null;
  if(cr.length >= 2){
    let acc = 0;
    for(let i=cr.length-1; i>0; i--){
      const a = cr[i], b = cr[i-1];
      const seg = Math.hypot(a.x-b.x, a.y-b.y);
      if(acc + seg >= lag){
        const t = (lag - acc)/seg;
        pos = { x: a.x + (b.x-a.x)*t, y: a.y + (b.y-a.y)*t };
        break;
      }
      acc += seg;
    }
    if(!pos) pos = {...cr[0]};
  }else{
    const p = diggerXY();
    pos = { x: p.x, y: p.y };
  }
  let moving = false;
  if(G.dogPrev){
    const dx = pos.x - G.dogPrev.x;
    if(Math.abs(dx) > 0.4) G.dogFacing = dx > 0 ? 1 : -1;
    moving = Math.hypot(dx, pos.y - G.dogPrev.y) > 0.4;
  }
  G.dogPrev = { x: pos.x, y: pos.y };
  return { x: pos.x, y: pos.y, moving };
}

function drawDog(x, y, facing, moving, now){
  const s = cs*0.4;
  const trot = (!reducedMotion && moving)? Math.sin(now/55)*s*0.09 : 0;
  ctx.save();
  ctx.translate(x, y + s*0.18);
  ctx.scale(facing, 1);
  ctx.translate(0, trot);
  const coat = '#8C7B66', dark = '#6E5F4D';
  // legs
  ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.5, s*0.14); ctx.lineCap='round';
  const step = (!reducedMotion && moving)? Math.sin(now/55)*s*0.14 : 0;
  ctx.beginPath(); ctx.moveTo(-s*0.32, s*0.1); ctx.lineTo(-s*0.32 - step, s*0.42); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( s*0.18, s*0.1); ctx.lineTo( s*0.18 + step, s*0.42); ctx.stroke();
  // body
  ctx.fillStyle = coat;
  ctx.beginPath(); ctx.ellipse(-s*0.05, 0, s*0.42, s*0.24, 0, 0, Math.PI*2); ctx.fill();
  // tail — a happy stub
  const wag = (!reducedMotion)? Math.sin(now/90)*0.5 : 0;
  ctx.strokeStyle = coat; ctx.lineWidth = Math.max(1.5, s*0.12);
  ctx.beginPath(); ctx.moveTo(-s*0.45, -s*0.06);
  ctx.lineTo(-s*0.62, -s*0.22 - wag*s*0.12); ctx.stroke();
  // head
  ctx.fillStyle = coat;
  ctx.beginPath(); ctx.arc(s*0.42, -s*0.16, s*0.22, 0, Math.PI*2); ctx.fill();
  // snout
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(s*0.58, -s*0.1, s*0.12, s*0.08, 0, 0, Math.PI*2); ctx.fill();
  // floppy ear (it pricks up for gems — but gems are a v2 story)
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(s*0.34, -s*0.34); ctx.quadraticCurveTo(s*0.2, -s*0.1, s*0.34, -s*0.04);
  ctx.quadraticCurveTo(s*0.44, -s*0.16, s*0.34, -s*0.34);
  ctx.fill();
  // deadpan dot eye
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(s*0.48, -s*0.22, s*0.035, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath(); ctx.fill();
}

/* ================= World Two — THE HAT: desert drawing =================== */
const HPAL = {
  sand:'#DCC9A0', path:'#EADDBA', scrub:'#8A9B6E', scrubDark:'#6F815A',
  boulder:'#A79C88', log:'#B0A183', pool:'#5E7876', stone:'#B9AE97',
  shadow:'rgba(60,50,35,0.18)', shell:'#7A8560', shellDark:'#5F6A4A',
  neck:'#8A9467', foot:'#6F7A55', rock:'#B4A88F',
};

function buildStaticHat(s, rnd, m){
  G.treasure = []; // no buried fortunes here — the joke is a second hat
  s.fillStyle = HPAL.sand; s.fillRect(0,0,W,H);

  // walkable sand paths, pale and trodden
  s.fillStyle = HPAL.path;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r)) s.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  }

  const deco = m.decor || HAT_DECOR[G.stageIdx];
  const lm = m.landmarks || HAT_LANDMARKS[G.stageIdx];
  const reserved = (c,r)=> lm.some(L=>L.c===c&&L.r===r) ||
    (deco.secondHat.c===c&&deco.secondHat.r===r) || (deco.lizard.c===c&&deco.lizard.r===r);

  // impassable scrub — flat shapes, single flat shadows cast to one side
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r) || reserved(c,r)) continue;
    if(rnd() < 0.18) continue; // the occasional gap of bare sand
    const x = ox+c*cs+cs/2, y = oy+r*cs+cs/2;
    const kind = rnd();
    if(kind < 0.45) drawBush(s, x, y, cs, rnd);
    else if(kind < 0.7) drawBoulder(s, x, y, cs, rnd);
    else if(kind < 0.85) drawPricklyPear(s, x, y, cs, rnd);
    else drawDune(s, x, y, cs, rnd);
  }

  // landmarks — bigger, distinct, nameable
  lm.forEach(L=> drawLandmark(s, ox+L.c*cs+cs/2, oy+L.r*cs+cs/2, cs, L.kind));

  // the second hat, half-buried, never acknowledged
  if(CONFIG.buriedSecondHat){
    const sh = deco.secondHat;
    const x = ox+sh.c*cs+cs/2, y = oy+sh.r*cs+cs/2;
    s.fillStyle = PAL.gem; s.globalAlpha = 0.8;
    s.beginPath(); s.ellipse(x, y+cs*0.1, cs*0.3, cs*0.12, 0.2, Math.PI, 0, true); s.fill();
    s.globalAlpha = 1;
  }

  // a rock for the lizard to sun on
  drawBoulder(s, ox+deco.lizard.c*cs+cs/2, oy+deco.lizard.r*cs+cs/2, cs, rnd);

  // THE HAT — visible from the very first frame
  const e = m.exit;
  drawHatIcon(s, ox+e.c*cs+cs/2, oy+e.r*cs+cs/2, cs*0.42);

  // the Watcher's rock (the tortoise itself is drawn live — it turns its head)
  s.fillStyle = HPAL.shadow;
  s.beginPath(); s.ellipse(W*0.5+botH*0.12, H-botH*0.38, botH*0.85, botH*0.32, 0, 0, Math.PI*2); s.fill();
  s.fillStyle = HPAL.rock;
  s.beginPath(); s.ellipse(W*0.5, H-botH*0.45, botH*0.8, botH*0.34, 0, 0, Math.PI*2); s.fill();

  // paper grain
  s.globalAlpha = 0.05;
  for(let i=0;i<W*H/160;i++){
    s.fillStyle = rnd()<0.5? '#000':'#fff';
    s.fillRect(rnd()*W, rnd()*H, 1, 1);
  }
  s.globalAlpha = 1;
}

function shadowBlob(s, x, y, rx, ry){
  s.fillStyle = HPAL.shadow;
  s.beginPath(); s.ellipse(x+rx*0.35, y+ry*0.45, rx, ry*0.8, 0, 0, Math.PI*2); s.fill();
}
function drawBush(s, x, y, sz, rnd){
  const r = sz*(0.28+rnd()*0.1);
  shadowBlob(s, x, y, r, r);
  s.fillStyle = HPAL.scrub;
  s.beginPath(); s.ellipse(x, y, r, r*0.85, 0, 0, Math.PI*2); s.fill();
  s.fillStyle = HPAL.scrubDark;
  s.beginPath(); s.ellipse(x-r*0.3, y+r*0.2, r*0.4, r*0.3, 0, 0, Math.PI*2); s.fill();
}
function drawBoulder(s, x, y, sz, rnd){
  const r = sz*(0.26+rnd()*0.1);
  shadowBlob(s, x, y, r, r);
  s.fillStyle = HPAL.boulder;
  s.beginPath(); s.ellipse(x, y, r, r*0.8, rnd()*0.6, 0, Math.PI*2); s.fill();
}
function drawPricklyPear(s, x, y, sz, rnd){
  const r = sz*0.2;
  shadowBlob(s, x, y, r*1.4, r);
  s.fillStyle = HPAL.scrubDark;
  s.beginPath(); s.ellipse(x-r*0.5, y, r*0.8, r, 0.4, 0, Math.PI*2); s.fill();
  s.beginPath(); s.ellipse(x+r*0.5, y-r*0.3, r*0.7, r*0.9, -0.4, 0, Math.PI*2); s.fill();
}
function drawDune(s, x, y, sz, rnd){
  s.fillStyle = 'rgba(60,50,35,0.08)';
  s.beginPath(); s.ellipse(x, y+sz*0.1, sz*0.4, sz*0.14, 0, 0, Math.PI); s.fill();
}
function drawLandmark(s, x, y, sz, kind){
  if(kind==='cactus'){
    shadowBlob(s, x, y+sz*0.1, sz*0.3, sz*0.2);
    s.strokeStyle = HPAL.scrubDark; s.lineCap='round'; s.lineWidth = sz*0.16;
    s.beginPath(); s.moveTo(x, y+sz*0.32); s.lineTo(x, y-sz*0.34); s.stroke();
    s.beginPath(); s.moveTo(x, y); s.lineTo(x-sz*0.24, y-sz*0.05); s.lineTo(x-sz*0.24, y-sz*0.22); s.stroke();
    s.beginPath(); s.moveTo(x, y+sz*0.12); s.lineTo(x+sz*0.24, y+sz*0.06); s.lineTo(x+sz*0.24, y-sz*0.12); s.stroke();
  }else if(kind==='stones'){
    shadowBlob(s, x, y, sz*0.3, sz*0.22);
    s.fillStyle = HPAL.stone;
    s.beginPath(); s.ellipse(x, y+sz*0.18, sz*0.3, sz*0.14, 0, 0, Math.PI*2); s.fill();
    s.beginPath(); s.ellipse(x, y, sz*0.22, sz*0.12, 0, 0, Math.PI*2); s.fill();
    s.beginPath(); s.ellipse(x, y-sz*0.16, sz*0.14, sz*0.1, 0, 0, Math.PI*2); s.fill();
  }else if(kind==='log'){
    shadowBlob(s, x, y, sz*0.36, sz*0.14);
    s.fillStyle = HPAL.log;
    s.save(); s.translate(x,y); s.rotate(0.35);
    s.fillRect(-sz*0.36, -sz*0.1, sz*0.72, sz*0.2);
    s.fillStyle = '#8F7F63';
    s.beginPath(); s.ellipse(sz*0.36, 0, sz*0.05, sz*0.1, 0, 0, Math.PI*2); s.fill();
    s.restore();
  }else if(kind==='pool'){ // dark pool
    s.fillStyle = HPAL.pool;
    s.beginPath(); s.ellipse(x, y, sz*0.34, sz*0.22, 0, 0, Math.PI*2); s.fill();
    s.strokeStyle = HPAL.path; s.lineWidth = 1;
    s.beginPath(); s.ellipse(x, y, sz*0.34, sz*0.22, 0, 0, Math.PI*2); s.stroke();
  }else if(kind==='flower'){ // the big flower — improbable and unremarked
    shadowBlob(s, x, y, sz*0.2, sz*0.16);
    s.fillStyle = '#D9A0A8';
    for(let i=0;i<6;i++){
      const a = i*Math.PI/3;
      s.beginPath(); s.ellipse(x+Math.cos(a)*sz*0.16, y+Math.sin(a)*sz*0.16, sz*0.12, sz*0.08, a, 0, Math.PI*2); s.fill();
    }
    s.fillStyle = '#C9A034';
    s.beginPath(); s.arc(x, y, sz*0.1, 0, Math.PI*2); s.fill();
  }else if(kind==='bird'){ // the sleepy bird — eyes shut, like somebody else here
    shadowBlob(s, x, y, sz*0.22, sz*0.16);
    s.fillStyle = '#9A8A74';
    s.beginPath(); s.ellipse(x, y+sz*0.06, sz*0.22, sz*0.17, 0, 0, Math.PI*2); s.fill();
    s.beginPath(); s.arc(x+sz*0.16, y-sz*0.12, sz*0.11, 0, Math.PI*2); s.fill();
    s.fillStyle = '#C9A034';
    s.beginPath(); s.moveTo(x+sz*0.26, y-sz*0.12); s.lineTo(x+sz*0.38, y-sz*0.09); s.lineTo(x+sz*0.26, y-sz*0.05);
    s.closePath(); s.fill();
    s.strokeStyle = PAL.ink; s.lineWidth = 1; s.globalAlpha = 0.6;
    s.beginPath(); s.arc(x+sz*0.18, y-sz*0.14, sz*0.03, 0.2, Math.PI-0.2); s.stroke(); // a closed eye
    s.globalAlpha = 1;
  }else{ // anthill — industrious neighbours
    shadowBlob(s, x, y, sz*0.24, sz*0.14);
    s.fillStyle = '#C4A87E';
    s.beginPath(); s.ellipse(x, y, sz*0.26, sz*0.18, 0, 0, Math.PI*2); s.fill();
    s.fillStyle = '#8F7658';
    s.beginPath(); s.arc(x, y, sz*0.07, 0, Math.PI*2); s.fill();
    s.fillStyle = PAL.ink; s.globalAlpha = 0.5;
    [[0.3,0.1],[0.38,0.2],[-0.32,0.16],[0.1,0.32]].forEach(([ax,ay])=>{
      s.fillRect(x+ax*sz, y+ay*sz, 1.5, 1.5);
    });
    s.globalAlpha = 1;
  }
}
function drawHatIcon(s, x, y, r){ // the hat from above: concentric and proud
  shadowBlob(s, x, y, r, r*0.8);
  s.fillStyle = PAL.gem;
  s.beginPath(); s.arc(x, y, r, 0, Math.PI*2); s.fill();
  s.fillStyle = '#8C2E39';
  s.beginPath(); s.arc(x, y, r*0.55, 0, Math.PI*2); s.fill();
  s.fillStyle = PAL.gem;
  s.beginPath(); s.arc(x, y, r*0.18, 0, Math.PI*2); s.fill();
}
function drawHatPulse(now){
  const e = cellCenter(G.maze.exit.c, G.maze.exit.r);
  const pulse = reducedMotion? 0.2 : 0.12 + 0.1*Math.sin(now/400);
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = PAL.paper; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(e.x, e.y, cs*0.6, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawSeeker(x, y, now){
  const s = cs*0.62;
  const walking = G.phase==='digging' || G.phase==='bouncing';
  const ang = Math.atan2(G.heading.dy, G.heading.dx) + Math.PI/2;
  const waddle = (!reducedMotion && walking)? Math.sin(now/120)*0.07 : 0;
  const tucked = G.helmetSlip; // the shell-bonk: everything disappears inside
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang + waddle);
  if(!tucked){
    const step = (!reducedMotion && walking)? Math.sin(now/120)*s*0.07 : 0;
    ctx.fillStyle = HPAL.foot;
    [[-0.3,-0.26,step],[0.3,-0.26,-step],[-0.3,0.28,-step],[0.3,0.28,step]].forEach(p=>{
      ctx.beginPath(); ctx.ellipse(p[0]*s, p[1]*s+p[2], s*0.1, s*0.13, 0, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = HPAL.neck; // head out front, deadpan
    ctx.beginPath(); ctx.ellipse(0, -s*0.48, s*0.13, s*0.17, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(-s*0.05, -s*0.54, s*0.025, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.05, -s*0.54, s*0.025, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = HPAL.shell;
  ctx.beginPath(); ctx.arc(0, 0, s*0.36, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = HPAL.shellDark; ctx.lineWidth = Math.max(1, s*0.05);
  ctx.beginPath(); ctx.arc(0, 0, s*0.22, 0, Math.PI*2); ctx.stroke();
  for(let i=0;i<6;i++){
    const a = i*Math.PI/3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*s*0.22, Math.sin(a)*s*0.22);
    ctx.lineTo(Math.cos(a)*s*0.35, Math.sin(a)*s*0.35);
    ctx.stroke();
  }
  // once won, the hat is worn and never comes off
  if(G.phase==='breakthrough' || G.phase==='reveal' || G.phase==='runComplete'){
    ctx.fillStyle = PAL.gem;
    ctx.beginPath(); ctx.arc(0, 0, s*0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8C2E39';
    ctx.beginPath(); ctx.arc(0, 0, s*0.1, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawWatcher(now){
  const wx = W*0.5, wy = H - botH*0.5;
  const p = diggerXY();
  const target = Math.atan2(p.y - wy, p.x - wx);
  let d = target - G.watcherAng;
  while(d >  Math.PI) d -= 2*Math.PI;
  while(d < -Math.PI) d += 2*Math.PI;
  G.watcherAng += d * (reducedMotion? 1 : 0.02); // the only camera in the game
  const s = botH*0.42;
  ctx.save();
  ctx.translate(wx, wy);
  ctx.fillStyle = HPAL.shell;
  ctx.beginPath(); ctx.arc(0, 0, s*0.5, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = HPAL.shellDark; ctx.lineWidth = Math.max(1, s*0.06);
  ctx.beginPath(); ctx.arc(0, 0, s*0.3, 0, Math.PI*2); ctx.stroke();
  ctx.rotate(G.watcherAng);
  ctx.fillStyle = HPAL.neck;
  ctx.beginPath(); ctx.ellipse(s*0.62, 0, s*0.2, s*0.14, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = PAL.ink;
  ctx.beginPath(); ctx.arc(s*0.68, -s*0.05, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(s*0.68,  s*0.05, s*0.03, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawLizard(now){
  const L = (G.maze.decor || HAT_DECOR[G.stageIdx]).lizard;
  const p = cellCenter(L.c, L.r);
  const s = cs*0.32;
  ctx.save();
  ctx.translate(p.x, p.y - cs*0.08);
  ctx.rotate(0.5);
  ctx.fillStyle = '#A8865C';
  ctx.beginPath(); ctx.ellipse(0, 0, s*0.5, s*0.2, 0, 0, Math.PI*2); ctx.fill();     // body
  ctx.beginPath(); ctx.arc(s*0.55, 0, s*0.16, 0, Math.PI*2); ctx.fill();             // head
  ctx.strokeStyle = '#A8865C'; ctx.lineWidth = Math.max(1, s*0.1); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-s*0.45, 0); ctx.quadraticCurveTo(-s*0.85, s*0.15, -s*1.0, -s*0.05); ctx.stroke(); // tail
  // it never moves, except to blink
  const blink = !reducedMotion && (Math.floor(now/3800) % 2 === 0) && (now % 3800 < 180);
  if(!blink){
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(s*0.6, -s*0.06, s*0.035, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawBumpStars(){
  G.bumps.forEach(b=>{
    const p = cellCenter(b.c, b.r);
    drawStar(p.x, p.y, cs*0.28, PAL.paper, PAL.ink);
  });
}

function drawFootprints(){
  if(G.trace.length < 2) return;
  ctx.fillStyle = 'rgba(90,74,54,0.55)';
  let parity = 0, carry = 0;
  const gap = cs*0.32;
  for(let i=1;i<G.trace.length;i++){
    const a = cellCenter(G.trace[i-1].c, G.trace[i-1].r);
    const b = cellCenter(G.trace[i].c, G.trace[i].r);
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx, dy);
    if(len < 0.001) continue;
    const ux = dx/len, uy = dy/len;      // along; perpendicular is (-uy, ux)
    for(let t=carry; t<len; t+=gap){
      const side = (parity++ % 2 === 0)? 1 : -1;
      const px = a.x + ux*t - uy*side*cs*0.09;
      const py = a.y + uy*t + ux*side*cs*0.09;
      ctx.beginPath(); ctx.ellipse(px, py, cs*0.05, cs*0.07, Math.atan2(dy,dx)+Math.PI/2, 0, Math.PI*2); ctx.fill();
    }
    carry = (carry + Math.ceil((len-carry)/gap)*gap) - len;
  }
  drawBumpStars();
  // landmark names, tiny and sentence-case — the reveal teaches the words
  ctx.fillStyle = PAL.ink; ctx.font = '600 10px -apple-system, ui-rounded, system-ui, sans-serif';
  ctx.textAlign = 'center';
  (G.maze.landmarks || HAT_LANDMARKS[G.stageIdx]).forEach(L=>{
    const p = cellCenter(L.c, L.r);
    ctx.fillText(L.label, p.x, Math.min(H-botH-4, p.y + cs*0.75));
  });
  ctx.textAlign = 'start';
}

function drawSunset(now){
  // the one elevation shot in this world, like the last page of a picture book
  const bands = ['#E8B87E','#DFA271','#D08A63'];
  const bh = H*0.14;
  bands.forEach((b,i)=>{ ctx.fillStyle=b; ctx.fillRect(0, i*bh, W, bh+1); });
  ctx.fillStyle = '#C67B5B'; ctx.fillRect(0, 3*bh, W, H-3*bh);
  ctx.fillStyle = '#F2D8A7';
  ctx.beginPath(); ctx.arc(W*0.5, bh*3, Math.min(54, W*0.12), 0, Math.PI, true); ctx.fill();
  ctx.fillStyle = '#7A6248'; ctx.fillRect(0, H*0.52, W, H*0.48);
  // the big rock
  ctx.fillStyle = '#59483A';
  roundedRect(W*0.28, H*0.5, W*0.44, H*0.13, 14);
  // two tortoises, side by side, saying nothing
  const tort = (tx, flip)=>{
    ctx.save();
    ctx.translate(tx, H*0.5);
    ctx.scale(flip? -1:1, 1);
    ctx.fillStyle = '#3E3428';
    ctx.beginPath(); ctx.arc(0, 0, 15, Math.PI, 0); ctx.fill();
    ctx.fillRect(-15, -2, 30, 5);
    ctx.beginPath(); ctx.ellipse(19, -3, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  };
  tort(W*0.41, false); tort(W*0.59, true);
  // one hat between them
  ctx.fillStyle = PAL.gem;
  ctx.beginPath();
  ctx.moveTo(W*0.5-9, H*0.5-3); ctx.lineTo(W*0.5, H*0.5-19); ctx.lineTo(W*0.5+9, H*0.5-3);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(W*0.5-14, H*0.5-4, 28, 4);
}
/* ================= end World Two drawing ================================= */

function drawDebug(){
  const m = G.maze;
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 0.5;
  for(let r=0;r<=m.rowsN;r++){ ctx.beginPath(); ctx.moveTo(ox, oy+r*cs); ctx.lineTo(ox+m.cols*cs, oy+r*cs); ctx.stroke(); }
  for(let c=0;c<=m.cols;c++){ ctx.beginPath(); ctx.moveTo(ox+c*cs, oy); ctx.lineTo(ox+c*cs, oy+m.rowsN*cs); ctx.stroke(); }
  ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
  ctx.fillText('phase: '+G.phase+'  cell: '+key(G.cell)+'  hdg: '+G.heading.dx+','+G.heading.dy, 8, H-8);
  ctx.fillText('seed: '+G.runSeed+'  '+(G.maze.generated? 'generated':'FALLBACK'), 8, H-20);
}

/* ---------------- HUD & panels ------------------------------------------- */
function fmtTime(ms){
  if(ms===null || ms===undefined) return '–';
  const s = Math.floor(ms/1000);
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function updateHUD(){
  const inPlay = PLAY_PHASES.has(G.phase) || G.phase==='countdown';
  document.getElementById('hudStage').textContent =
    G.phase==='picker'? '' : WORLD().label+' · Stage '+(G.stageIdx+1)+' of 3';
  document.getElementById('hudTime').textContent = (inPlay || G.phase==='breakthrough')? fmtTime(G.stageMs) : '';
  document.getElementById('hudBumps').textContent = (inPlay && G.bumps.length)? '★ '+G.bumps.length : '';
}

const panelEl = document.getElementById('panel');
function showPanel(html){ panelEl.innerHTML = html; panelEl.style.display = 'block'; }
function hidePanel(){ panelEl.style.display = 'none'; }
/* World picker: green = Tunnels, red = The Hat, chord = same as last time.
   The buttons teach themselves. Exists only once the ritual has earned it. */
function showPicker(){
  G.phase = 'picker';
  G.pendingSide = null; G.pendingMs = 0;
  showPanel(
    '<h1>Where today?</h1>'+
    '<p class="vocab"><b class="g">Green</b> &mdash; Tunnels<br><b class="r">Red</b> &mdash; The Hat</p>'+
    '<p class="hint">Both together &mdash; same as last time</p>'
  );
}

function chooseWorld(worldId){
  G.pendingSide = null;
  AudioFX.chime();
  G.world = worldId;
  LS.set('lastWorld', worldId);
  setupStage(0);
}

let dndNudgeShown = false; // once per session, quietly (v1.1)
function showBriefing(){
  const dnd = dndNudgeShown? '' :
    '<p class="hint">Tip: turn on Do Not Disturb &mdash; the Driver can\'t see notifications coming</p>';
  dndNudgeShown = true;
  showPanel(
    '<h1>Stage '+(G.stageIdx+1)+' of 3</h1>'+
    '<p>Make a plan together!</p>'+
    '<p class="vocab"><b class="g">Green</b> is left &middot; <b class="r">Red</b> is right<br>Both together is straight on (&ldquo;keep going!&rdquo;)</p>'+
    dnd+
    '<p class="hint">Driver: eyes closed? Hold both buttons to start</p>'
  );
}

/* ---------------- Input — two buttons only, forever ----------------------- */
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
let leftHeld = false, rightHeld = false;

function press(side){
  AudioFX.unlock();
  if(G.phase==='picker'){
    // same chord grammar as everywhere else: singles pick, the chord repeats
    if(G.pendingSide && G.pendingSide!==side){ chooseWorld(G.world); }
    else if(!G.pendingSide){ G.pendingSide = side; G.pendingMs = 0; }
    return;
  }
  if(G.phase!=='junction') return; // mid-corridor presses are silently ignored
  if(G.pendingSide && G.pendingSide!==side){
    // second button landed inside the grace window — that's the chord
    chooseStraight(true);
  }else if(!G.pendingSide){
    G.pendingSide = side; G.pendingMs = 0;
  }
}

function bothPressCheck(){
  if(!(leftHeld && rightHeld)) return;
  if(!G.bothArmed) return;
  G.bothArmed = false;
  if(G.phase==='briefing') startStage();
  else if(G.phase==='reveal') nextAfterReveal();
  else if(G.phase==='runComplete') newRun();
}

function bindButton(el, side){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    el.classList.add('held');
    // v1.1 per-button signature: green = one pulse, red = two — the Driver
    // verifies her grip by feel, eyes shut
    buzz(side==='left'? CONFIG.hapticSigLeft : CONFIG.hapticSigRight);
    if(side==='left') leftHeld = true; else rightHeld = true;
    press(side);
    bothPressCheck();
  });
  const up = ()=>{
    el.classList.remove('held');
    if(side==='left') leftHeld = false; else rightHeld = false;
    if(!leftHeld && !rightHeld) G.bothArmed = true;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', e=> e.preventDefault());
}
bindButton(btnLeft, 'left');
bindButton(btnRight, 'right');

// Accidental exits are catastrophic mid-stage: swallow touches outside the buttons.
document.addEventListener('touchstart', e=>{
  if(!e.target.closest('#controls button') && !e.target.closest('#dev')) e.preventDefault();
}, {passive:false});
document.addEventListener('gesturestart', e=> e.preventDefault());

// Arrow keys mirror the buttons for desktop testing; Enter/Space/Down = chord.
window.addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(e.key==='ArrowLeft'){ leftHeld = true; press('left'); bothPressCheck(); }
  else if(e.key==='ArrowRight'){ rightHeld = true; press('right'); bothPressCheck(); }
  else if(e.key==='Enter' || e.key===' ' || e.key==='ArrowDown'){
    if(G.phase==='junction'){ chooseStraight(true); return; }
    if(G.phase==='picker'){ chooseWorld(G.world); return; }
    leftHeld = true; rightHeld = true; bothPressCheck();
    leftHeld = false; rightHeld = false; G.bothArmed = true;
  }
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') leftHeld = false;
  if(e.key==='ArrowRight') rightHeld = false;
  if(!leftHeld && !rightHeld) G.bothArmed = true;
});

/* ---------------- Dev panel — tap the sky 5 times ------------------------- */
let skyTaps = [], devOpen = false;
canvas.addEventListener('pointerdown', e=>{
  if(PLAY_PHASES.has(G.phase) || G.phase==='countdown') return; // no extra targets during play
  if(e.clientY > skyH) return;
  const now = performance.now();
  skyTaps = skyTaps.filter(t=> now-t < 2500);
  skyTaps.push(now);
  if(skyTaps.length>=5){ skyTaps = []; toggleDev(); }
});

const devEl = document.getElementById('dev');
function toggleDev(){
  devOpen = !devOpen;
  devEl.style.display = devOpen? 'block':'none';
  if(devOpen) buildDevPanel();
}
function buildDevPanel(){
  let html = '<h2>Tunnels — tuning panel</h2>';
  for(const k of Object.keys(CONFIG_DEFAULTS)){
    const v = CONFIG[k];
    if(typeof CONFIG_DEFAULTS[k]==='boolean'){
      html += '<div class="row"><label>'+k+'</label><input type="checkbox" id="cfg-'+k+'" '+(v?'checked':'')+'></div>';
    }else if(typeof CONFIG_DEFAULTS[k]==='number'){
      html += '<div class="row"><label>'+k+'</label><input type="number" step="any" id="cfg-'+k+'" value="'+v+'"></div>';
    }else{
      const txt = (v===null||v===undefined)? '' : (typeof v==='string'? v : JSON.stringify(v));
      html += '<div class="row"><label>'+k+'</label><input type="text" id="cfg-'+k+'" value="'+txt.replace(/"/g,'&quot;')+'"></div>';
    }
  }
  html += '<div class="btns">'+
    '<button id="devSave">Save &amp; apply</button>'+
    '<button id="devReset">Reset to defaults</button>'+
    '<button id="devExport">Export config as JSON</button>'+
    '<button id="devClose">Close</button></div>'+
    '<textarea id="devOut" readonly placeholder="Exported JSON appears here"></textarea>';
  devEl.innerHTML = html;
  document.getElementById('devSave').onclick = ()=>{
    for(const k of Object.keys(CONFIG_DEFAULTS)){
      const el = document.getElementById('cfg-'+k);
      const def = CONFIG_DEFAULTS[k];
      if(typeof def==='boolean') CONFIG[k] = el.checked;
      else if(typeof def==='number') CONFIG[k] = Number(el.value);
      else{
        const raw = el.value.trim();
        if(raw==='') CONFIG[k] = null;
        else if(raw.startsWith('[')||raw.startsWith('{')){ try{ CONFIG[k]=JSON.parse(raw); }catch(err){} }
        else CONFIG[k] = raw;
      }
    }
    LS.set('config', CONFIG);
    applyConfigCosmetics();
    layout();
  };
  document.getElementById('devReset').onclick = ()=>{
    Object.assign(CONFIG, CONFIG_DEFAULTS);
    try{ localStorage.removeItem('tunnels:config'); }catch(err){}
    applyConfigCosmetics();
    layout();
    buildDevPanel();
  };
  document.getElementById('devExport').onclick = ()=>{
    const json = JSON.stringify(CONFIG, null, 2);
    document.getElementById('devOut').value = json;
    if(navigator.clipboard) navigator.clipboard.writeText(json).catch(()=>{});
  };
  document.getElementById('devClose').onclick = toggleDev;
}

function applyConfigCosmetics(){
  document.documentElement.style.setProperty('--colour-left', CONFIG.colourLeft);
  document.documentElement.style.setProperty('--colour-right', CONFIG.colourRight);
}

/* ---------------- Boot ---------------------------------------------------- */
applyConfigCosmetics();
G.runSeed = dailySeed();
const lastWorld = LS.get('lastWorld', 'tunnels');
G.world = WORLDS[lastWorld]? lastWorld : 'tunnels';
setupStage(0);
// World Two exists only after the ritual has earned it; until then, no picker
if(LS.get('runs', 0) >= CONFIG.hatUnlockRuns) showPicker();

function frame(now){
  const dt = Math.min(100, now - lastT);
  lastT = now;
  update(dt);
  render(now);
  updateHUD();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// exposed for the tuning panel & automated tests
window.TUNNELS = { G, CONFIG, FALLBACK_STAGES, HAT_STAGES, WORLDS, setupStage,
  dailySeed, generateStageRows, validateStage, solveMaze, chooseWorld,
  generateHatStage, placeLandmarks, LANDMARK_KINDS,
  advanceStreak, currentStreak, effectiveGenParams, dayNumber };
</script>
