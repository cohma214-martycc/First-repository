  const hosts = panelEl.querySelectorAll('.rackHost');
  hosts.forEach(host=>{
    const golden = host.getAttribute('data-golden')==='1';
    const hi = host.getAttribute('data-highlight');
    const highlight = new Set(hi? hi.split(',').filter(Boolean) : []);
    const select = host.getAttribute('data-select') || null;
    host.innerHTML = buildRackSVG({ golden, highlight, select });
    host.querySelectorAll('.pegHit').forEach(rect=>{
      rect.addEventListener('pointerdown', e=>{
        e.stopPropagation();
        onRackPeg(Number(rect.getAttribute('data-peg')));
      });
    });
  });
}
/* The rack gesture (door three): tap the pegs 4-3-2-1 within four seconds. */
function onRackPeg(idx){
  const now = performance.now();
  rackTaps = rackTaps.filter(t=> now - t.t < 4000);
  rackTaps.push({ i: idx, t: now });
  const want = [3,2,1,0];
  const tail = rackTaps.slice(-4).map(x=> x.i);
  if(tail.length===4 && tail.every((v,k)=> v===want[k])){
    rackTaps = [];
    setPlaytest(!playtest);
    // re-render whatever card is showing so the tell appears/disappears
    if(G.phase==='picker') showPicker();
    else mountRacks();
  }
}
/* World picker — the rack IS the picker (§11, §14.5), and it opens at every
   boot. With three worlds lit from day one the N-world stepper is the only
   branch actually reachable: green steps left along the rack, red steps right,
   the chord goes there, locked pegs are skipped. The single-world and
   two-world branches below stay as a guard — their conditions are duplicated
   across four call sites, and they are the correct fallback if a future world
   ever ships locked or worldUnlockDays is edited in the dev panel. No new
   touch targets in any case.                                               */
function showPicker(){
  G.phase = 'picker';
  G.pendingSide = null; G.pendingMs = 0;
  // only worlds that are both unlocked AND actually implemented are selectable —
  // Deep Water's peg can be unlocked (or shown in playtest) before its world
  // exists, and must never be steppable to (WORLDS.deep is undefined until §13)
  G.pickerWorlds = RACK_PEGS.filter(p=> isUnlocked(p.world) && WORLDS[p.world]).map(p=> p.world);
  if(!G.pickerWorlds.length) G.pickerWorlds = ['tunnels'];
  // §14.5: on the very first night three lit hats are an invitation — landing
  // the highlight on Tunnels is the quiet suggestion of where to start.
  const last = getDaysPlayed()===0? 'tunnels' : LS.get('lastWorld', 'tunnels');
  let i = G.pickerWorlds.indexOf(last); if(i<0) i = 0;
  G.pickerIdx = i;
  renderPicker();
}

function pegLabel(world){ const p = RACK_PEGS.find(x=> x.world===world); return p? p.label : world; }

function renderPicker(){
  const stepping = G.pickerWorlds.length > 2;
  const single = G.pickerWorlds.length === 1;
  const sel = G.pickerWorlds[G.pickerIdx];
  // §11.5: the rack renders everywhere it appears, from day one — three hats
  // and one silhouette is the picture on night one. It reads as a collection
  // with a gap, not a locked door.
  const rackShown = CONFIG.rackEnabled && (CONFIG.pickerAlwaysAtBoot || rackVisible());
  const rack = rackShown? '<div class="rackHost" data-select="'+sel+'"></div>' : '';
  if(single){
    showPanel(
      rack +
      '<h1>Ready?</h1>'+
      '<p class="hint">Hold either button &mdash; or both &mdash; to dig in</p>'
    );
  }else if(stepping){
    showPanel(
      rack +
      '<h1>Where today?</h1>'+
      '<p class="vocab">'+pegLabel(sel)+'</p>'+
      '<p class="hint"><b class="g">Green</b> &larr; &middot; <b class="r">Red</b> &rarr; &middot; both to go there</p>'
    );
  }else{
    const left = G.pickerWorlds[0], right = G.pickerWorlds[1] || G.pickerWorlds[0];
    showPanel(
      rack +
      '<h1>Where today?</h1>'+
      '<p class="vocab"><b class="g">Green</b> &mdash; '+pegLabel(left)+'<br><b class="r">Red</b> &mdash; '+pegLabel(right)+'</p>'+
      '<p class="hint">Both together &mdash; same as last time</p>'
    );
  }
}

function stepPicker(dir){
  const n = G.pickerWorlds.length;
  G.pickerIdx = (G.pickerIdx + dir + n) % n;
  AudioFX.ack();
  renderPicker();
}
function confirmPicker(){
  G.pendingSide = null;
  chooseWorld(G.pickerWorlds[G.pickerIdx]);
}

function chooseWorld(worldId){
  G.pendingSide = null;
  AudioFX.chime();
  G.world = worldId;
  LS.set('lastWorld', worldId);
  setupStage(0);
}

let dndNudgeShown = false; // once per session, quietly (v1.1)
function showBriefing(){
  const dnd = dndNudgeShown? '' :
    '<p class="hint">Tip: turn on Do Not Disturb &mdash; the Driver can\'t see notifications coming</p>';
  dndNudgeShown = true;
  showPanel(
    '<h1>Stage '+(G.stageIdx+1)+' of 3</h1>'+
    '<p>Make a plan together!</p>'+
    '<p class="vocab"><b class="g">Green</b> is left &middot; <b class="r">Red</b> is right<br>Both together is straight on (&ldquo;keep going!&rdquo;)</p>'+
    dnd+
    '<p class="hint">Driver: eyes closed? Hold both buttons to start</p>'
  );
}

/* ---------------- Input — two buttons only, forever ----------------------- */
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
let leftHeld = false, rightHeld = false;

function press(side){
  AudioFX.unlock();
  if(G.phase==='picker'){
    // singles step/choose, the chord commits — same chord grammar everywhere
    if(G.pendingSide && G.pendingSide!==side){
      if(G.pickerWorlds.length > 2) confirmPicker();          // stepping: chord = go there
      else chooseWorld(LS.get('lastWorld', G.pickerWorlds[0])); // direct: chord = same as last
    }else if(!G.pendingSide){ G.pendingSide = side; G.pendingMs = 0; }
    return;
  }
  if(G.phase!=='junction') return; // mid-corridor presses are silently ignored
  if(G.pendingSide && G.pendingSide!==side){
    // second button landed inside the grace window — that's the chord
    chooseStraight(true);
  }else if(!G.pendingSide){
    G.pendingSide = side; G.pendingMs = 0;
  }
}

function bothPressCheck(){
  if(!(leftHeld && rightHeld)) return;
  if(!G.bothArmed) return;
  G.bothArmed = false;
  if(G.phase==='briefing') startStage();
  else if(G.phase==='reveal') nextAfterReveal();
  else if(G.phase==='runComplete'){
    if(G.rcPhase==='ceremony') showRunStats(); // §11: rack ceremony → stats
    else newRun();
  }
}

function bindButton(el, side){
  el.addEventListener('pointerdown', e=>{
    e.preventDefault();
    el.classList.add('held');
    // v1.1 per-button signature: green = one pulse, red = two — the Driver
    // verifies her grip by feel, eyes shut
    buzz(side==='left'? CONFIG.hapticSigLeft : CONFIG.hapticSigRight);
    if(side==='left') leftHeld = true; else rightHeld = true;
    press(side);
    bothPressCheck();
  });
  const up = ()=>{
    el.classList.remove('held');
    if(side==='left') leftHeld = false; else rightHeld = false;
    if(!leftHeld && !rightHeld) G.bothArmed = true;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('contextmenu', e=> e.preventDefault());
}
bindButton(btnLeft, 'left');
bindButton(btnRight, 'right');

// Accidental exits are catastrophic mid-stage: swallow touches outside the buttons.
document.addEventListener('touchstart', e=>{
  if(!e.target.closest('#controls button') && !e.target.closest('#dev') && !e.target.closest('.rackHost')) e.preventDefault();
}, {passive:false});
document.addEventListener('gesturestart', e=> e.preventDefault());

// Arrow keys mirror the buttons for desktop testing; Enter/Space/Down = chord.
window.addEventListener('keydown', e=>{
  if(e.repeat) return;
  if(e.key==='ArrowLeft'){ leftHeld = true; press('left'); bothPressCheck(); }
  else if(e.key==='ArrowRight'){ rightHeld = true; press('right'); bothPressCheck(); }
  else if(e.key==='Enter' || e.key===' ' || e.key==='ArrowDown'){
    if(G.phase==='junction'){ chooseStraight(true); return; }
    if(G.phase==='picker'){
      if(G.pickerWorlds.length > 2) confirmPicker();
      else chooseWorld(LS.get('lastWorld', G.pickerWorlds[0]));
      return;
    }
    leftHeld = true; rightHeld = true; bothPressCheck();
    leftHeld = false; rightHeld = false; G.bothArmed = true;
  }
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowLeft') leftHeld = false;
  if(e.key==='ArrowRight') rightHeld = false;
  if(!leftHeld && !rightHeld) G.bothArmed = true;
});

/* ---------------- Dev panel — tap the sky 5 times ------------------------- */
let skyTaps = [], devOpen = false;
canvas.addEventListener('pointerdown', e=>{
  if(PLAY_PHASES.has(G.phase) || G.phase==='countdown') return; // no extra targets during play
  if(e.clientY > skyH) return;
  const now = performance.now();
  skyTaps = skyTaps.filter(t=> now-t < 2500);
  skyTaps.push(now);
  if(skyTaps.length>=5){ skyTaps = []; toggleDev(); }
});

const devEl = document.getElementById('dev');
function toggleDev(){
  devOpen = !devOpen;
  devEl.style.display = devOpen? 'block':'none';
  if(devOpen) buildDevPanel();
}
function buildDevPanel(){
  let html = '<h2>Tunnels — tuning panel</h2>';
  for(const k of Object.keys(CONFIG_DEFAULTS)){
    const v = CONFIG[k];
    if(typeof CONFIG_DEFAULTS[k]==='boolean'){
      html += '<div class="row"><label>'+k+'</label><input type="checkbox" id="cfg-'+k+'" '+(v?'checked':'')+'></div>';
    }else if(typeof CONFIG_DEFAULTS[k]==='number'){
      html += '<div class="row"><label>'+k+'</label><input type="number" step="any" id="cfg-'+k+'" value="'+v+'"></div>';
    }else{
      const txt = (v===null||v===undefined)? '' : (typeof v==='string'? v : JSON.stringify(v));
      html += '<div class="row"><label>'+k+'</label><input type="text" id="cfg-'+k+'" value="'+txt.replace(/"/g,'&quot;')+'"></div>';
    }
  }
  html += '<div class="btns">'+
    '<button id="devSave">Save &amp; apply</button>'+
    '<button id="devReset">Reset to defaults</button>'+
    '<button id="devExport">Export config as JSON</button>'+
    '<button id="devPlaytest">'+(playtest?'Put the hats back':'Take all the hats down')+'</button>'+
    '<button id="devClose">Close</button></div>'+
    '<textarea id="devOut" readonly placeholder="Exported JSON appears here"></textarea>';
  devEl.innerHTML = html;
  // §11 playtest door two: toggle the sealed unlock-everything mode
  document.getElementById('devPlaytest').onclick = ()=>{
    setPlaytest(!playtest);
    buildDevPanel();
  };
  document.getElementById('devSave').onclick = ()=>{
    for(const k of Object.keys(CONFIG_DEFAULTS)){
      const el = document.getElementById('cfg-'+k);
      const def = CONFIG_DEFAULTS[k];
      if(typeof def==='boolean') CONFIG[k] = el.checked;
      else if(typeof def==='number') CONFIG[k] = Number(el.value);
      else{
        const raw = el.value.trim();
        if(raw==='') CONFIG[k] = null;
        else if(raw.startsWith('[')||raw.startsWith('{')){ try{ CONFIG[k]=JSON.parse(raw); }catch(err){} }
        else CONFIG[k] = raw;
      }
    }
    LS.set('config', CONFIG);
    applyConfigCosmetics();
    layout();
  };
  document.getElementById('devReset').onclick = ()=>{
    Object.assign(CONFIG, CONFIG_DEFAULTS);
    try{ localStorage.removeItem('tunnels:config'); }catch(err){}
    applyConfigCosmetics();
    layout();
    buildDevPanel();
  };
  document.getElementById('devExport').onclick = ()=>{
    const json = JSON.stringify(CONFIG, null, 2);
    document.getElementById('devOut').value = json;
    if(navigator.clipboard) navigator.clipboard.writeText(json).catch(()=>{});
  };
  document.getElementById('devClose').onclick = toggleDev;
}

function applyConfigCosmetics(){
  document.documentElement.style.setProperty('--colour-left', CONFIG.colourLeft);
  document.documentElement.style.setProperty('--colour-right', CONFIG.colourRight);
}

/* ---------------- Boot ---------------------------------------------------- */
applyConfigCosmetics();
G.runSeed = dailySeed();
const lastWorld = LS.get('lastWorld', 'tunnels');
G.world = WORLDS[lastWorld]? lastWorld : 'tunnels';
setupStage(0);
// §11: worlds unlock on DAYS PLAYED, not runs. Picker-at-boot: the picker
// now opens every session regardless of unlock state — locked-world
// silhouettes are the point from the very first play. The old day-5/
// playtest gate remains as a fallback if pickerAlwaysAtBoot is ever off.
if(CONFIG.pickerAlwaysAtBoot || playtest || getDaysPlayed() >= worldUnlockDay('hat')) showPicker();

function frame(now){
  const dt = Math.min(100, now - lastT);
  lastT = now;
  update(dt);
  render(now);
  updateHUD();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// exposed for the tuning panel & automated tests
window.TUNNELS = { G, CONFIG, FALLBACK_STAGES, HAT_STAGES, WORLDS, setupStage,
  dailySeed, generateStageRows, validateStage, solveMaze, chooseWorld,
  generateHatStage, placeLandmarks, LANDMARK_KINDS, placeGems, mazeRouteCells,
  advanceStreak, currentStreak, effectiveGenParams, dayNumber,
  appendJournal, dateStamp, topDownHat,
  // §11 — the hat rack, days played, par & the golden night, playtest
  getDaysPlayed, getStreakBest, deepUnlockedBy, worldUnlockDay, isUnlocked,
  rackVisible, updateProgression,
  stageParMs, newlyUnlocked, buildRackSVG, RACK_PEGS,
  setPlaytest, get playtest(){ return playtest; },
  // §12 — World Three: the forest, its cast, and the multi-leg pieces
  FOREST_STAGES, forestStageFor, generateForestStage, placeForestCast,
  effectiveForestParams, showPicker,
  // §13 — World Four: Deep Water, its ocean generation, and the fog/seen-set
  deepStageFor, generateDeepStage, placeDeepCrab, markLit, deepLitPct };
</script>
