<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tunnels</title>
<style>
  :root{
    --btnH: 22vh;
    --colour-left: #5E7C4A;
    --colour-right: #A6423A;
    --sky: #DCE3DD;
    --soil-deep: #4A3728;
    --paper: #F2E8D8;
    --ink: #33291F;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    overflow:hidden;
    background: var(--soil-deep);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
  }
  #world{ position:fixed; top:0; left:0; }

  /* ---- The only two touch targets during play ---- */
  #controls{
    position:fixed; left:0; right:0; bottom:0;
    height: calc(var(--btnH) + env(safe-area-inset-bottom));
    display:flex;
  }
  #controls button{
    flex:1 1 50%;
    border:none; margin:0; padding:0 0 env(safe-area-inset-bottom) 0;
    font-size: clamp(28px, 8vw, 48px);
    color: rgba(242,232,216,0.55);
    transition: filter 80ms;
    outline:none;
  }
  #btnLeft{ background: var(--colour-left); border-top:3px solid rgba(0,0,0,0.15); }
  #btnRight{ background: var(--colour-right); border-top:3px solid rgba(0,0,0,0.15); }
  #controls button.held{ filter: brightness(1.25); }

  /* ---- HUD (words are for the Navigator — short, friendly) ---- */
  #hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:baseline;
    padding: max(8px, env(safe-area-inset-top)) 14px 0 14px;
    font-size:15px; font-weight:700; letter-spacing:0.02em;
    pointer-events:none;
  }
  #hud .dim{ opacity:0.75; font-weight:600; }

  /* ---- Panels & banner ---- */
  .card{
    position:fixed; left:50%; transform:translateX(-50%);
    background: var(--paper); color: var(--ink);
    border-radius:18px; padding:16px 20px;
    max-width: 340px; width: calc(100% - 48px);
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    text-align:center; pointer-events:none;
  }
  #panel{ bottom: calc(var(--btnH) + env(safe-area-inset-bottom) + 18px); display:none; }
  #panel h1{ margin:0 0 6px 0; font-size:26px; font-weight:800; }
  #panel p{ margin:4px 0; font-size:16px; line-height:1.35; }
  #panel .hint{ font-size:13px; opacity:0.7; margin-top:10px; }
  #panel .badge{
    display:inline-block; background:#B23A48; color:var(--paper);
    border-radius:999px; padding:3px 12px; font-size:14px; font-weight:800;
    margin:4px 3px 0 3px;
  }
  #panel .vocab{ font-size:14px; margin-top:8px; }
  #panel .vocab b.g{ color:#5E7C4A; } #panel .vocab b.r{ color:#A6423A; }
  #panel .dim{ opacity:0.7; font-size:13px; }
  /* the journal stamp on the run-complete card (v2) */
  #panel .stamp{
    margin:12px auto 4px; padding:8px 10px 10px;
    background: rgba(0,0,0,0.04); border:1px solid rgba(51,41,31,0.15);
    border-radius:12px; max-width:220px;
  }
  #panel .stamp img{
    width:96px; height:auto; display:block; margin:0 auto 6px;
    border:1px solid rgba(51,41,31,0.2); border-radius:6px;
    image-rendering:auto;
  }
  #panel .stamp .cap{ font-size:12px; font-weight:700; letter-spacing:0.02em; }
  #panel .stamp .sub{ font-size:11px; opacity:0.65; margin-top:2px; }
  /* the hat rack (§11) — its pegs are tappable for the sealed-mode gesture */
  #panel .rackHost{ pointer-events:auto; margin:6px auto 2px; max-width:280px; }
  #panel .rackHost svg{ display:block; width:100%; height:auto; }
  #panel .golden{
    display:inline-block; margin:6px 0 2px; padding:3px 14px;
    border-radius:999px; font-size:15px; font-weight:800;
    color:#5A4A2A; background:#E9D08A; border:1px solid #C9A034;
  }
  #panel .ceremony h1{ font-size:24px; }
  #panel .ceremony .sub{ font-size:14px; opacity:0.75; margin-top:2px; }

  #banner{
    position:fixed; top:34%; left:0; right:0; display:none;
    text-align:center; font-size: clamp(34px, 10vw, 56px);
    font-weight:800; color: var(--paper);
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    pointer-events:none;
  }
  #go{
    position:fixed; top:38%; left:0; right:0; display:none;
    text-align:center; font-size: clamp(48px, 16vw, 90px);
    font-weight:800; color: var(--paper);
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    pointer-events:none;
  }

  /* ---- Dev panel (tap the sky 5 times) ---- */
  #dev{
    position:fixed; inset: 24px 16px calc(var(--btnH) + 24px) 16px;
    background: var(--paper); color:var(--ink); border-radius:14px;
    padding:14px; overflow:auto; display:none; z-index:50;
    font-size:13px;
  }
  #dev h2{ margin:0 0 8px 0; font-size:17px; }
  #dev .row{ display:flex; justify-content:space-between; align-items:center; margin:3px 0; gap:8px; }
  #dev .row label{ flex:1; }
  #dev input[type=text], #dev input[type=number]{ width:130px; padding:2px 6px; font-size:13px; }
  #dev .btns{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  #dev button{ padding:7px 12px; border-radius:8px; border:1px solid #999; background:#fff; font-size:13px; }
  #dev textarea{ width:100%; height:70px; margin-top:8px; font-size:11px; }

  @media (prefers-reduced-motion: reduce){
    #controls button{ transition:none; }
  }
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud">
  <span id="hudStage"></span>
  <span id="hudBumps" class="dim"></span>
  <span id="hudTime"></span>
</div>
<div id="panel" class="card"></div>
<div id="banner">OPEN YOUR EYES!</div>
<div id="go">Go!</div>
<div id="dev"></div>
<div id="controls">
  <button id="btnLeft" aria-label="Left — green">&#9664;</button>
  <button id="btnRight" aria-label="Right — red">&#9654;</button>
</div>

<script>
'use strict';
/* =========================================================================
   TUNNELS — v1 "Prove the ritual"
   Two players, one phone. Driver (eyes closed) has exactly two buttons:
   LEFT = GREEN, RIGHT = RED. Navigator (eyes open) steers by voice.
   See CLAUDE.md for the full spec. Two buttons only, forever.
   ========================================================================= */

/* ---------------- CONFIG — every feel-affecting number lives here -------- */
const CONFIG_DEFAULTS = {
  // movement
  digSpeed: 1.3,            // tiles/sec between junctions (World One) — buys back
                            // the time the harder mazes cost (§3.1); topology is
                            // the difficulty, duration stays put
  walkSpeed: 0.8,           // tiles per second (World Two, v2.5 — tortoise-slow is the joke)
  junctionPauseMs: 0,       // 0 = wait forever (v1 default); >0 = timed window
  bumpBouncePx: 24,         // comedy bounce distance
  bumpStunMs: 900,          // pause after bump/bonk before re-offering the junction
  // maze generation (v2) — NOW PER WORLD (§3.1). The flat keys below stay as
  // the shared defaults and the dev-panel surface, but effectiveGenParams
  // (stageIdx, world) reads genProfiles first, so World One can be raised
  // without hardening the desert, the forest and the ocean too. Note
  // stageDeadEnds/deepArms is how many arms are DEEP (2-3 tiles) — the dead-end
  // COUNT always equals the junction count.
  genProfiles: {
    // World One: raised. Everything else holds today's values.
    tunnels: { junctions:[4,6,8], deepArms:[3,5,7], chordShare:[0,0.4,0.5],
               doubleArmShare:[0,0.30,0.45], cols:11, rows:14 },
    hat:     { junctions:[2,4,6], deepArms:[1,2,3], chordShare:[0,0.4,0.5],
               doubleArmShare:[0,0,0],       cols:9,  rows:12 },
    forest:  { junctions:[2,4,6], deepArms:[1,2,3], chordShare:[1,1,1],
               doubleArmShare:[0,0,0],       cols:9,  rows:12 },
    deep:    { junctions:[2,4,6], deepArms:[1,2,3], chordShare:[0,0.4,0.5],
               doubleArmShare:[0,0,0],       cols:9,  rows:12 },
  },
  stageJunctions: [2, 4, 6],    // shared default / fallback if a profile is missing
  stageDeadEnds: [1, 2, 3],     // how many dead-end arms are deep (all junctions grow one arm)
  stageChordShare: [0, 0.4, 0.5], // fraction of junctions where the answer is the chord
  mazeCols: 9, mazeRows: 12,
  rowBudgetBase: 6,             // rows = max(profile.rows, rowBudgetBase + 2×J)
  maxJunctionsPerStage: 12,     // hard clamp applied after the streak ramp
  genAttempts: 120,             // carve attempts before the hand-authored fallback
  gemCount: 3, gemDeadEndBias: 0.8,
  // overworld generation (v2.5+)
  landmarkCount: 4,         // nameable landmarks per Hat stage
  landmarkJunctionRadius: 1,// every junction within this many tiles of a landmark
  // difficulty ramp (v2)
  streakDifficultyStep: 3,
  streakDifficultyCap: 14,
  streakSpeedMult: 1.15,    // dig-speed lever at the top difficulty notch
  // controls & accessibility
  colourLeft: '#5E7C4A', colourRight: '#A6423A',
  buttonHeightPct: 22,
  chordWindowMs: 250,       // grace period for the both-buttons straight-on chord
  hapticsEnabled: true, audioVolume: 0.8,
  pressAckEnabled: true,    // immediate tick+haptic on any accepted junction press (v1.1)
  hapticSigLeft: [20],      // press-down signature: green = one pulse (v1.1)
  hapticSigRight: [20, 60, 20], // red = two pulses (v1.1)
  // companions & silent jokes
  showDog: true, dogLagTiles: 0.85,   // how far behind the digger the dog trots
  showCat: true,            // roof cat, stage 2 onward (World One)
  showLizard: true,         // sunning lizard (World Two, v2.5)
  treasureCount: 3,         // decorative gem/gold spots per stage (never collectible)
  buriedSecondHat: true,    // World Two's silent joke (v2.5, never collectible)
  // navigator information
  showLiveDigger: true,
  positionUpdateAtJunctionsOnly: false,
  lineOfSight: false,       // Watcher sees only what's visible from the rock (v3, World Two)
  // progression & the rack (§11) — three worlds open at boot; Deep Water alone
  // is earned, and its currency is the best-ever unbroken run of nights.
  worldUnlockDays: { tunnels:0, hat:0, forest:0, deep:0 },
  deepUnlockMode: 'streak', // 'streak' (best-ever unbroken nights) | 'days' (cumulative)
  deepUnlockStreak: 7,      // best-ever streak required when deepUnlockMode === 'streak'
  deepUnlockDays: 10,       // cumulative days required when deepUnlockMode === 'days'
  rackPipThreshold: 10,     // show countable nights when this few remain
  pickerAlwaysAtBoot: true, // the picker opens every session, even with 1 hat unlocked
  rackEnabled: true,
  // the golden night (§11) — bump-free AND under par, once per calendar day
  goldenNightEnabled: true,
  parSlack: 1.25,           // multiplier on pure travel time
  junctionThinkMs: 12000,   // free deliberation per junction — deliberately generous
  goldenNightPerDay: 1,     // first qualifying run each calendar day only
  // playtest (Marty only) — URL ?unlockAll=1, dev panel, or the 4-3-2-1 gesture
  unlockAll: false,
  playtestSuppressesWrites: true,
  // World Three — The Forest (§12): two legs and a red page. Chord-only
  // junctions (the load-bearing constraint), a polite turnaround at animals,
  // and the run back up the same maze the wrong-arm way.
  forestWalkSpeed: 0.9,          // the bear's plod (tiles/sec) on the way down
  forestReturnSpeedMult: 1.4,    // faster on the run back — he knows where he's going
  forestRedPageMs: 1400,         // the full-bleed red beat ("He knows where his hat is.")
  forestAnimalCount: 4,          // animals seated at arm tips (rabbit + sleeper + others)
  forestSpeechMode: 'pictures',  // 'pictures' (pictograms) | 'words' (NO / OK)
  speakerLineMs: 1800,           // how long an animal's bubble holds before the turnaround
  forestShowRabbitOnReturn: false, // keep the rabbit hidden on leg 2 (she must remember)
  forestHintAfterBumps: 3,       // after this many wrong arms, the rabbit flickers back
  forestEasyUntilDays: 3,        // day-one Forest runs use the gentlest spine (§12)
  // World Four — Deep Water (§13): a lantern in near-black water. The map draws
  // itself as you explore; a briefing flash previews the whole ocean, then dark.
  // A big fish follows (a longer-lag dog) — visible dread, never a fail state.
  // The score is how much ocean you lit, never the hat (the ending is fixed).
  swimSpeed: 0.85,                // tiles/sec — the little fish drifts, unhurried
  deepFogRadiusTiles: 2.2,        // the lantern: how far the fish can see, open water
  deepFogPlantsRadiusTiles: 1.2,  // the fog shrinks in the dense kelp at the goal
  deepBriefingFlashMs: 4000,      // the whole ocean lit, then dark (§16.1 — dev-panel dial)
  deepPursuerLagTiles: 3.5,       // the big fish's constant unhurried distance behind
  deepShowPursuer: true,          // the dread is the Navigator's; the Driver never sees it
  crabHintTiles: 4,               // the crab lights this many tiles down the correct branch
  deepMapLitStat: true,           // "You saw N% of the ocean" — the survey, not the chase
  deepEndingMs: 2000,             // the scripted stillness before the big fish emerges (§13)
  // feel & pacing (v1)
  bounceSpeedMult: 2.5,     // how fast the digger slides back after a bump
  junctionRecueMs: 5000,    // gentle "still waiting" cue for the eyes-closed Driver
  countdownMs: 800,
  bannerMs: 2200,
  shakeMs: 450,
  // debug
  debugOverlay: false,
  seedOverride: null,
};

const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem('tunnels:'+key); return v===null? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem('tunnels:'+key, JSON.stringify(val)); }catch(e){} },
};

const CONFIG = Object.assign({}, CONFIG_DEFAULTS, LS.get('config', {}));
// URL params override everything: index.html?digSpeed=1.4&debugOverlay=true
(function applyUrlOverrides(){
  const q = new URLSearchParams(location.search);
  for(const key of Object.keys(CONFIG_DEFAULTS)){
    if(!q.has(key)) continue;
    const raw = q.get(key);
    if(raw==='true') CONFIG[key]=true;
    else if(raw==='false') CONFIG[key]=false;
    else if(raw==='null') CONFIG[key]=null;
    else if(raw.startsWith('[')||raw.startsWith('{')){ try{ CONFIG[key]=JSON.parse(raw); }catch(e){} }
    else if(raw!=='' && !isNaN(Number(raw))) CONFIG[key]=Number(raw);
    else CONFIG[key]=raw;
  }
})();

/* ---------------- Palette — picture-book earth tones --------------------- */
const PAL = {
  soilDeep: '#4A3728',
  soilWarm: '#6B4F35',
  tunnel:   '#C9A876',
  sky:      '#DCE3DD',
  gem:      '#B23A48',   // the one saturated accent — path trace on the reveal
  paper:    '#F2E8D8',
  ink:      '#33291F',
  rock:     '#3E2E21',
  root:     '#54402C',
  hat:      '#C9A034',
  skin:     '#D9B48F',
  overalls: '#5C6B78',
  spade:    '#8A8378',
};

/* ---------------- The hat rack (§11) --------------------------------------
   One peg per world, in unlock order. Each world's hat is its collectible;
   that every world has a hat is the joke of the whole series. Colours are
   each world's own; locked pegs show a pale silhouette, never a padlock.  */
const RACK_PEGS = [
  { world:'tunnels', shape:'hardhat', colour:'#C9A034', label:'Tunnels' },     // yellow hard hat
  { world:'hat',     shape:'cowboy',  colour:'#C2A06A', label:'The Hat' },      // tan cowboy hat
  { world:'forest',  shape:'pointy',  colour:'#B23A48', label:'The Forest' },   // red pointy hat
  { world:'deep',    shape:'bowler',  colour:'#3E6E9C', label:'Deep Water' },   // small blue bowler
];

/* ---------------- Hand-authored fallback stages ---------------------------
   '#' = soil, '.' = tunnel corridor, 'S' = start (dig down), 'E' = breakthrough.
   These are the shipped v1 mazes. They stay in the file permanently: the
   generator falls back to them if it ever fails, and they serve as
   regression fixtures. The pair must never see a broken maze.             */
const FALLBACK_STAGES = [
  { name:'Stage 1', rows:[   // green, red — pure side-to-side T's
    '####S####',
    '####.####',
    '####.####',
    '##.....##',
    '##.######',
    '##.######',
    '#.......#',
    '#######.#',
    '#######.#',
    '#######E#',
  ]},
  { name:'Stage 2', rows:[   // green, both, red, both — chords appear
    '######S##',
    '######.##',
    '######.##',
    '##......#',
    '##.######',
    '##....###',
    '##.######',
    '##.....##',
    '######.##',
    '###.....#',
    '#######..',
    '#######.#',
    '#######E#',
  ]},
  { name:'Stage 3', rows:[   // green, both, red, green, both, red — deepest,
    '####S####',              // with a tempting dead-end shaft at the 4th junction
    '####.####',
    '####.####',
    '#......##',
    '#.#######',
    '#..######',
    '#.#######',
    '#...#####',
    '###.#####',
    '#.....###',
    '#####.###',
    '##....###',
    '##.##.###',
    '##..#.###',
    '##.######',
    '#....####',
    '####E####',
  ]},
];

/* ---------------- Daily seed ----------------------------------------------
   Every calendar day generates the same three tunnels for everyone,
   replayable all day for personal best. seedOverride forces a seed.       */
function hash32(a, b){
  let h = 2166136261 >>> 0;
  h ^= a >>> 0; h = Math.imul(h, 16777619); h ^= h >>> 13;
  h ^= b >>> 0; h = Math.imul(h, 16777619); h ^= h >>> 13;
  return h >>> 0;
}
function dailySeed(){
  if(CONFIG.seedOverride !== null && CONFIG.seedOverride !== ''){
    return Number(CONFIG.seedOverride) >>> 0;
  }
  const d = new Date(); // device-local: "today" is the family's today
  return hash32(d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(), 0x9E3779B9);
}

/* ---------------- Procedural stage generation (M1) ------------------------
   Builds a maze as a descending spine of vertical runs. Junctions are
   placed ONLY on vertical travel — the screen-direction invariant holds by
   construction, not by luck. Each junction grows exactly one dead-end arm
   (T's: route turns left/right, arm on the other side; chords: route
   continues straight down, arm to one side). A carve-time adjacency rule —
   a new cell may touch only its predecessor — guarantees the corridor
   graph is a tree: no loops, no accidental junctions, no horizontal
   junction ever. The validator below re-checks all of it independently.  */

function tryCarve(cols, rows, J, deepTarget, chordShare, rnd, doubleArmShare){
  const grid = Array.from({length: rows}, ()=> Array(cols).fill('#'));
  const canCarve = (c,r,pc,pr)=>{
    if(c<0 || r<0 || c>=cols || r>=rows) return false;
    if(grid[r][c] !== '#') return false;
    const nb = [[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of nb){
      const nc=c+dx, nr=r+dy;
      if(nc===pc && nr===pr) continue;
      if(nc<0||nr<0||nc>=cols||nr>=rows) continue;
      if(grid[nr][nc] !== '#') return false;
    }
    return true;
  };
  const carve = (c,r)=>{ grid[r][c]='.'; };

  // which junction arms get to be deep (tempting) rather than one-cell stubs
  const deepIdx = new Set();
  const order = Array.from({length:J}, (_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
  for(let i=0;i<Math.min(deepTarget, J);i++) deepIdx.add(order[i]);

  // entry shaft from the surface
  const c0 = 2 + Math.floor(rnd()*(cols-4));
  let c = c0, r = 0;
  carve(c, 0);
  const startRun = Math.min(2 + (rnd()<0.5?1:0), rows-2-J);
  if(startRun < 1) return null;
  for(let i=1;i<=startRun;i++){ if(!canCarve(c,i,c,i-1)) return null; carve(c,i); }
  r = startRun;

  const growArm = (jc, jr, side, want)=>{ // returns cells actually carved (0 = blocked)
    let got = 0;
    for(let a=1;a<=want;a++){
      if(canCarve(jc+side*a, jr, jc+side*(a-1), jr)) got = a; else break;
    }
    for(let a=1;a<=got;a++) carve(jc+side*a, jr);
    return got;
  };

  // type quota: successful attempts contain EXACTLY the configured chord
  // share — a junction that can't fit its shape borrows from the other
  // quota, and if the quotas can't be honoured the attempt is discarded
  let chordsLeft = Math.round(J * chordShare);
  let tsLeft = J - chordsLeft;
  // double-armed crossings (§3.1): a chord junction that grows a dead arm on
  // BOTH sides — degree 4, three live answers, an extra dead end, and no extra
  // rows. Only a chord can double (a T already spends one side on the route),
  // so the quota can never exceed the chord quota. A soft quota: a junction
  // that can't fit two arms quietly falls back to one.
  let doublesLeft = Math.min(chordsLeft, Math.round(J * (doubleArmShare || 0)));

  for(let ji=0; ji<J; ji++){
    const junLeft = J - ji - 1;
    const vMax = Math.min(2, rows-2 - junLeft - r);
    if(vMax < 1) return null;
    const armWant = deepIdx.has(ji)? 2 + (rnd()<0.4?1:0) : 1;
    const snap = ()=> grid.map(row=>row.slice());
    const restore = (s)=>{ for(let i2=0;i2<rows;i2++) grid[i2]=s[i2]; };

    // Descents prefer 2 cells: a T junction can never sit directly below
    // another junction's row (its horizontals block the route or the arm),
    // so short descents starve T placement. Budget still gets the last word.
    const pickV = ()=> vMax >= 2? (rnd()<0.75? 2 : 1) : 1;

    // chord junction: route continues straight down, arm tempts to one side —
    // or, when the double quota calls for it, to BOTH sides (a 4-way crossing)
    const doChord = ()=>{
      const s0 = snap();
      const s = rnd()<0.5? 1 : -1;
      let doubled = false;
      if(doublesLeft > 0){
        // canCarve's adjacency rule already permits the second arm: its first
        // cell touches only the junction, which is its predecessor
        if(growArm(c, r, s, armWant) >= 1 && growArm(c, r, -s, armWant) >= 1) doubled = true;
        else restore(s0);   // one side wouldn't fit — back out, try a single arm
      }
      if(!doubled && growArm(c, r, s, armWant) < 1 && growArm(c, r, -s, armWant) < 1){ restore(s0); return false; }
      const V = pickV();
      let v = 0;
      for(let k=1;k<=V;k++){ if(canCarve(c, r+k, c, r+k-1)) v = k; else break; }
      if(v < 1){ restore(s0); return false; }
      for(let k=1;k<=v;k++) carve(c, r+k);
      r += v;
      if(doubled) doublesLeft--;
      return true;
    };

    // T junction: down blocked, route turns one way, dead arm the other.
    // Try the roomier side first — T's fail mostly from column crowding.
    const doT = ()=>{
      const room = (side)=>{
        let n = 0;
        for(let a=1;a<=4;a++){
          const cc = c + side*a;
          if(cc<0 || cc>=cols || grid[r][cc] !== '#') break;
          n = a;
        }
        return n;
      };
      const rl = room(-1), rr = room(1);
      const firstSide = rl===rr? (rnd()<0.5? 1 : -1) : (rl>rr? -1 : 1);
      for(const rs of [firstSide, -firstSide]){
        const s0 = snap();
        const L = 2 + Math.floor(rnd()*2);
        let routed = 0;
        for(let a=1;a<=L;a++){
          if(canCarve(c+rs*a, r, c+rs*(a-1), r)) routed = a; else break;
        }
        if(routed < 1){ restore(s0); continue; } // even a 1-cell route corners fine
        for(let a=1;a<=routed;a++) carve(c+rs*a, r);
        const c2 = c + rs*routed;
        const V = pickV();
        let v = 0;
        for(let k=1;k<=V;k++){ if(canCarve(c2, r+k, c2, r+k-1)) v = k; else break; }
        if(v < 1 || growArm(c, r, -rs, armWant) < 1){ restore(s0); continue; }
        for(let k=1;k<=v;k++) carve(c2, r+k);
        c = c2; r += v;
        return true;
      }
      return false;
    };

    // draw the type from the remaining quota (stage 1's quota is 0 chords,
    // so the teaching stage stays green/red-only by construction)
    const preferChord = chordsLeft > 0 &&
      (tsLeft === 0 || rnd() < chordsLeft/(chordsLeft + tsLeft));
    let placed = false;
    if(preferChord){
      if(doChord()){ chordsLeft--; placed = true; }
      else if(tsLeft > 0 && doT()){ tsLeft--; placed = true; }
    }else{
      if(doT()){ tsLeft--; placed = true; }
      else if(chordsLeft > 0 && doChord()){ chordsLeft--; placed = true; }
    }
    if(!placed) return null;
  }

  // final descent to the breakthrough
  for(let k=r+1;k<rows;k++){ if(!canCarve(c,k,c,k-1)) return null; carve(c,k); }
  grid[0][c0] = 'S';
  grid[rows-1][c] = 'E';
  return grid.map(row=>row.join(''));
}

function generateStageRows(stageIdx, baseSeed, params){
  const J = params? params.J : CONFIG.stageJunctions[stageIdx];
  const deep = params? params.deep : CONFIG.stageDeadEnds[stageIdx];
  const chordShare = params? params.chordShare : CONFIG.stageChordShare[stageIdx];
  const doubleArmShare = (params && params.doubleArmShare)? params.doubleArmShare : 0;
  const rows = (params && params.rows)? params.rows : CONFIG.mazeRows;
  const cols = (params && params.cols)? params.cols : CONFIG.mazeCols;
  for(let attempt=0; attempt<CONFIG.genAttempts; attempt++){
    const rnd = mulberry32(hash32(baseSeed, stageIdx*131071 + attempt*977));
    const grid = tryCarve(cols, rows, J, deep, chordShare, rnd, doubleArmShare);
    if(grid && validateStage(grid, J).ok) return grid;
  }
  return null; // caller falls back to the hand-authored stage
}

/* Independent re-check of everything the generator promises. Written to be
   trustable on its own: it never looks at how the maze was made.          */
function validateStage(rowsArr, expectedJunctions){
  const m = parseStage({name:'', rows:rowsArr});
  const issues = [];
  const cells = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++) if(m.isOpen(c,r)) cells.push({c,r});
  if(!m.start || m.start.r !== 0) issues.push('start is not on the surface');
  if(!m.exit || m.exit.r !== m.rowsN-1) issues.push('exit is not at the bottom');
  if(issues.length) return {ok:false, issues};

  // connectivity + arrival directions via BFS from the start
  const ck = (c,r)=> c+','+r;
  const parent = new Map([[ck(m.start.c, m.start.r), null]]);
  const queue = [m.start];
  while(queue.length){
    const cur = queue.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=cur.c+dx, nr=cur.r+dy;
      if(m.isOpen(nc,nr) && !parent.has(ck(nc,nr))){
        parent.set(ck(nc,nr), cur);
        queue.push({c:nc, r:nr});
      }
    }
  }
  if(parent.size !== cells.length) issues.push('maze is not fully connected');

  let edges = 0;
  cells.forEach(({c,r})=>{ if(m.isOpen(c+1,r)) edges++; if(m.isOpen(c,r+1)) edges++; });
  if(edges !== cells.length-1) issues.push('maze contains a loop');

  // Degree 4 is legal (a double-armed crossing, §3.1) but degree 5 is not — a
  // cell with every neighbour open has no unique arrival direction. The
  // vertical-entry check applies to degree-4 cells exactly as to degree-3
  // ones: that invariant, not the degree, is what a blindfolded Driver relies
  // on. Each junction is expected to grow (deg - 2) dead arms, which is 1 for
  // a T or a single-armed chord and 2 for a crossing — so an all-degree-3
  // maze still expects exactly one dead end per junction, as before.
  let jCount = 0, leaves = 0, expectedLeaves = 0;
  cells.forEach(cell=>{
    const deg = [[1,0],[-1,0],[0,1],[0,-1]]
      .filter(([dx,dy])=> m.isOpen(cell.c+dx, cell.r+dy)).length;
    if(deg >= 3){
      jCount++;
      expectedLeaves += deg - 2;
      if(deg > 4) issues.push('junction of degree '+deg+' at '+cell.c+','+cell.r);
      const p = parent.get(ck(cell.c, cell.r));
      if(!p || p.c !== cell.c) issues.push('junction entered horizontally at '+cell.c+','+cell.r);
    }
    if(deg === 1 && !(cell.c===m.start.c && cell.r===m.start.r)
                 && !(cell.c===m.exit.c && cell.r===m.exit.r)) leaves++;
  });
  if(jCount !== expectedJunctions) issues.push('junction count '+jCount+' != '+expectedJunctions);
  if(leaves !== expectedLeaves) issues.push('dead-end count '+leaves+' != expected '+expectedLeaves);
  return {ok: issues.length===0, issues};
}

/* Oracle solver: the correct green/red/both call at every junction, in
   order. Used by the automated tests, never by the game itself.           */
function solveMaze(rowsArr){
  const m = parseStage({name:'', rows:rowsArr});
  const ck = (c,r)=> c+','+r;
  const parent = new Map([[ck(m.start.c, m.start.r), null]]);
  const queue = [m.start];
  while(queue.length){
    const cur = queue.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=cur.c+dx, nr=cur.r+dy;
      if(m.isOpen(nc,nr) && !parent.has(ck(nc,nr))){
        parent.set(ck(nc,nr), cur);
        queue.push({c:nc, r:nr});
      }
    }
  }
  const path = [];
  let cur = {...m.exit};
  while(cur){ path.push(cur); cur = parent.get(ck(cur.c, cur.r)); }
  path.reverse();
  const presses = [];
  for(let i=1;i<path.length-1;i++){
    const cell = path[i];
    const entered = { dx: cell.c-path[i-1].c, dy: cell.r-path[i-1].r };
    const opts = [entered, turnLeft(entered), turnRight(entered)]
      .filter(d=> m.isOpen(cell.c+d.dx, cell.r+d.dy));
    if(opts.length > 1){
      const need = { dx: path[i+1].c-cell.c, dy: path[i+1].r-cell.r };
      presses.push(need.dx===-1? 'left' : need.dx===1? 'right' : 'both');
    }
  }
  return presses;
}

function stageRowsFor(idx){
  const gen = generateStageRows(idx, G.runSeed, effectiveGenParams(idx, 'tunnels'));
  if(gen) return { name:'Stage '+(idx+1), rows:gen, generated:true };
  const fb = FALLBACK_STAGES[idx];
  return { name: fb.name, rows: fb.rows, generated:false };
}

/* ---------------- Collectible gems (M3) -----------------------------------
   Distinct from the decorative treasure in the walls (which is never
   collectible). These sit on open cells: gemDeadEndBias of them tucked in
   dead-end tips — the tempting detour the pair decides on together, paid
   for with a bump — and the rest on the main route, grabbed on the way.
   Deterministic per daily seed so today's gems are the same all day.      */
function mazeRouteCells(m){
  const ck=(c,r)=>c+','+r;
  const parent=new Map([[ck(m.start.c,m.start.r),null]]);
  const q=[m.start];
  while(q.length){
    const cur=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=cur.c+dx,nr=cur.r+dy;
      if(m.isOpen(nc,nr)&&!parent.has(ck(nc,nr))){ parent.set(ck(nc,nr),cur); q.push({c:nc,r:nr}); }
    }
  }
  const path=[]; let cur={...m.exit};
  while(cur){ path.push({c:cur.c,r:cur.r}); cur=parent.get(ck(cur.c,cur.r)); }
  return path.reverse();
}

function placeGems(rowsArr, rnd){
  const m = parseStage({name:'', rows:rowsArr});
  const route = mazeRouteCells(m);
  const onRoute = new Set(route.map(c=>c.c+','+c.r));
  const isEnd = (c,r)=> (c===m.start.c&&r===m.start.r)||(c===m.exit.c&&r===m.exit.r);
  const deg = (c,r)=> [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>m.isOpen(c+dx,r+dy)).length;
  const shuffle = (arr)=>{ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; };

  // dead-end tips off the main route — the agonisingly-close detour
  const deadTips = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r) && !isEnd(c,r) && !onRoute.has(c+','+r) && deg(c,r)===1) deadTips.push({c,r});
  }
  const routeMid = route.filter(c=> !isEnd(c.c,c.r));
  shuffle(deadTips); shuffle(routeMid);

  const want = CONFIG.gemCount;
  const wantDead = Math.min(deadTips.length, Math.round(want * CONFIG.gemDeadEndBias));
  const gems = [], taken = new Set();
  const add = (cell, inDeadEnd)=>{
    const k = cell.c+','+cell.r;
    if(taken.has(k)) return;
    taken.add(k); gems.push({ c:cell.c, r:cell.r, collected:false, deadEnd:!!inDeadEnd });
  };
  for(let i=0;i<wantDead;i++) add(deadTips[i], true);
  for(const cell of routeMid){ if(gems.length>=want) break; add(cell, false); }
  for(let i=wantDead;i<deadTips.length && gems.length<want;i++) add(deadTips[i], true); // sparse-route fallback
  return gems;
}

/* ---------------- Streaks & capped difficulty (M2) ------------------------
   A day counts when a full 3-stage run completes. One missed day bends the
   streak without breaking it (life happens on a Tuesday); two consecutive
   missed days start a new count — no mournful copy, ever. Difficulty is a
   notch level nudged up at streak milestones and dropped two notches on a
   break, never below baseline. Notches move generator inputs only — the
   hand-authored fallbacks are never touched.                              */
function dayNumber(){
  const d = new Date(); // device-local: the family's calendar, not UTC's
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000);
}

function advanceStreak(s, today){
  const notchCap = Math.floor(CONFIG.streakDifficultyCap / CONFIG.streakDifficultyStep);
  const out = { count: s.count, lastDay: s.lastDay, notch: s.notch };
  if(s.lastDay === today) return out;               // replays never double-count
  if(s.lastDay !== null && today - s.lastDay <= 2){ // consecutive, or one-day grace
    out.count = s.count + 1;
    if(out.count % CONFIG.streakDifficultyStep === 0 && out.count <= CONFIG.streakDifficultyCap){
      out.notch = Math.min(notchCap, s.notch + 1);
    }
  }else{
    out.notch = Math.max(0, s.notch - 2);           // two notches down, never below baseline
    out.count = 1;                                  // a new count simply begins
  }
  out.lastDay = today;
  return out;
}

function currentStreak(){
  return LS.get('streak', { count: 0, lastDay: null, notch: 0 });
}

/* One lever per notch: junctions first, then dead-end depth, then speed.
   Stage 1 is never nudged — the teaching stage stays the teaching stage.
   Parameters are per world (§3.1): the profile table is what stops World One's
   raised baseline leaking into the desert, the forest and the ocean. A world
   without a profile falls back to the flat shared keys.                     */
function effectiveGenParams(stageIdx, world){
  const prof = (CONFIG.genProfiles || {})[world === undefined? G.world : world] || null;
  const base = (key, flat)=> (prof && prof[key])? prof[key][stageIdx] : CONFIG[flat][stageIdx];
  const notch = currentStreak().notch;
  let J = base('junctions', 'stageJunctions');
  let deep = base('deepArms', 'stageDeadEnds');
  if(notch >= 1 && stageIdx === 2) J += 1;
  if(notch >= 2 && stageIdx === 1) J += 1;
  if(notch >= 3 && stageIdx >= 1) deep += 1;
  J = Math.min(J, CONFIG.maxJunctionsPerStage);   // the ramp has a ceiling (§3.1)
  // rows are the constraint and rows are the screen: junctions need roughly
  // 1.75 rows each to place, so the budget scales with J rather than being fixed
  const rows = Math.max(prof? prof.rows : CONFIG.mazeRows, CONFIG.rowBudgetBase + 2*J);
  return {
    J, deep, rows,
    chordShare: base('chordShare', 'stageChordShare'),
    doubleArmShare: (prof && prof.doubleArmShare)? prof.doubleArmShare[stageIdx] : 0,
    cols: prof? prof.cols : CONFIG.mazeCols,
  };
}

function speedWithNotch(base){
  return base * (currentStreak().notch >= 4 ? CONFIG.streakSpeedMult : 1);
}

/* ---------------- Progression & the hat rack (§11) ------------------------
   Two currencies, both monotonic, both shared across all four worlds, and
   neither ever goes backwards or mentions a day that wasn't played.
   DAYS PLAYED — distinct calendar days a run was completed. It drives the
   "Day N of digging together" line, the Forest's gentle-start window and the
   journal, and gates nothing unless deepUnlockMode is flipped to 'days'.
   STREAK BEST — the longest unbroken run of nights ever managed. It is the
   one gate left in the game: three worlds are lit from the first boot, and
   Deep Water alone is earned (§11.1).                                       */

/* Playtest mode (Marty only): sealed from the real save. Three doors open
   it — the URL param, the dev panel, the 4-3-2-1 rack gesture. While on, no
   run is stamped, no night is consumed, no streak bends. Reads stay true so
   the rack renders honestly underneath the unlock-everything overlay.      */
let playtest = (CONFIG.unlockAll === true || CONFIG.unlockAll === 1 || CONFIG.unlockAll === '1')
               || LS.get('playtest', false) === true;
function shouldPersist(){ return !(playtest && CONFIG.playtestSuppressesWrites); }
function setPlaytest(on){
  playtest = !!on;
  LS.set('playtest', playtest);          // the flag itself is not sealed save-data
  AudioFX.unlockFanfare();
  buzz([20, 60, 20, 60, 20]);
}

/* Days played: read stored value, migrating from the journal on first read
   (the journal already stamps `day` per entry, so nothing is lost when the
   gate moves off runs). A pure read — the migrated value is persisted on the
   next completed run, inside updateProgression.                            */
function getDaysPlayed(){
  const stored = LS.get('daysPlayed', null);
  if(stored !== null) return stored;
  const j = LS.get('journal', []);
  return new Set((Array.isArray(j)? j : []).map(e=> e.day)).size;
}

/* Best-ever streak: the longest unbroken run of nights the pair has ever
   managed (§11.2). Monotonic by construction — it is written as a max, so a
   broken streak never pushes the last hat further away. On first read after
   this update it migrates from the journal by replaying advanceStreak over
   the distinct days it stamped: the same rule the live counter uses, so a run
   of nights already earned is never charged for twice. Never returns less
   than the stored value.                                                    */
function getStreakBest(){
  const live = currentStreak().count || 0;
  const stored = LS.get('streakBest', null);
  if(stored !== null) return Math.max(stored, live);
  const j = LS.get('journal', []);
  const days = Array.from(new Set((Array.isArray(j)? j : [])
                 .map(e=> e.day).filter(d=> typeof d === 'number')))
               .sort((a,b)=> a-b);
  let s = { count:0, lastDay:null, notch:0 }, best = 0;
  for(const d of days){ s = advanceStreak(s, d); best = Math.max(best, s.count); }
  return Math.max(best, live);
}

function worldUnlockDay(world){
  const t = CONFIG.worldUnlockDays || {};
  return (t[world] !== undefined)? t[world] : 0;
}

/* Is Deep Water earned, given a {days, streakBest} pair? Pure, so the same
   rule serves the live check and the before/after ceremony test (§17.2).    */
function deepUnlockedBy(state){
  return CONFIG.deepUnlockMode === 'streak'
    ? state.streakBest >= CONFIG.deepUnlockStreak
    : state.days >= CONFIG.deepUnlockDays;
}

/* Three worlds are lit from the very first boot (§11.3); Deep Water alone is
   earned. A pure read — buildRackSVG() calls it on every render.            */
function isUnlocked(world){
  if(playtest) return true;                 // every peg holds its hat in playtest
  if(world !== 'deep') return true;
  return deepUnlockedBy({ days: getDaysPlayed(), streakBest: getStreakBest() });
}
/* The rack is visible everywhere it appears, from day one (§11.5). */
function rackVisible(){
  return !!CONFIG.rackEnabled;
}

/* Advance the currency on a completed run. A day played is worth one night;
   a golden night (below) is worth two. Both are capped once per calendar
   day, so a replayed daily seed can't farm nights. In playtest nothing is
   written — the returned figures are for truthful on-screen display only.  */
function updateProgression(goldenQualify){
  const today = dayNumber();
  const stored = LS.get('daysPlayed', null);
  const prev = getDaysPlayed();
  let dp = prev;
  let progDay = LS.get('progDay', null);
  let goldenDay = LS.get('goldenDay', null);
  if(stored === null){
    // first read: getDaysPlayed already counted today via the just-stamped
    // journal entry, so seed the bookkeeping without double-counting.
    progDay = today;
  }else if(progDay !== today){
    dp += 1; progDay = today;              // the base night for playing today
  }
  let awardedGold = false;
  if(goldenQualify && CONFIG.goldenNightEnabled && goldenDay !== today){
    dp += 1; goldenDay = today; awardedGold = true;   // the golden bonus night
  }
  if(shouldPersist()){
    LS.set('daysPlayed', dp);
    LS.set('progDay', progDay);
    LS.set('goldenDay', goldenDay);
  }
  return { prev, now: dp, awardedGold };
}

/* Per-run par from the optimal route (§11). Derived, never authored, so it
   survives procedural generation and the streak speed lever. Par measures
   time UNDERGROUND only — the briefing is free — and is NEVER shown as a
   number; only the golden-night outcome ever surfaces.                     */
function stageParMs(maze, effectiveSpeed){
  const routeTiles = Math.max(1, mazeRouteCells(maze).length - 1);
  const junctionCount = solveMaze(maze.rows).length;
  return (routeTiles / effectiveSpeed) * 1000 * CONFIG.parSlack
       + junctionCount * CONFIG.junctionThinkMs;
}

/* Which worlds crossed their unlock threshold on this run. Both arguments are
   {days, streakBest} snapshots taken either side of the run's writes. Drives
   the unlock ceremony, which now fires exactly once in the life of the game —
   Deep Water. The three free worlds sit at threshold 0, so the day test below
   returns nothing for them and a brand-new player gets no spurious ceremony. */
function newlyUnlocked(before, after){
  return RACK_PEGS.filter(p=>{
    if(p.world === 'deep') return !deepUnlockedBy(before) && deepUnlockedBy(after);
    const d = worldUnlockDay(p.world);
    return d > before.days && d <= after.days;
  }).map(p=> p.world);
}

/* ---------------- Tiny seeded PRNG for decorative dirt ------------------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- Audio — synthesised, unlocked by the ready press ------- */
const AudioFX = (function(){
  let actx = null;
  function unlock(){
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }
    if(actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, durMs, opts){
    if(!actx) return;
    opts = opts || {};
    const t0 = actx.currentTime + (opts.delayMs||0)/1000;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(opts.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + durMs/1000);
    const vol = (opts.vol!==undefined? opts.vol : 0.25) * CONFIG.audioVolume;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs/1000);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0 + durMs/1000 + 0.05);
  }
  return {
    unlock,
    digBlip(){ tone(620, 55, {type:'sine', vol:0.06}); },
    junctionCue(){ // a soft questioning "hm?"
      tone(330, 110, {type:'triangle', vol:0.16});
      tone(415, 150, {type:'triangle', vol:0.16, delayMs:130});
    },
    bump(dry){ // thud… (dry = the Hat's shell-bonk: same family, less boing)
      tone(95, 160, {type:'sine', vol: dry? 0.42 : 0.5, slideTo:55});
      tone(190, 260, {type:'triangle', vol: dry? 0.12 : 0.22, slideTo:430, delayMs:90});
      if(!dry) tone(430, 200, {type:'triangle', vol:0.16, slideTo:150, delayMs:330});
    },
    ack(){ tone(880, 45, {type:'sine', vol:0.14}); }, // "heard you" — not "correct"
    fanfare(){
      const notes = [523, 659, 784, 1047];
      notes.forEach((f,i)=> tone(f, 220, {type:'triangle', vol:0.28, delayMs:i*130}));
      tone(1047, 480, {type:'sine', vol:0.2, delayMs:notes.length*130});
    },
    chime(){ tone(880, 200, {type:'sine', vol:0.14}); tone(1175, 260, {type:'sine', vol:0.12, delayMs:90}); },
    redPage(){ // §12: the forest's big beat — a low, certain swell, not a scare
      tone(196, 900, {type:'sine', vol:0.30, slideTo:262});
      tone(98, 1000, {type:'triangle', vol:0.16, slideTo:131});
      tone(392, 700, {type:'sine', vol:0.10, delayMs:220});
    },
    golden(){ // §11: a rising two-note chime — a golden night knows itself by sound alone
      tone(784, 260, {type:'sine', vol:0.22});
      tone(1319, 520, {type:'sine', vol:0.20, delayMs:200});
      tone(1976, 640, {type:'triangle', vol:0.10, delayMs:200});
    },
    unlockFanfare(){ // §11: the rack ceremony — distinct from the stage fanfare
      const notes = [659, 880, 1047, 1319];
      notes.forEach((f,i)=> tone(f, 260, {type:'sine', vol:0.24, delayMs:i*150}));
    },
    gem(){ // a bright little "found it!" arpeggio
      tone(1047, 90, {type:'triangle', vol:0.16});
      tone(1319, 110, {type:'triangle', vol:0.15, delayMs:70});
      tone(1568, 160, {type:'sine', vol:0.14, delayMs:150});
    },
  };
})();

function buzz(pattern){
  if(CONFIG.hapticsEnabled && navigator.vibrate){ try{ navigator.vibrate(pattern); }catch(e){} }
}

/* ---------------- Wake lock — the screen must never sleep mid-stage ------ */
let wakeLock = null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); }
  }catch(e){ /* degrade silently */ }
}
function releaseWake(){ if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; } }
document.addEventListener('visibilitychange', ()=>{
  // v1.1: re-request in ALL non-terminal phases — a slow chat over the
  // briefing map must never dim the screen either
  if(document.visibilityState==='visible' && G.phase!=='runComplete') keepAwake();
});

/* ---------------- Direction helpers --------------------------------------
   All directions are SCREEN directions — exactly what the Navigator sees.
   GREEN digs toward the screen's left, RED toward the screen's right, and
   the two-button chord digs straight on. Never digger-relative: a small
   Navigator must never have to mentally rotate.                            */
const DIRS = { up:{dx:0,dy:-1}, down:{dx:0,dy:1}, left:{dx:-1,dy:0}, right:{dx:1,dy:0} };
function turnLeft(h){ return {dx:h.dy, dy:-h.dx}; }   // geometric helpers for
function turnRight(h){ return {dx:-h.dy, dy:h.dx}; }  // junction detection only

/* ---------------- Maze parsing ------------------------------------------- */
function parseStage(stage){
  const grid = stage.rows.map(r=>r.split(''));
  let start=null, exit=null;
  grid.forEach((row,r)=> row.forEach((ch,c)=>{
    if(ch==='S') start={c,r};
    if(ch==='E') exit={c,r};
  }));
  return {
    name: stage.name,
    rows: stage.rows,
    generated: stage.generated === true,
    grid,
    cols: grid[0].length,
    rowsN: grid.length,
    start, exit,
    landmarks: stage.landmarks || null,  // World Two: nameable places
    decor: stage.decor || null,          // World Two: silent jokes
    forest: stage.forest || null,        // World Three: the cast + the rabbit's arm
    crab: stage.crab || null,            // World Four: the sunning crab that points once
    // a world may enter from the surface (dig down) or the near edge (walk up)
    startHeading: (start && start.r === grid.length-1)? {dx:0,dy:-1} : {dx:0,dy:1},
    isOpen(c,r){
      if(r<0||c<0||r>=grid.length||c>=grid[0].length) return false;
      return grid[r][c] !== '#';
    },
  };
}

/* ---------------- Layout & canvas ---------------------------------------- */
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1, cs=0, ox=0, oy=0, skyH=0, botH=0;
let staticLayer = null;
let fogLayer = null;   // World Four: the near-black water mask, erased along the swum path

function layout(){
  if(!G.maze) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const btnH = Math.round(window.innerHeight * CONFIG.buttonHeightPct/100);
  document.documentElement.style.setProperty('--btnH', btnH+'px');
  W = window.innerWidth;
  H = window.innerHeight - btnH;
  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  skyH = WORLD().topStrip();
  botH = WORLD().bottomStrip();
  cs = Math.floor(Math.min(W/G.maze.cols, (H-skyH-botH)/G.maze.rowsN));
  ox = Math.round((W - cs*G.maze.cols)/2);
  oy = skyH;
  G.crumbs = []; G.dogPrev = null;  // pixel trail is stale after relayout
  buildStaticLayer();
}
window.addEventListener('resize', layout);
if(window.visualViewport) window.visualViewport.addEventListener('resize', layout);

function cellCenter(c,r){ return { x: ox + c*cs + cs/2, y: oy + r*cs + cs/2 }; }

/* ---------------- Procedural desert (M7 / H2) -----------------------------
   The desert generates from the SAME daily seed as the tunnels but through
   its own derived stream — two fresh territories per day, one ritual. A
   generated tunnel maze is flipped vertically (invariant-preserving, the
   Seeker walks up-screen), then the landmark pass seats one DISTINCT
   nameable landmark within landmarkJunctionRadius of every junction, so
   "green at the cactus!" is always possible and never ambiguous. A maze
   that cannot seat its landmarks is rejected and re-generated; the flipped
   hand-authored stages remain the never-broken fallback.                  */
const LANDMARK_KINDS = [
  { kind:'cactus',  label:'the cactus' },
  { kind:'stones',  label:'the three stones' },
  { kind:'pool',    label:'the dark pool' },
  { kind:'log',     label:'the old log' },
  { kind:'flower',  label:'the big flower' },
  { kind:'bird',    label:'the sleepy bird' },
  { kind:'anthill', label:'the anthill' },
];
const HAT_SEED_SALT = 0x48415421; // the desert's own stream off the daily seed

function placeLandmarks(rowsArr, rnd){
  const m = parseStage({name:'', rows: rowsArr});
  const R = CONFIG.landmarkJunctionRadius;
  const junctions = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r)) continue;
    const deg = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>m.isOpen(c+dx,r+dy)).length;
    if(deg >= 3) junctions.push({c,r});
  }
  if(junctions.length > LANDMARK_KINDS.length) return null; // not enough names
  const kinds = LANDMARK_KINDS.slice();
  for(let i=kinds.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=kinds[i]; kinds[i]=kinds[j]; kinds[j]=t; }
  const used = new Set();
  const out = [];
  for(const j of junctions){
    const cand = [];
    for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
      if(dx===0 && dy===0) continue;
      const c = j.c+dx, r = j.r+dy;
      if(c<0||r<0||c>=m.cols||r>=m.rowsN) continue;
      if(m.isOpen(c,r) || used.has(c+','+r)) continue;
      cand.push({c, r, pri: Math.abs(dx)+Math.abs(dy)}); // orthogonal walls first
    }
    if(!cand.length) return null;
    const best = Math.min(...cand.map(x=>x.pri));
    const top = cand.filter(x=>x.pri===best);
    const pick = top[Math.floor(rnd()*top.length)];
    used.add(pick.c+','+pick.r);
    const k = kinds[out.length];
    out.push({ c:pick.c, r:pick.r, kind:k.kind, label:k.label });
  }
  return out;
}

function placeDecor(rowsArr, landmarks, rnd){
  const m = parseStage({name:'', rows: rowsArr});
  const used = new Set(landmarks.map(L=> L.c+','+L.r));
  const walls = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r) && !used.has(c+','+r)) walls.push({c,r});
  }
  const pickFrom = (arr)=> arr[Math.floor(rnd()*arr.length)];
  // the second hat hides near a corner of the map, as is traditional
  const cornerish = walls.filter(({c,r})=>
    (c<=1 || c>=m.cols-2) && (r<=2 || r>=m.rowsN-3));
  const secondHat = pickFrom(cornerish.length? cornerish : walls);
  const rest = walls.filter(w=> !(w.c===secondHat.c && w.r===secondHat.r));
  const lizard = pickFrom(rest.length? rest : walls);
  return { secondHat:{c:secondHat.c, r:secondHat.r}, lizard:{c:lizard.c, r:lizard.r} };
}

function generateHatStage(idx, dailySeedVal, params){
  for(let a=0; a<12; a++){
    const rows = generateStageRows(idx, hash32(dailySeedVal ^ HAT_SEED_SALT, a*7717), params);
    if(!rows) continue; // that stream came up dry — try the next one
    const flipped = rows.slice().reverse();
    const rnd = mulberry32(hash32(dailySeedVal, HAT_SEED_SALT + idx*97 + a));
    const landmarks = placeLandmarks(flipped, rnd);
    if(landmarks){
      return { rows: flipped, landmarks, decor: placeDecor(flipped, landmarks, rnd) };
    }
  }
  return null;
}

function hatStageFor(idx){
  const gen = generateHatStage(idx, G.runSeed, effectiveGenParams(idx, 'hat'));
  if(gen) return { name:'Stage '+(idx+1), rows: gen.rows, generated:true,
                   landmarks: gen.landmarks, decor: gen.decor };
  return { name:'Stage '+(idx+1), rows: HAT_STAGES[idx].rows, generated:false,
           landmarks: HAT_LANDMARKS[idx], decor: HAT_DECOR[idx] };
}

/* ---------------- World Three data — THE FOREST (§12) ---------------------
   One maze, walked twice. Leg 1: the bear enters at the top and searches DOWN
   the spine; animals sit at the tips of the side arms and the deer waits at
   the bottom. Leg 2: the run back UP the same maze to the rabbit's arm — no
   new maze, just start/exit swapped. The load-bearing constraint is that every
   junction is a CHORD (route straight down the spine, arms to one side): a
   chord leaves vertically, so the return enters vertically and the calls stay
   exactly green / red / both in both legs. Chord-only mazes are a straight
   vertical spine with horizontal dead-end arms — the generator already makes
   them (chordShare:1); these hand-authored fallbacks are the never-broken

/* Forest stages are chord-only; otherwise the streak-notch ramp is shared. */
function effectiveForestParams(idx){
  const p = effectiveGenParams(idx, 'forest');
  p.chordShare = 1;   // the whole world hangs on this (§12)
  p.doubleArmShare = 0; // an arm on both sides of the spine would break leg 2's
                        // unambiguous which-arm memory — never in this world
  // §12 gentle-start window: the Forest is reachable on night one, by a pair
  // who may not have the colour vocabulary solid yet. For the first few days
  // played, stages use their shortest spine and fewest arms whatever the
  // streak says. A floor, never a ceiling — it can only make the Forest easier.
  if(getDaysPlayed() < CONFIG.forestEasyUntilDays){
    const prof = (CONFIG.genProfiles || {}).forest;
    const easyJ = prof? prof.junctions[idx] : CONFIG.stageJunctions[idx];
    const easyDeep = prof? prof.deepArms[idx] : CONFIG.stageDeadEnds[idx];
    p.J = Math.min(p.J, easyJ);
    p.deep = Math.min(p.deep, easyDeep);
    p.rows = Math.max(prof? prof.rows : CONFIG.mazeRows, CONFIG.rowBudgetBase + 2*p.J);
  }
  return p;
}

/* The rabbit's mercy hint on leg 2, halved inside the gentle-start window. */
function forestHintBumps(){
  const n = CONFIG.forestHintAfterBumps;
  return getDaysPlayed() < CONFIG.forestEasyUntilDays? Math.max(1, Math.ceil(n/2)) : n;
}

/* Seat the cast on a generated chord-only maze: the arm tips (degree-1 open
   cells that aren't the surface start or the deer at the exit) get animals.
   One arm is the rabbit (its tip is leg 2's goal), one the sleeper, the rest
   deny/ask up to forestAnimalCount; any arms beyond that stay bare trees —
   an ordinary bump. Returns null if there's no arm to hide the rabbit in.   */
function placeForestCast(rowsArr, rnd){
  const m = parseStage({name:'', rows: rowsArr});
  const isEnd = (c,r)=> (c===m.start.c&&r===m.start.r)||(c===m.exit.c&&r===m.exit.r);
  const deg = (c,r)=> [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>m.isOpen(c+dx,r+dy)).length;
  const tips = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r) && !isEnd(c,r) && deg(c,r)===1) tips.push({c,r});
  }
  if(!tips.length) return null;
  const sh = tips.slice();
  for(let i=sh.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=sh[i]; sh[i]=sh[j]; sh[j]=t; }
  const animals = [];
  animals.push({ c:sh[0].c, r:sh[0].r, kind:'rabbit', isRabbit:true });
  if(sh[1]) animals.push({ c:sh[1].c, r:sh[1].r, kind:'sleeper' });
  const cap = Math.max(2, CONFIG.forestAnimalCount);
  for(let i=2;i<sh.length && animals.length<cap;i++){
    animals.push({ c:sh[i].c, r:sh[i].r, kind:(i%2? 'ask':'deny') });
  }
  return { animals, deer:{c:m.exit.c, r:m.exit.r}, rabbitArm:{c:sh[0].c, r:sh[0].r} };
}

function generateForestStage(idx, dailySeedVal, params){
  for(let a=0;a<16;a++){
    const rows = generateStageRows(idx, hash32(dailySeedVal ^ FOREST_SEED_SALT, a*6151), params);
    if(!rows) continue;
    const rnd = mulberry32(hash32(dailySeedVal, FOREST_SEED_SALT + idx*89 + a));
    const cast = placeForestCast(rows, rnd);
    if(cast) return { rows, forest: cast };
  }
  return null;
}

function forestStageFor(idx){
  const gen = generateForestStage(idx, G.runSeed, effectiveForestParams(idx));
  if(gen) return { name:'Stage '+(idx+1), rows: gen.rows, generated:true, forest: gen.forest };
  return { name:'Stage '+(idx+1), rows: FOREST_STAGES[idx].rows, generated:false,
           forest: FOREST_FALLBACK_CAST[idx] };
}

/* ---------------- World Four data — DEEP WATER (§13) ----------------------
   The ocean generates from the SAME daily seed as the tunnels, through its own
   derived stream — a fresh sea each day, one ritual. Mixed junctions (unlike the
   forest's chord-only spine); the standard generator already makes them, and the
   hand-authored tunnel fixtures serve as the never-broken floor. The crab sits
   beside one junction and points once down the correct branch; the dense kelp is
   the last rows before the goal, where the lantern shrinks.                  */
const DEEP_SEED_SALT = 0x44454550; // 'DEEP' — the ocean's own stream off the daily seed

/* Seat the crab beside a junction on the route (not the first or last), and
   precompute the tiles it will light down the correct branch — the route cells
   just past that junction. Returns null when the maze has no interior junction
   (then the stage simply has no crab; it is never required).                 */
function placeDeepCrab(rowsArr, rnd){
  const m = parseStage({name:'', rows: rowsArr});
  const route = mazeRouteCells(m);
  const deg = (c,r)=> [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>m.isOpen(c+dx,r+dy)).length;
  // junctions on the route, comfortably inside it
  const juncIdx = [];
  for(let i=2;i<route.length-2;i++){ if(deg(route[i].c, route[i].r) >= 3) juncIdx.push(i); }
  if(!juncIdx.length) return null;
  const pick = juncIdx[Math.floor(rnd()*juncIdx.length)];
  const j = route[pick];
  // an open neighbour of the junction that is NOT on the route — the crab's rock
  const nbrs = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({c:j.c+dx, r:j.r+dy}))
    .filter(n=> m.isOpen(n.c,n.r) && !route.some(rc=> rc.c===n.c && rc.r===n.r));
  const spot = nbrs.length? nbrs[Math.floor(rnd()*nbrs.length)] : {c:j.c, r:j.r};
  // the correct branch = the route continuing past the junction
  const hintCells = route.slice(pick+1, pick+1+CONFIG.crabHintTiles).map(c=> ({c:c.c, r:c.r}));
  return { c:spot.c, r:spot.r, hintCells };
}

function generateDeepStage(idx, dailySeedVal, params){
  for(let a=0;a<12;a++){
    const rows = generateStageRows(idx, hash32(dailySeedVal ^ DEEP_SEED_SALT, a*5119), params);
    if(!rows) continue;
    const rnd = mulberry32(hash32(dailySeedVal, DEEP_SEED_SALT + idx*83 + a));
    return { rows, crab: placeDeepCrab(rows, rnd) };
  }
  return null;
}

function deepStageFor(idx){
  const gen = generateDeepStage(idx, G.runSeed, effectiveGenParams(idx, 'deep'));
  if(gen) return { name:'Stage '+(idx+1), rows: gen.rows, generated:true, crab: gen.crab };
  // the never-broken floor: the shipped tunnel fixtures read fine as ocean corridors
  const fb = FALLBACK_STAGES[idx];
  const rnd = mulberry32(hash32(G.runSeed, DEEP_SEED_SALT + idx*97));
  return { name: fb.name, rows: fb.rows, generated:false, crab: placeDeepCrab(fb.rows, rnd) };
}

/* ---------------- Static layer dispatch ---------------------------------- */
function buildStaticLayer(){
  const m = G.maze;
  staticLayer = document.createElement('canvas');
  staticLayer.width = canvas.width; staticLayer.height = canvas.height;
  const s = staticLayer.getContext('2d');
  s.setTransform(DPR,0,0,DPR,0,0);
  // decorative details vary with the day, deterministically
  const rnd = mulberry32(hash32(G.runSeed, (G.stageIdx+1)*7919));
  WORLD().buildStatic(s, rnd, m);
}

/* ---------------- World One static layer: sky, soil, buried things ------- */
function buildStaticTunnels(s, rnd, m){
  // sky strip — quiet, pale, a thin picture-book world above
  s.fillStyle = PAL.sky; s.fillRect(0,0,W,skyH);
  drawSkyScene(s, rnd);

  // soil
  s.fillStyle = PAL.soilDeep; s.fillRect(0,skyH,W,H-skyH);
  // surface line
  s.strokeStyle = PAL.ink; s.globalAlpha = 0.35; s.lineWidth = 1;
  s.beginPath(); s.moveTo(0, skyH+0.5); s.lineTo(W, skyH+0.5); s.stroke();
  s.globalAlpha = 1;

  // undug corridors — the map the Navigator reads (mid earth, slightly lighter)
  s.fillStyle = PAL.soilWarm;
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(m.isOpen(c,r)) s.fillRect(ox+c*cs+1, oy+r*cs+1, cs-2, cs-2);
  }

  // rocks: soft blobs a shade darker, in solid soil
  s.fillStyle = PAL.rock;
  for(let r=1;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r) && rnd()<0.13){
      const px = ox+c*cs+cs*(0.25+rnd()*0.5), py = oy+r*cs+cs*(0.25+rnd()*0.5);
      const rw = cs*(0.16+rnd()*0.16), rh = rw*(0.6+rnd()*0.5);
      s.beginPath(); s.ellipse(px,py,rw,rh, rnd()*Math.PI, 0, Math.PI*2); s.fill();
    }
  }

  // roots dangling from the surface
  s.strokeStyle = PAL.root; s.lineWidth = Math.max(1, cs*0.045); s.lineCap='round';
  for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,0) && rnd()<0.55){
      let x = ox+c*cs+cs*(0.3+rnd()*0.4), y = oy;
      s.beginPath(); s.moveTo(x,y);
      const segs = 2+Math.floor(rnd()*3);
      for(let i=0;i<segs;i++){ x += (rnd()-0.5)*cs*0.5; y += cs*(0.35+rnd()*0.4); s.lineTo(x,y); }
      s.stroke();
    }
  }

  // buried oddities — silent jokes, decorative only
  const odd = ['bone','boot','teacup'];
  const spots = [];
  let guard = 0;
  while(spots.length<2 && guard++<200){
    const c = 1+Math.floor(rnd()*(m.cols-2)), r = 2+Math.floor(rnd()*(m.rowsN-3));
    if(!m.isOpen(c,r) && !spots.some(sp=>sp.c===c&&sp.r===r)) spots.push({c,r,kind:odd[Math.floor(rnd()*odd.length)]});
  }
  s.globalAlpha = 0.45;
  spots.forEach(sp=> drawOddity(s, ox+sp.c*cs+cs/2, oy+sp.r*cs+cs/2, cs*0.55, sp.kind));
  s.globalAlpha = 1;

  // spectacular treasure the digger will never find — always one wall away
  // from a tunnel, visible to the Navigator, never collectible. The joke.
  G.treasure = [];
  const nearTunnel = (c,r)=> m.isOpen(c+1,r)||m.isOpen(c-1,r)||m.isOpen(c,r+1)||m.isOpen(c,r-1);
  const tCandidates = [];
  for(let r=1;r<m.rowsN;r++) for(let c=0;c<m.cols;c++){
    if(!m.isOpen(c,r) && nearTunnel(c,r) && !spots.some(sp=>sp.c===c&&sp.r===r)) tCandidates.push({c,r});
  }
  for(let i=tCandidates.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const tmp=tCandidates[i]; tCandidates[i]=tCandidates[j]; tCandidates[j]=tmp; }
  const taken = [];
  for(const cand of tCandidates){
    if(taken.length >= CONFIG.treasureCount) break;
    if(taken.some(t=> Math.abs(t.c-cand.c)+Math.abs(t.r-cand.r) < 3)) continue;
    taken.push(cand);
  }
  taken.forEach((t,i)=>{
    const kind = i%2===0? 'gems':'gold';
    G.treasure.push({c:t.c, r:t.r, kind});
    drawTreasure(s, ox+t.c*cs+cs/2, oy+t.r*cs+cs/2, cs, kind);
  });

  // very subtle paper grain
  s.globalAlpha = 0.05;
  for(let i=0;i<W*H/160;i++){
    s.fillStyle = rnd()<0.5? '#000':'#fff';
    s.fillRect(rnd()*W, rnd()*H, 1, 1);
  }
  s.globalAlpha = 1;
}

function drawSkyScene(s, rnd){
  const gy = skyH; // ground line
  // little house
  const hw = Math.min(46, skyH*0.9), hx = W*0.16, hh = hw*0.62;
  s.fillStyle = '#B9AA96'; s.fillRect(hx, gy-hh, hw, hh);
  s.fillStyle = '#8C7B66';
  s.beginPath(); s.moveTo(hx-4, gy-hh); s.lineTo(hx+hw/2, gy-hh-hw*0.42); s.lineTo(hx+hw+4, gy-hh); s.closePath(); s.fill();
  s.fillStyle = PAL.ink; s.globalAlpha=0.5;
  s.fillRect(hx+hw*0.4, gy-hh*0.55, hw*0.2, hh*0.55); // door
  s.globalAlpha=1;
  // bare tree
  const tx = W*0.78, th = skyH*0.72;
  s.strokeStyle = '#7A6A55'; s.lineWidth = 3; s.lineCap='round';
  s.beginPath(); s.moveTo(tx, gy); s.lineTo(tx, gy-th); s.stroke();
  s.lineWidth = 2;
  s.beginPath(); s.moveTo(tx, gy-th*0.55); s.lineTo(tx-th*0.35, gy-th*0.85); s.stroke();
  s.beginPath(); s.moveTo(tx, gy-th*0.7); s.lineTo(tx+th*0.3, gy-th*0.95); s.stroke();
  s.beginPath(); s.moveTo(tx, gy-th*0.4); s.lineTo(tx+th*0.25, gy-th*0.55); s.stroke();
  // washing line with little clothes
  const lx1 = hx+hw, ly1 = gy-hh*0.8, lx2 = tx-4, ly2 = gy-th*0.6;
  s.strokeStyle = PAL.ink; s.globalAlpha=0.35; s.lineWidth=1;
  s.beginPath(); s.moveTo(lx1,ly1); s.quadraticCurveTo((lx1+lx2)/2, Math.max(ly1,ly2)+8, lx2, ly2); s.stroke();
  s.globalAlpha=0.6;
  const cols = ['#A6423A','#5E7C4A','#B9AA96'];
  for(let i=1;i<=3;i++){
    const t=i/4, x=lx1+(lx2-lx1)*t, y=ly1+(ly2-ly1)*t + Math.sin(Math.PI*t)*7;
    s.fillStyle = cols[i-1]; s.fillRect(x-4, y, 8, 9);
  }
  s.globalAlpha=1;
}

function drawTreasure(s, x, y, sz, kind){
  if(kind==='gems'){
    const gem = (gx,gy,r)=>{
      s.fillStyle = PAL.gem;
      s.beginPath();
      s.moveTo(gx, gy-r); s.lineTo(gx+r*0.8, gy); s.lineTo(gx, gy+r); s.lineTo(gx-r*0.8, gy);
      s.closePath(); s.fill();
      s.fillStyle = 'rgba(242,232,216,0.4)'; // facet glint
      s.beginPath(); s.moveTo(gx, gy-r); s.lineTo(gx+r*0.3, gy-r*0.25); s.lineTo(gx-r*0.25, gy-r*0.2);
      s.closePath(); s.fill();
    };
    gem(x-sz*0.14, y+sz*0.08, sz*0.2);
    gem(x+sz*0.16, y+sz*0.14, sz*0.14);
    gem(x+sz*0.02, y-sz*0.16, sz*0.12);
  }else{ // a little hoard of gold coins
    const coin = (gx,gy)=>{
      s.fillStyle = '#C9A034';
      s.beginPath(); s.ellipse(gx, gy, sz*0.13, sz*0.09, 0, 0, Math.PI*2); s.fill();
      s.strokeStyle = '#8F7124'; s.lineWidth = 1;
      s.beginPath(); s.ellipse(gx, gy, sz*0.13, sz*0.09, 0, 0, Math.PI*2); s.stroke();
    };
    coin(x-sz*0.16, y+sz*0.14); coin(x+sz*0.14, y+sz*0.14);
    coin(x-sz*0.01, y+sz*0.12); coin(x-sz*0.02, y-sz*0.04);
  }
}

function drawOddity(s, x, y, sz, kind){
  s.fillStyle = '#5C4835';
  if(kind==='bone'){
    s.fillRect(x-sz*0.3, y-sz*0.07, sz*0.6, sz*0.14);
    [[-0.3,-0.1],[-0.3,0.1],[0.3,-0.1],[0.3,0.1]].forEach(([ax,ay])=>{
      s.beginPath(); s.arc(x+ax*sz, y+ay*sz, sz*0.1, 0, Math.PI*2); s.fill();
    });
  }else if(kind==='boot'){
    s.fillRect(x-sz*0.15, y-sz*0.3, sz*0.28, sz*0.45);
    s.fillRect(x-sz*0.15, y+0.05*sz, sz*0.5, sz*0.16);
  }else{ // teacup
    s.beginPath(); s.arc(x, y, sz*0.24, 0, Math.PI, false); s.fill();
    s.fillRect(x-sz*0.24, y-sz*0.06, sz*0.48, sz*0.08);
    s.strokeStyle = '#5C4835'; s.lineWidth=2;
    s.beginPath(); s.arc(x+sz*0.3, y+sz*0.08, sz*0.1, -Math.PI/2, Math.PI/2); s.stroke();
  }
}

/* ---------------- Stage lifecycle ---------------------------------------- */
function key(cell){ return cell.c+','+cell.r; }

function setupStage(idx){
  G.stageIdx = idx;
  G.digSpeed = WORLD().speed();      // world base speed × streak-notch lever
  G.maze = parseStage(WORLD().stageFor(idx));
  G.cell = {...G.maze.start};
  G.heading = {...G.maze.startHeading};
  G.moveFrom = null; G.moveTo = null; G.moveT = 0;
  G.dug = new Set([key(G.cell)]);
  G.trace = [{...G.cell}];
  G.sinceJunction = [{...G.cell}];
  G.lastJunction = null;
  G.bumps = [];
  G.gems = WORLD().hasGems
    ? placeGems(G.maze.rows, mulberry32(hash32(G.runSeed, 0x6E45 + G.stageIdx)))
    : [];
  G.gemsThisStage = 0;
  G.stageMs = 0;
  // World Three: both legs live in one stage; reset the leg bookkeeping
  G.leg = 1;
  G.forest = G.maze.forest;
  G.traceLeg1 = [];
  G.legParExtra = 0;
  G.leg2Bumps = 0;
  G.hintRabbit = false;
  G.speaker = null; G.speakAfter = null;
  // World Four (§13): the seen-set, the briefing flash, the crab — reset per stage
  G.lit = new Set([key(G.cell)]);
  G.crab = G.maze.crab; G.crabPointed = false;
  G.mapLitPct = 0;
  G.deepKelpMinRow = (G.world==='deep') ? Math.max(1, G.maze.exit.r - 2) : null;
  G.flashT = (G.world==='deep') ? CONFIG.deepBriefingFlashMs : 0;
  G.helmetSlip = false;
  G.facing = 1;
  G.crumbs = []; G.dogPrev = null; G.dogFacing = 1;
  G.pendingSide = null; G.pendingMs = 0;
  G.particles = [];
  G.phase = 'briefing';
  layout();
  keepAwake(); // v1.1: from the briefing on, the screen never sleeps
  showBriefing();
}

function startStage(){
  AudioFX.unlock();
  keepAwake();
  hidePanel();
  G.phase = 'countdown';
  G.countdownT = CONFIG.countdownMs;
  document.getElementById('go').style.display = 'block';
  AudioFX.chime();
}

function beginMove(){
  G.moveFrom = {...G.cell};
  G.moveTo = { c: G.cell.c + G.heading.dx, r: G.cell.r + G.heading.dy };
  G.moveT = 0;
  if(G.heading.dx !== 0) G.facing = G.heading.dx;
  G.phase = 'digging';
}

function arriveAt(cell){
  G.cell = cell;
  G.dug.add(key(cell));
  G.trace.push({...cell});
  G.sinceJunction.push({...cell});
  AudioFX.digBlip();
  buzz(12);

  // collectible gems: automatic on touch, before the cell's own consequence
  // (a dead-end gem is grabbed on arrival, then the bump still bounces you)
  if(WORLD().hasGems){
    const g = G.gems.find(g=> !g.collected && g.c===cell.c && g.r===cell.r);
    if(g){ g.collected = true; G.gemsThisStage++; collectGemFX(cell); }
  }

  const m = G.maze;
  if(cell.c===m.exit.c && cell.r===m.exit.r){ reachGoal(); return; }

  const ahead = G.heading, left = turnLeft(G.heading), right = turnRight(G.heading);
  const options = [ahead, left, right].filter(d=> m.isOpen(cell.c+d.dx, cell.r+d.dy));

  if(options.length===0){
    // World Three, leg 1: an arm tip holding an animal is a conversation, not
    // a bump — the bear asks, then turns politely back. Bare arms still bump.
    if(WORLD().multiLeg && G.leg===1){
      const an = forestAnimalAt(cell);
      if(an){ meetAnimal(an); return; }
    }
    deadEndBump();
  }
  else if(options.length===1){ G.heading = options[0]; beginMove(); } // corners auto-turn
  else{ enterJunction(); }
}

/* Reaching the goal cell. In a single-leg world it's the breakthrough. In the
   forest it's the deer at the foot of leg 1 (→ the red page) or the rabbit's
   arm at the top of leg 2 (→ the real breakthrough). */
function reachGoal(){
  if(WORLD().multiLeg && G.leg===1){ startDeerBeat(); }
  else if(WORLD().scriptedEnding){ startDeepEnding(); }
  else breakthrough();
}

/* §13: the ending that cannot be avoided. Both fish are inside the plants; the
   camera holds in stillness (long enough to be uncomfortable, which is the
   joke), then the normal breakthrough follows. The big fish emerges wearing the
   hat in the run-complete scene — the hat was never the little fish's to keep. */
function startDeepEnding(){
  G.phase = 'deepEnding';
  G.deepEndingT = CONFIG.deepEndingMs;
  AudioFX.chime();
}

/* ---------------- World Three: the two legs & the red page (§12) ---------- */
function forestAnimalAt(cell){
  if(!G.forest) return null;
  return G.forest.animals.find(a=> a.c===cell.c && a.r===cell.r) || null;
}

/* Meeting an animal: the bear stops, a bubble holds, a soft chime marks it —
   then a POLITE turnaround back to the junction. No bonk, no shake, no bump. */
function meetAnimal(an){
  G.speaker = { cell:{...G.cell}, kind:an.kind, t:0 };
  G.speakAfter = 'turnaround';
  G.phase = 'speaking';
  AudioFX.chime();
  buzz(30);
}

/* The deer beat: the deer shows an empty hat outline, the bear fills it red —
   two identical silhouettes, and then he knows. Holds, then the red page. */
function startDeerBeat(){
  G.speaker = { cell:{...G.cell}, kind:'deer', t:0 };
  G.speakAfter = 'redpage';
  G.phase = 'speaking';
  AudioFX.chime();
  buzz(40);
}

/* The polite turnaround reuses the bounce path but skips the bump entirely. */
function politeReturn(){ startBounce(); }

/* The full-bleed red page: "He knows where his hat is." The longest haptic in
   the game. A solid hold (never a strobe) — reduced motion just drops the
   text fade. Clears into leg 2, the bear facing up. */
function startRedPage(){
  G.speaker = null;
  G.phase = 'redpage';
  G.redPageT = CONFIG.forestRedPageMs;
  AudioFX.redPage();
  buzz([700]);
}

function beginLeg2(){
  // Leg 2 is the same maze, start and exit swapped: enter at the deer cell
  // heading up, goal is the rabbit's arm tip. The trodden path stays drawn
  // (the forest doesn't forget) so the dug set is kept.
  G.traceLeg1 = G.trace.slice();
  G.legParExtra = stageParMs(G.maze, G.digSpeed); // leg-1 par, banked for the reveal
  G.leg = 2;
  G.digSpeed = WORLD().speed() * CONFIG.forestReturnSpeedMult;
  G.maze.start = {...G.forest.deer};
  G.maze.exit  = {...G.forest.rabbitArm};
  G.cell = {...G.forest.deer};
  G.heading = {...DIRS.up};
  G.trace = [{...G.cell}];
  G.sinceJunction = [{...G.cell}];
  G.lastJunction = null;
  G.speaker = null; G.speakAfter = null;
  beginMove();
}

function enterJunction(){
  G.phase = 'junction';
  G.lastJunction = { cell:{...G.cell}, heading:{...G.heading} };
  G.sinceJunction = [{...G.cell}];
  G.junctionWaitMs = 0; G.recueMs = 0;
  G.pendingSide = null; G.pendingMs = 0;
  AudioFX.junctionCue();
  buzz(30);
}

/* v1.1 press acknowledgement: an eyes-closed Driver must never wonder
   whether the game heard them. Fires on ANY accepted junction press —
   including ones about to bump. It confirms "heard you", not "correct". */
function ackPress(){
  if(!CONFIG.pressAckEnabled) return;
  AudioFX.ack();
  buzz(25);
}

function chooseAtJunction(side){ // side: 'left' | 'right' — SCREEN directions
  G.pendingSide = null;
  ackPress();
  const dir = side==='left'? DIRS.left : DIRS.right;
  const isReverse = (dir.dx === -G.heading.dx && dir.dy === -G.heading.dy);
  if(!isReverse && G.maze.isOpen(G.cell.c+dir.dx, G.cell.r+dir.dy)){
    G.heading = dir;
    beginMove();
  }else{
    inPlaceBump();
  }
}

function chooseStraight(fromPress){ // the both-buttons chord (and timed-window default)
  G.pendingSide = null;
  if(fromPress) ackPress();
  if(G.maze.isOpen(G.cell.c+G.heading.dx, G.cell.r+G.heading.dy)) beginMove();
  else inPlaceBump();
}

/* Bumps are comedy, never failure. */
function bumpFX(){
  AudioFX.bump(WORLD().bumpDry);
  buzz([200,80,160]);
  G.shakeT = CONFIG.shakeMs;
  G.helmetSlip = true;
  dustPuff();
}

function deadEndBump(){
  G.bumps.push({...G.cell});
  // §12: wrong arms on the run back earn a gentle hint after a few tries
  if(WORLD().multiLeg && G.leg===2){
    G.leg2Bumps++;
    if(G.leg2Bumps >= forestHintBumps()) G.hintRabbit = true;
  }
  bumpFX();
  G.phase = 'stunned';
  G.stunT = CONFIG.bumpStunMs;
  G.stunAfter = 'bounce';
}

function inPlaceBump(){
  G.bumps.push({...G.cell});
  bumpFX();
  G.phase = 'stunned';
  G.stunT = CONFIG.bumpStunMs;
  G.stunAfter = 'junction';
}

function startBounce(){
  // slide back along the dug corridor to the last junction
  G.bouncePath = G.sinceJunction.slice().reverse();
  G.bounceIdx = 0; G.bounceT = 0;
  G.phase = 'bouncing';
}

function endBounce(){
  const j = G.lastJunction;
  G.cell = {...j.cell};
  G.heading = {...j.heading};
  G.helmetSlip = false;
  G.trace.push({...G.cell});
  enterJunction();
}

function breakthrough(){
  G.phase = 'breakthrough';
  G.bannerT = CONFIG.bannerMs;
  AudioFX.fanfare();
  buzz([80,40,80,40,220]);
  breakthroughParticles();
  document.getElementById('banner').style.display = 'block';
}

function showReveal(){
  document.getElementById('banner').style.display = 'none';
  G.phase = 'reveal';
  G.stageTimes.push(G.stageMs);
  G.stageBumpCounts.push(G.bumps.length);
  G.stageGemCounts.push(G.gemsThisStage);
  // §11: par is time underground. In the forest, add leg 1's banked par to the
  // leg-2 maze's par so a two-leg stage is judged on the whole journey.
  G.stagePars.push(stageParMs(G.maze, G.digSpeed) + (G.legParExtra || 0));
  const gemLine = (WORLD().hasGems && G.gems.length)
    ? '<p class="vocab">Found '+G.gemsThisStage+' of '+G.gems.length+' gems &#9670;</p>' : '';
  // §13: Deep Water's achievement is the survey — how much ocean you lit.
  let litLine = '';
  if(G.world==='deep' && CONFIG.deepMapLitStat){
    G.mapLitPct = deepLitPct();
    const bestLit = LS.get('deepBestLit', 0);
    if(G.mapLitPct > bestLit && shouldPersist()) LS.set('deepBestLit', G.mapLitPct);
    litLine = '<p class="vocab">You saw '+G.mapLitPct+'% of the ocean</p>';
  }
  showPanel(
    '<h1>You made it!</h1>'+
    '<p>Time '+fmtTime(G.stageMs)+' &middot; '+WORLD().bumpNoun+' '+G.bumps.length+' &#9733;</p>'+
    gemLine+ litLine+
    (G.stageIdx<2
      ? '<p class="hint">Hold both buttons together for the next stage</p>'
      : '<p class="hint">Hold both buttons together to finish the run</p>')
  );
  AudioFX.chime();
}

function finishRun(){
  const tot = G.totals();
  const best = LS.get('best', {fastestMs:null, fewestBumps:null});
  const badges = [];
  if(best.fastestMs===null || tot.time < best.fastestMs){ best.fastestMs = tot.time; badges.push('Fastest run yet!'); }
  if(best.fewestBumps===null || tot.bumps < best.fewestBumps){ best.fewestBumps = tot.bumps; badges.push('Smoothest run yet!'); }
  if(shouldPersist()) LS.set('best', best);
  // today's tunnels are replayable all day — track the daily seed's best too
  const sbKey = 'seedbest:'+G.runSeed;
  const sb = LS.get(sbKey, {fastestMs:null, fewestBumps:null});
  let bestToday = false;
  if(sb.fastestMs===null || tot.time < sb.fastestMs){ sb.fastestMs = tot.time; bestToday = true; }
  if(sb.fewestBumps===null || tot.bumps < sb.fewestBumps){ sb.fewestBumps = tot.bumps; bestToday = true; }
  if(shouldPersist()) LS.set(sbKey, sb);
  if(bestToday && badges.length===0) badges.push('Best today!');
  const runs = (LS.get('runs', 0)) + 1;
  if(shouldPersist()) LS.set('runs', runs);
  const streak = advanceStreak(currentStreak(), dayNumber());
  const prevStreakBest = getStreakBest();  // captured before the write — the ceremony needs the pair
  if(shouldPersist()) LS.set('streak', streak);
  // §11.2: the last hat's currency. Written as a max, so it only ever grows.
  const streakBest = Math.max(prevStreakBest, streak.count);
  if(shouldPersist()) LS.set('streakBest', streakBest);
  const stamp = stampJournal(tot, streak); // one keepsake per completed run (sealed in playtest)

  // §11: the golden night — bump-free AND under par (par is time underground,
  // never shown as a number). Then advance the days-played currency.
  const parMs = G.stagePars.reduce((a,b)=> a+b, 0);
  const goldenQualify = CONFIG.goldenNightEnabled && tot.bumps===0
                        && G.stagePars.length===3 && tot.time < parMs;
  const prog = updateProgression(goldenQualify);
  const awardedGold = prog.awardedGold;

  releaseWake();
  G.phase = 'runComplete';
  G.snackT = 0;

  // build the stats card once — the ceremony (if any) defers to it on chord
  const goldHost = awardedGold? ' data-golden="1"' : '';
  const rackHtml = rackVisible()
    ? '<div class="rackHost"'+goldHost+'></div>' : '';
  const goldLine = awardedGold? '<div class="golden">A golden night.</div>' : '';
  const statsHtml =
    rackHtml + goldLine +
    '<h1>You made it!</h1>'+
    '<p class="vocab">'+WORLD().rewardLine+'</p>'+
    '<p class="vocab">Day '+streak.count+' of digging together</p>'+
    '<p>Whole run: '+fmtTime(tot.time)+' &middot; '+tot.bumps+' '+WORLD().bumpNoun.toLowerCase()+' &#9733;</p>'+
    (WORLD().hasGems? '<p class="vocab">Gems found: '+tot.gems+' &#9670;</p>' : '')+
    (badges.length? badges.map(x=>'<span class="badge">'+x+'</span>').join('') : '')+
    stamp+
    '<p class="dim">Today: '+fmtTime(sb.fastestMs)+' &middot; '+sb.fewestBumps+' bumps'+
