<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tunnels</title>
<style>
  :root{
    --btnH: 22vh;
    --colour-left: #5E7C4A;
    --colour-right: #A6423A;
    --sky: #DCE3DD;
    --soil-deep: #4A3728;
    --paper: #F2E8D8;
    --ink: #33291F;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    overflow:hidden;
    background: var(--soil-deep);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
  }
  #world{ position:fixed; top:0; left:0; }

  /* ---- The only two touch targets during play ---- */
  #controls{
    position:fixed; left:0; right:0; bottom:0;
    height: calc(var(--btnH) + env(safe-area-inset-bottom));
    display:flex;
  }
  #controls button{
    flex:1 1 50%;
    border:none; margin:0; padding:0 0 env(safe-area-inset-bottom) 0;
    font-size: clamp(28px, 8vw, 48px);
    color: rgba(242,232,216,0.55);
    transition: filter 80ms;
    outline:none;
  }
  #btnLeft{ background: var(--colour-left); border-top:3px solid rgba(0,0,0,0.15); }
  #btnRight{ background: var(--colour-right); border-top:3px solid rgba(0,0,0,0.15); }
  #controls button.held{ filter: brightness(1.25); }

  /* ---- HUD (words are for the Navigator — short, friendly) ---- */
  #hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:baseline;
    padding: max(8px, env(safe-area-inset-top)) 14px 0 14px;
    font-size:15px; font-weight:700; letter-spacing:0.02em;
    pointer-events:none;
  }
  #hud .dim{ opacity:0.75; font-weight:600; }

  /* ---- Panels & banner ---- */
  .card{
    position:fixed; left:50%; transform:translateX(-50%);
    background: var(--paper); color: var(--ink);
    border-radius:18px; padding:16px 20px;
    max-width: 340px; width: calc(100% - 48px);
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    text-align:center; pointer-events:none;
  }
  #panel{ bottom: calc(var(--btnH) + env(safe-area-inset-bottom) + 18px); display:none; }
  #panel h1{ margin:0 0 6px 0; font-size:26px; font-weight:800; }
  #panel p{ margin:4px 0; font-size:16px; line-height:1.35; }
  #panel .hint{ font-size:13px; opacity:0.7; margin-top:10px; }
  #panel .badge{
    display:inline-block; background:#B23A48; color:var(--paper);
    border-radius:999px; padding:3px 12px; font-size:14px; font-weight:800;
    margin:4px 3px 0 3px;
  }
  #panel .vocab{ font-size:14px; margin-top:8px; }
  #panel .vocab b.g{ color:#5E7C4A; } #panel .vocab b.r{ color:#A6423A; }
  #panel .dim{ opacity:0.7; font-size:13px; }

  #banner{
    position:fixed; top:34%; left:0; right:0; display:none;
    text-align:center; font-size: clamp(34px, 10vw, 56px);
    font-weight:800; color: var(--paper);
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    pointer-events:none;
  }
  #go{
    position:fixed; top:38%; left:0; right:0; display:none;
    text-align:center; font-size: clamp(48px, 16vw, 90px);
    font-weight:800; color: var(--paper);
    text-shadow: 0 3px 0 rgba(0,0,0,0.35);
    pointer-events:none;
  }

  /* ---- Dev panel (tap the sky 5 times) ---- */
  #dev{
    position:fixed; inset: 24px 16px calc(var(--btnH) + 24px) 16px;
    background: var(--paper); color:var(--ink); border-radius:14px;
    padding:14px; overflow:auto; display:none; z-index:50;
    font-size:13px;
  }
  #dev h2{ margin:0 0 8px 0; font-size:17px; }
  #dev .row{ display:flex; justify-content:space-between; align-items:center; margin:3px 0; gap:8px; }
  #dev .row label{ flex:1; }
  #dev input[type=text], #dev input[type=number]{ width:130px; padding:2px 6px; font-size:13px; }
  #dev .btns{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  #dev button{ padding:7px 12px; border-radius:8px; border:1px solid #999; background:#fff; font-size:13px; }
  #dev textarea{ width:100%; height:70px; margin-top:8px; font-size:11px; }

  @media (prefers-reduced-motion: reduce){
    #controls button{ transition:none; }
  }
</style>

<body>
<canvas id="world"></canvas>
<div id="hud">
  <span id="hudStage"></span>
  <span id="hudBumps" class="dim"></span>
  <span id="hudTime"></span>
</div>
<div id="panel" class="card"></div>
<div id="banner">OPEN YOUR EYES!</div>
<div id="go">Go!</div>
<div id="dev"></div>
<div id="controls">
  <button id="btnLeft" aria-label="Left — green">&#9664;</button>
  <button id="btnRight" aria-label="Right — red">&#9654;</button>
</div>

<script>
'use strict';
/* =========================================================================
   TUNNELS — v1 "Prove the ritual"
   Two players, one phone. Driver (eyes closed) has exactly two buttons:
   LEFT = GREEN, RIGHT = RED. Navigator (eyes open) steers by voice.
   See CLAUDE.md for the full spec. Two buttons only, forever.
   ========================================================================= */

/* ---------------- CONFIG — every feel-affecting number lives here -------- */
const CONFIG_DEFAULTS = {
  // movement
  digSpeed: 1.0,            // tiles per second between junctions (World One)
  walkSpeed: 0.8,           // tiles per second (World Two, v2.5 — tortoise-slow is the joke)
  junctionPauseMs: 0,       // 0 = wait forever (v1 default); >0 = timed window
  bumpBouncePx: 24,         // comedy bounce distance
  bumpStunMs: 900,          // pause after bump/bonk before re-offering the junction
  // maze generation (v2)
  stageJunctions: [2, 4, 6],
  stageDeadEnds: [1, 2, 3],     // how many dead-end arms are deep (all junctions grow one arm)
  stageChordShare: [0, 0.4, 0.5], // fraction of junctions where the answer is the chord
  mazeCols: 9, mazeRows: 12,
  gemCount: 2, gemDeadEndBias: 0.7,
  // overworld generation (v2.5+)
  landmarkCount: 4,         // nameable landmarks per Hat stage
  landmarkJunctionRadius: 1,// every junction within this many tiles of a landmark
  hatUnlockRuns: 5,         // completed tunnel runs before World Two appears
  // difficulty ramp (v2)
  streakDifficultyStep: 3,
  streakDifficultyCap: 14,
  streakSpeedMult: 1.15,    // dig-speed lever at the top difficulty notch
  // controls & accessibility
  colourLeft: '#5E7C4A', colourRight: '#A6423A',
  buttonHeightPct: 22,
  chordWindowMs: 250,       // grace period for the both-buttons straight-on chord
  hapticsEnabled: true, audioVolume: 0.8,
  pressAckEnabled: true,    // immediate tick+haptic on any accepted junction press (v1.1)
  hapticSigLeft: [20],      // press-down signature: green = one pulse (v1.1)
  hapticSigRight: [20, 60, 20], // red = two pulses (v1.1)
  // companions & silent jokes
  showDog: true, dogLagTiles: 0.85,   // how far behind the digger the dog trots
  showCat: true,            // roof cat, stage 2 onward (World One)
  showLizard: true,         // sunning lizard (World Two, v2.5)
  treasureCount: 3,         // decorative gem/gold spots per stage (never collectible)
  buriedSecondHat: true,    // World Two's silent joke (v2.5, never collectible)
  // navigator information
  showLiveDigger: true,
  positionUpdateAtJunctionsOnly: false,
  planTraceEnabled: true,   // briefing finger-trace + plan-vs-actual reveal (v2)
  lineOfSight: false,       // Watcher sees only what's visible from the rock (v3, World Two)
  // feel & pacing (v1)
  bounceSpeedMult: 2.5,     // how fast the digger slides back after a bump
  junctionRecueMs: 5000,    // gentle "still waiting" cue for the eyes-closed Driver
  countdownMs: 800,
  bannerMs: 2200,
  shakeMs: 450,
  // debug
  debugOverlay: false,
  seedOverride: null,
};

const LS = {
  get(key, fallback){ try{ const v = localStorage.getItem('tunnels:'+key); return v===null? fallback : JSON.parse(v); }catch(e){ return fallback; } },
  set(key, val){ try{ localStorage.setItem('tunnels:'+key, JSON.stringify(val)); }catch(e){} },
};

const CONFIG = Object.assign({}, CONFIG_DEFAULTS, LS.get('config', {}));
// URL params override everything: index.html?digSpeed=1.4&debugOverlay=true
(function applyUrlOverrides(){
  const q = new URLSearchParams(location.search);
  for(const key of Object.keys(CONFIG_DEFAULTS)){
    if(!q.has(key)) continue;
    const raw = q.get(key);
    if(raw==='true') CONFIG[key]=true;
    else if(raw==='false') CONFIG[key]=false;
    else if(raw==='null') CONFIG[key]=null;
    else if(raw.startsWith('[')){ try{ CONFIG[key]=JSON.parse(raw); }catch(e){} }
    else if(raw!=='' && !isNaN(Number(raw))) CONFIG[key]=Number(raw);
    else CONFIG[key]=raw;
  }
})();

/* ---------------- Palette — picture-book earth tones --------------------- */
const PAL = {
  soilDeep: '#4A3728',
  soilWarm: '#6B4F35',
  tunnel:   '#C9A876',
  sky:      '#DCE3DD',
  gem:      '#B23A48',   // the one saturated accent — path trace on the reveal
  paper:    '#F2E8D8',
  ink:      '#33291F',
  rock:     '#3E2E21',
  root:     '#54402C',
  hat:      '#C9A034',
  skin:     '#D9B48F',
  overalls: '#5C6B78',
  spade:    '#8A8378',
};

/* ---------------- Hand-authored fallback stages ---------------------------
   '#' = soil, '.' = tunnel corridor, 'S' = start (dig down), 'E' = breakthrough.
   These are the shipped v1 mazes. They stay in the file permanently: the
   generator falls back to them if it ever fails, and they serve as
   regression fixtures. The pair must never see a broken maze.             */
const FALLBACK_STAGES = [
  { name:'Stage 1', rows:[   // green, red — pure side-to-side T's
    '####S####',
    '####.####',
    '####.####',
    '##.....##',
    '##.######',
    '##.######',
    '#.......#',
    '#######.#',
    '#######.#',
    '#######E#',
  ]},
  { name:'Stage 2', rows:[   // green, both, red, both — chords appear
    '######S##',
    '######.##',
    '######.##',
    '##......#',
    '##.######',
    '##....###',
    '##.######',
    '##.....##',
    '######.##',
    '###.....#',
    '#######..',
    '#######.#',
    '#######E#',
  ]},
  { name:'Stage 3', rows:[   // green, both, red, green, both, red — deepest,
    '####S####',              // with a tempting dead-end shaft at the 4th junction
    '####.####',
    '####.####',
    '#......##',
    '#.#######',
    '#..######',
    '#.#######',
    '#...#####',
    '###.#####',
    '#.....###',
    '#####.###',
    '##....###',
    '##.##.###',
    '##..#.###',
    '##.######',
    '#....####',
    '####E####',
  ]},
];

/* ---------------- Daily seed ----------------------------------------------
   Every calendar day generates the same three tunnels for everyone,
   replayable all day for personal best. seedOverride forces a seed.       */
function hash32(a, b){
  let h = 2166136261 >>> 0;
  h ^= a >>> 0; h = Math.imul(h, 16777619); h ^= h >>> 13;
  h ^= b >>> 0; h = Math.imul(h, 16777619); h ^= h >>> 13;
  return h >>> 0;
}
function dailySeed(){
  if(CONFIG.seedOverride !== null && CONFIG.seedOverride !== ''){
    return Number(CONFIG.seedOverride) >>> 0;
  }
  const d = new Date(); // device-local: "today" is the family's today
  return hash32(d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(), 0x9E3779B9);
}

/* ---------------- Procedural stage generation (M1) ------------------------
   Builds a maze as a descending spine of vertical runs. Junctions are
   placed ONLY on vertical travel — the screen-direction invariant holds by
   construction, not by luck. Each junction grows exactly one dead-end arm
   (T's: route turns left/right, arm on the other side; chords: route
   continues straight down, arm to one side). A carve-time adjacency rule —
   a new cell may touch only its predecessor — guarantees the corridor
   graph is a tree: no loops, no accidental junctions, no horizontal
   junction ever. The validator below re-checks all of it independently.  */

function tryCarve(cols, rows, J, deepTarget, chordShare, rnd){
  const grid = Array.from({length: rows}, ()=> Array(cols).fill('#'));
  const canCarve = (c,r,pc,pr)=>{
    if(c<0 || r<0 || c>=cols || r>=rows) return false;
    if(grid[r][c] !== '#') return false;
    const nb = [[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of nb){
      const nc=c+dx, nr=r+dy;
      if(nc===pc && nr===pr) continue;
      if(nc<0||nr<0||nc>=cols||nr>=rows) continue;
      if(grid[nr][nc] !== '#') return false;
    }
    return true;
  };
  const carve = (c,r)=>{ grid[r][c]='.'; };

  // which junction arms get to be deep (tempting) rather than one-cell stubs
  const deepIdx = new Set();
  const order = Array.from({length:J}, (_,i)=>i);
  for(let i=order.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
  for(let i=0;i<Math.min(deepTarget, J);i++) deepIdx.add(order[i]);

  // entry shaft from the surface
  const c0 = 2 + Math.floor(rnd()*(cols-4));
  let c = c0, r = 0;
  carve(c, 0);
  const startRun = Math.min(2 + (rnd()<0.5?1:0), rows-2-J);
  if(startRun < 1) return null;
  for(let i=1;i<=startRun;i++){ if(!canCarve(c,i,c,i-1)) return null; carve(c,i); }
  r = startRun;

  const growArm = (jc, jr, side, want)=>{ // returns cells actually carved (0 = blocked)
    let got = 0;
    for(let a=1;a<=want;a++){
      if(canCarve(jc+side*a, jr, jc+side*(a-1), jr)) got = a; else break;
    }
    for(let a=1;a<=got;a++) carve(jc+side*a, jr);
    return got;
  };

  // type quota: successful attempts contain EXACTLY the configured chord
  // share — a junction that can't fit its shape borrows from the other
  // quota, and if the quotas can't be honoured the attempt is discarded
  let chordsLeft = Math.round(J * chordShare);
  let tsLeft = J - chordsLeft;

  for(let ji=0; ji<J; ji++){
    const junLeft = J - ji - 1;
    const vMax = Math.min(2, rows-2 - junLeft - r);
    if(vMax < 1) return null;
    const armWant = deepIdx.has(ji)? 2 + (rnd()<0.4?1:0) : 1;
    const snap = ()=> grid.map(row=>row.slice());
    const restore = (s)=>{ for(let i2=0;i2<rows;i2++) grid[i2]=s[i2]; };

    // Descents prefer 2 cells: a T junction can never sit directly below
    // another junction's row (its horizontals block the route or the arm),
    // so short descents starve T placement. Budget still gets the last word.
    const pickV = ()=> vMax >= 2? (rnd()<0.75? 2 : 1) : 1;

    // chord junction: route continues straight down, arm tempts to one side
    const doChord = ()=>{
      const s0 = snap();
      const s = rnd()<0.5? 1 : -1;
      if(growArm(c, r, s, armWant) < 1 && growArm(c, r, -s, armWant) < 1){ restore(s0); return false; }
      const V = pickV();
      let v = 0;
      for(let k=1;k<=V;k++){ if(canCarve(c, r+k, c, r+k-1)) v = k; else break; }
      if(v < 1){ restore(s0); return false; }
      for(let k=1;k<=v;k++) carve(c, r+k);
      r += v;
      return true;
    };

    // T junction: down blocked, route turns one way, dead arm the other.
    // Try the roomier side first — T's fail mostly from column crowding.
    const doT = ()=>{
      const room = (side)=>{
        let n = 0;
        for(let a=1;a<=4;a++){
          const cc = c + side*a;
          if(cc<0 || cc>=cols || grid[r][cc] !== '#') break;
          n = a;
        }
        return n;
      };
      const rl = room(-1), rr = room(1);
      const firstSide = rl===rr? (rnd()<0.5? 1 : -1) : (rl>rr? -1 : 1);
      for(const rs of [firstSide, -firstSide]){
        const s0 = snap();
        const L = 2 + Math.floor(rnd()*2);
        let routed = 0;
        for(let a=1;a<=L;a++){
          if(canCarve(c+rs*a, r, c+rs*(a-1), r)) routed = a; else break;
        }
        if(routed < 1){ restore(s0); continue; } // even a 1-cell route corners fine
        for(let a=1;a<=routed;a++) carve(c+rs*a, r);
        const c2 = c + rs*routed;
        const V = pickV();
        let v = 0;
        for(let k=1;k<=V;k++){ if(canCarve(c2, r+k, c2, r+k-1)) v = k; else break; }
        if(v < 1 || growArm(c, r, -rs, armWant) < 1){ restore(s0); continue; }
        for(let k=1;k<=v;k++) carve(c2, r+k);
        c = c2; r += v;
        return true;
      }
      return false;
    };

    // draw the type from the remaining quota (stage 1's quota is 0 chords,
    // so the teaching stage stays green/red-only by construction)
    const preferChord = chordsLeft > 0 &&
      (tsLeft === 0 || rnd() < chordsLeft/(chordsLeft + tsLeft));
    let placed = false;
    if(preferChord){
      if(doChord()){ chordsLeft--; placed = true; }
      else if(tsLeft > 0 && doT()){ tsLeft--; placed = true; }
    }else{
      if(doT()){ tsLeft--; placed = true; }
      else if(chordsLeft > 0 && doChord()){ chordsLeft--; placed = true; }
    }
    if(!placed) return null;
  }

  // final descent to the breakthrough
  for(let k=r+1;k<rows;k++){ if(!canCarve(c,k,c,k-1)) return null; carve(c,k); }
  grid[0][c0] = 'S';
  grid[rows-1][c] = 'E';
  return grid.map(row=>row.join(''));
}

function generateStageRows(stageIdx, baseSeed, params){
  const J = params? params.J : CONFIG.stageJunctions[stageIdx];
  const deep = params? params.deep : CONFIG.stageDeadEnds[stageIdx];
  const chordShare = params? params.chordShare : CONFIG.stageChordShare[stageIdx];
  const rows = (params && params.rows)? params.rows : CONFIG.mazeRows;
  for(let attempt=0; attempt<120; attempt++){
    const rnd = mulberry32(hash32(baseSeed, stageIdx*131071 + attempt*977));
    const grid = tryCarve(CONFIG.mazeCols, rows, J, deep, chordShare, rnd);
    if(grid && validateStage(grid, J).ok) return grid;
  }
  return null; // caller falls back to the hand-authored stage
}

/* Independent re-check of everything the generator promises. Written to be
   trustable on its own: it never looks at how the maze was made.          */
function validateStage(rowsArr, expectedJunctions){
  const m = parseStage({name:'', rows:rowsArr});
  const issues = [];
  const cells = [];
  for(let r=0;r<m.rowsN;r++) for(let c=0;c<m.cols;c++) if(m.isOpen(c,r)) cells.push({c,r});
  if(!m.start || m.start.r !== 0) issues.push('start is not on the surface');
  if(!m.exit || m.exit.r !== m.rowsN-1) issues.push('exit is not at the bottom');
  if(issues.length) return {ok:false, issues};

  // connectivity + arrival directions via BFS from the start
  const ck = (c,r)=> c+','+r;
  const parent = new Map([[ck(m.start.c, m.start.r), null]]);
  const queue = [m.start];
  while(queue.length){
    const cur = queue.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=cur.c+dx, nr=cur.r+dy;
      if(m.isOpen(nc,nr) && !parent.has(ck(nc,nr))){
        parent.set(ck(nc,nr), cur);
        queue.push({c:nc, r:nr});
      }
    }
  }
  if(parent.size !== cells.length) issues.push('maze is not fully connected');

  let edges = 0;
  cells.forEach(({c,r})=>{ if(m.isOpen(c+1,r)) edges++; if(m.isOpen(c,r+1)) edges++; });
  if(edges !== cells.length-1) issues.push('maze contains a loop');

  let jCount = 0, leaves = 0;
  cells.forEach(cell=>{
    const deg = [[1,0],[-1,0],[0,1],[0,-1]]
      .filter(([dx,dy])=> m.isOpen(cell.c+dx, cell.r+dy)).length;
    if(deg >= 3){
      jCount++;
      if(deg > 3) issues.push('4-way junction at '+cell.c+','+cell.r);
      const p = parent.get(ck(cell.c, cell.r));
      if(!p || p.c !== cell.c) issues.push('junction entered horizontally at '+cell.c+','+cell.r);
    }
    if(deg === 1 && !(cell.c===m.start.c && cell.r===m.start.r)
                 && !(cell.c===m.exit.c && cell.r===m.exit.r)) leaves++;
  });
  if(jCount !== expectedJunctions) issues.push('junction count '+jCount+' != '+expectedJunctions);
  if(leaves !== jCount) issues.push('dead-end count '+leaves+' != junction count '+jCount);
  return {ok: issues.length===0, issues};
}

/* Oracle solver: the correct green/red/both call at every junction, in
   order. Used by the automated tests, never by the game itself.           */
function solveMaze(rowsArr){
  const m = parseStage({name:'', rows:rowsArr});
  const ck = (c,r)=> c+','+r;
  const parent = new Map([[ck(m.start.c, m.start.r), null]]);
  const queue = [m.start];
  while(queue.length){
    const cur = queue.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=cur.c+dx, nr=cur.r+dy;
      if(m.isOpen(nc,nr) && !parent.has(ck(nc,nr))){
        parent.set(ck(nc,nr), cur);
        queue.push({c:nc, r:nr});
      }
    }
  }
  const path = [];
  let cur = {...m.exit};
  while(cur){ path.push(cur); cur = parent.get(ck(cur.c, cur.r)); }
  path.reverse();
  const presses = [];
  for(let i=1;i<path.length-1;i++){
    const cell = path[i];
    const entered = { dx: cell.c-path[i-1].c, dy: cell.r-path[i-1].r };
    const opts = [entered, turnLeft(entered), turnRight(entered)]
      .filter(d=> m.isOpen(cell.c+d.dx, cell.r+d.dy));
    if(opts.length > 1){
      const need = { dx: path[i+1].c-cell.c, dy: path[i+1].r-cell.r };
      presses.push(need.dx===-1? 'left' : need.dx===1? 'right' : 'both');
    }
  }
  return presses;
}

function stageRowsFor(idx){
  const gen = generateStageRows(idx, G.runSeed, effectiveGenParams(idx));
  if(gen) return { name:'Stage '+(idx+1), rows:gen, generated:true };
  const fb = FALLBACK_STAGES[idx];
  return { name: fb.name, rows: fb.rows, generated:false };
}

/* ---------------- Streaks & capped difficulty (M2) ------------------------
   A day counts when a full 3-stage run completes. One missed day bends the
   streak without breaking it (life happens on a Tuesday); two consecutive
   missed days start a new count — no mournful copy, ever. Difficulty is a
   notch level nudged up at streak milestones and dropped two notches on a
   break, never below baseline. Notches move generator inputs only — the
   hand-authored fallbacks are never touched.                              */
function dayNumber(){
  const d = new Date(); // device-local: the family's calendar, not UTC's
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000);
}

function advanceStreak(s, today){
  const notchCap = Math.floor(CONFIG.streakDifficultyCap / CONFIG.streakDifficultyStep);
  const out = { count: s.count, lastDay: s.lastDay, notch: s.notch };
  if(s.lastDay === today) return out;               // replays never double-count
  if(s.lastDay !== null && today - s.lastDay <= 2){ // consecutive, or one-day grace
    out.count = s.count + 1;
    if(out.count % CONFIG.streakDifficultyStep === 0 && out.count <= CONFIG.streakDifficultyCap){
      out.notch = Math.min(notchCap, s.notch + 1);
    }
  }else{
    out.notch = Math.max(0, s.notch - 2);           // two notches down, never below baseline
    out.count = 1;                                  // a new count simply begins
  }
  out.lastDay = today;
  return out;
}

function currentStreak(){
  return LS.get('streak', { count: 0, lastDay: null, notch: 0 });
}

/* One lever per notch: junctions first, then dead-end depth, then speed.
   Stage 1 is never nudged — the teaching stage stays the teaching stage.  */
function effectiveGenParams(stageIdx){
  const notch = currentStreak().notch;
  let J = CONFIG.stageJunctions[stageIdx];
  let deep = CONFIG.stageDeadEnds[stageIdx];
  if(notch >= 1 && stageIdx === 2) J += 1;
  if(notch >= 2 && stageIdx === 1) J += 1;
  if(notch >= 3 && stageIdx >= 1) deep += 1;
  // extra junctions buy extra rows — T junctions need breathing room
  const rows = CONFIG.mazeRows + 2*(J - CONFIG.stageJunctions[stageIdx]);
  return { J, deep, chordShare: CONFIG.stageChordShare[stageIdx], rows };
}

function speedWithNotch(base){
  return base * (currentStreak().notch >= 4 ? CONFIG.streakSpeedMult : 1);
}

/* ---------------- Tiny seeded PRNG for decorative dirt ------------------- */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- Audio — synthesised, unlocked by the ready press ------- */
const AudioFX = (function(){
  let actx = null;
  function unlock(){
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) actx = new AC();
    }
    if(actx && actx.state === 'suspended') actx.resume();
  }
  function tone(freq, durMs, opts){
    if(!actx) return;
    opts = opts || {};
    const t0 = actx.currentTime + (opts.delayMs||0)/1000;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = opts.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(opts.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, opts.slideTo), t0 + durMs/1000);
    const vol = (opts.vol!==undefined? opts.vol : 0.25) * CONFIG.audioVolume;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs/1000);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(t0); osc.stop(t0 + durMs/1000 + 0.05);
  }
  return {
    unlock,
    digBlip(){ tone(620, 55, {type:'sine', vol:0.06}); },
    junctionCue(){ // a soft questioning "hm?"
      tone(330, 110, {type:'triangle', vol:0.16});
      tone(415, 150, {type:'triangle', vol:0.16, delayMs:130});
    },
    bump(dry){ // thud… (dry = the Hat's shell-bonk: same family, less boing)
      tone(95, 160, {type:'sine', vol: dry? 0.42 : 0.5, slideTo:55});
      tone(190, 260, {type:'triangle', vol: dry? 0.12 : 0.22, slideTo:430, delayMs:90});
      if(!dry) tone(430, 200, {type:'triangle', vol:0.16, slideTo:150, delayMs:330});
    },
    ack(){ tone(880, 45, {type:'sine', vol:0.14}); }, // "heard you" — not "correct"
    fanfare(){
      const notes = [523, 659, 784, 1047];
      notes.forEach((f,i)=> tone(f, 220, {type:'triangle', vol:0.28, delayMs:i*130}));
      tone(1047, 480, {type:'sine', vol:0.2, delayMs:notes.length*130});
    },
    chime(){ tone(880, 200, {type:'sine', vol:0.14}); tone(1175, 260, {type:'sine', vol:0.12, delayMs:90}); },
  };
})();

function buzz(pattern){

async function keepAwake(){

    if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); }
  }catch(e){ /* degrade silently */ }
}

/* ---------------- Direction helpers --------------------------------------
   All directions are SCREEN directions — exactly what the Navigator sees.
   GREEN digs toward the screen's left, RED toward the screen's right, and
   the two-button chord digs straight on. Never digger-relative: a small
   Navigator must never have to mentally rotate.                            */
const DIRS = { up:{dx:0,dy:-1}, down:{dx:0,dy:1}, left:{dx:-1,dy:0}, right:{dx:1,dy:0} };
function turnLeft(h){ return {dx:h.dy, dy:-h.dx}; }   // geometric helpers for
function turnRight(h){ return {dx:-h.dy, dy:h.dx}; }  // junction detection only

/* ---------------- Maze parsing ------------------------------------------- */
function parseStage(stage){
  const grid = stage.rows.map(r=>r.split(''));
  let start=null, exit=null;
  grid.forEach((row,r)=> row.forEach((ch,c)=>{
    if(ch==='S') start={c,r};
    if(ch==='E') exit={c,r};
  }));
  return {
    name: stage.name,
    rows: stage.rows,
    generated: stage.generated === true,
    grid,
    cols: grid[0].length,
    rowsN: grid.length,
    start, exit,
    landmarks: stage.landmarks || null,  // World Two: nameable places
    decor: stage.decor || null,          // World Two: silent jokes
    // a world may enter from the surface (dig down) or the near edge (walk up)
    startHeading: (start && start.r === grid.length-1)? {dx:0,dy:-1} : {dx:0,dy:1},
    isOpen(c,r){
      if(r<0||c<0||r>=grid.length||c>=grid[0].length) return false;
      return grid[r][c] !== '#';
    },
  };
}

  if(!G.maze) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const btnH = Math.round(window.innerHeight * CONFIG.buttonHeightPct/100);
  document.documentElement.style.setProperty('--btnH', btnH+'px');
  W = window.innerWidth;
  H = window.innerHeight - btnH;
  canvas.width = Math.round(W*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);

  botH = WORLD().bottomStrip();

  oy = skyH;
  G.crumbs = []; G.dogPrev = null;  // pixel trail is stale after relayout
  buildStaticLayer();
}
